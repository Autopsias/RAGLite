services:
  # ========================================
  # PRODUCTION DATABASES (default ports)
  # ========================================
  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: raglite-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  postgresql:
    image: postgres:16
    container_name: raglite-postgresql
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=raglite
      - POSTGRES_USER=raglite
      - POSTGRES_PASSWORD=raglite
    shm_size: 256m  # Required for VACUUM operations (default 64m is too small)
    restart: unless-stopped

  # ========================================
  # TEST DATABASES (separate ports/volumes)
  # ========================================
  qdrant-test:
    image: qdrant/qdrant:v1.15.0
    container_name: raglite-qdrant-test
    ports:
      - "6335:6333"  # HTTP API (mapped to 6335)
      - "6336:6334"  # gRPC API (mapped to 6336)
    volumes:
      - ./qdrant_storage_test:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  postgresql-test:
    image: postgres:16
    container_name: raglite-postgresql-test
    ports:
      - "5433:5432"  # PostgreSQL (mapped to 5433)
    volumes:
      - ./postgresql_data_test:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=raglite_ci  # CI expects raglite_ci database
      - POSTGRES_USER=raglite_ci  # CI expects raglite_ci user
      - POSTGRES_PASSWORD=raglite_ci  # CI expects raglite_ci password
    shm_size: 256m  # Required for VACUUM operations (default 64m is too small)
    restart: unless-stopped
