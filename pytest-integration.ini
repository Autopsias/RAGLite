# pytest-integration.ini - Integration Tests Only
#
# Usage:
#   pytest -c pytest-integration.ini
#   pytest -c pytest-integration.ini --skip-ingestion  # Faster with existing data
#
# Performance: ~5-10 minutes (with --skip-ingestion)
# Requires: Docker (Qdrant, PostgreSQL)
#
# This profile includes session fixtures for:
# - Embedding model warmup (60-70s first time, cached after)
# - PDF ingestion (10s with sample PDF)
# - Database schema initialization

[pytest]
testpaths = tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --timeout=300
    --durations=10
    --durations-min=2.0
    --junitxml=test-results/pytest/junit-integration.xml
    -m "not slow and not health_check"
    # Single worker for integration tests (shared fixtures)
    -n 1
    --dist loadfile

# Async mode
asyncio_mode = auto

# Keep relevant warnings visible
filterwarnings =
    ignore::DeprecationWarning:easyocr.*
    ignore:.*benchmark.*cannot.*:UserWarning
    ignore::statsmodels.tools.sm_exceptions.ConvergenceWarning
    ignore:.*Optimization failed to converge.*:UserWarning:statsmodels.*
    ignore:.*divide by zero.*:RuntimeWarning:statsmodels.*
    ignore:.*TableItem.export_to_markdown.*:DeprecationWarning
    ignore:.*does not have valid feature names.*:UserWarning:sklearn.*
    ignore:.*Marks applied to fixtures have no effect.*:pytest.PytestRemovedIn9Warning
    ignore:raglite.ingestion.document_ingestion is deprecated.*:DeprecationWarning:raglite.ingestion.document_ingestion
    default::DeprecationWarning:raglite.*

timeout_func_only = true

markers =
    slow: marks tests as slow (excluded by default)
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as e2e tests
    preserve_collection: skip Qdrant cleanup (read-only tests)
    manages_collection_state: test modifies Qdrant collection
    postgresql_only: test only needs PostgreSQL
    health_check: marks tests as health checks (excluded)
    external_api: marks tests hitting real external APIs

cache_dir = .pytest_cache
