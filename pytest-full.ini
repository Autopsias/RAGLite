# pytest-full.ini - Full Test Suite (CI/Comprehensive)
#
# Usage:
#   pytest -c pytest-full.ini
#   TEST_USE_FULL_PDF=true pytest -c pytest-full.ini  # With 160-page PDF
#
# Performance: ~15-30 minutes (all tests including slow)
# Requires: Docker (Qdrant, PostgreSQL), all dependencies
#
# This profile runs EVERYTHING including slow tests.
# Use for CI pipelines and pre-release validation.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --timeout=600
    --durations=20
    --durations-min=5.0
    --junitxml=test-results/pytest/junit-full.xml
    # Include slow tests, exclude only health_check (external APIs)
    -m "not health_check"
    # Conservative parallelization for full suite
    -n 2
    --dist loadfile

# Async mode
asyncio_mode = auto

# Full warning configuration
filterwarnings =
    ignore::DeprecationWarning:easyocr.*
    ignore:.*benchmark.*cannot.*:UserWarning
    ignore::statsmodels.tools.sm_exceptions.ConvergenceWarning
    ignore:.*Optimization failed to converge.*:UserWarning:statsmodels.*
    ignore:.*divide by zero.*:RuntimeWarning:statsmodels.*
    ignore:.*TableItem.export_to_markdown.*:DeprecationWarning
    ignore:.*does not have valid feature names.*:UserWarning:sklearn.*
    ignore:.*Marks applied to fixtures have no effect.*:pytest.PytestRemovedIn9Warning
    ignore:raglite.ingestion.document_ingestion is deprecated.*:DeprecationWarning:raglite.ingestion.document_ingestion
    default::DeprecationWarning:raglite.*
    default::PendingDeprecationWarning:raglite.*
    default::FutureWarning:raglite.*

timeout_func_only = true

markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    smoke: marks tests as smoke tests
    p0: marks tests as P0 priority
    p1: marks tests as P1 priority
    p2: marks tests as P2 priority
    p3: marks tests as P3 priority
    test_id(id): unique test identifier
    priority(level): test priority
    preserve_collection: skip Qdrant cleanup
    manages_collection_state: test modifies Qdrant collection
    reruns: marks tests for retry
    reruns_delay: delay between reruns
    order: controls test execution order
    validation: marks validation tests
    health_check: marks health checks (excluded)
    external_api: marks external API tests
    uat: marks UAT tests
    acceptance: marks acceptance tests
    postgresql_only: test only needs PostgreSQL

cache_dir = .pytest_cache
