# Universal Pre-commit Configuration Template
# Optimized for <5 second execution with essential checks

default_language_version:
  python: python3.11
  node: '20'

fail_fast: false
default_stages: [pre-commit]
minimum_pre_commit_version: '3.0.0'

ci:
  autoupdate_schedule: weekly
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  skip: []

repos:
  # ============ UNIVERSAL FILE CHECKS ============
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: mixed-line-ending

  # ============ PYTHON-SPECIFIC CHECKS ============
  # AST syntax validation - HIGHEST PRIORITY: Catches syntax errors before commit
  # This prevents broken code from reaching CI (root cause fix)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
        name: Check Python syntax (AST)
        language: python

  # Ruff - Fast linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy - Type checking for raglite/ production code (enabled Phase 1)
  # NOTE: additional_dependencies must include all packages used in raglite/ for proper type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-settings  # Required for settings module
          - types-requests
          - anthropic
          - qdrant-client
          - sqlalchemy[mypy]  # Required for SQLAlchemy ORM type checking
          - types-setuptools
        args: [--show-error-codes, --ignore-missing-imports, --no-warn-unused-ignores]
        files: ^raglite/
        exclude: ^(raglite/tests/|raglite/ingestion/(adaptive_table/.*|chunking_strategy\.py|table_extraction\.py))

  # ============ SECURITY CHECKS ============
  # Secret detection with Gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks-scan
        args: [--verbose, --staged]
        stages: [pre-commit]

  # Bandit - Security linting for Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        # Skip common low-severity issues that are intentional in this codebase:
        # B101: assert_used (defensive programming asserts after validation)
        # B110: try_except_pass (intentional fallback behavior)
        # B112: try_except_continue (intentional skip on failure)
        # B310: urllib_urlopen (audited URL open with validation)
        # B608: hardcoded_sql_expressions (parameterized internal queries)
        args: [-r, raglite/, -f, screen, "-s", "B101,B110,B112,B310,B608"]
        exclude: (raglite/tests/|raglite/ingestion/(adaptive_table_extraction|table_extraction|chunking_strategy|adaptive_table/).*\.py)
        pass_filenames: false

  # ============ CUSTOM LOCAL HOOKS ============
  # Safety - Check for vulnerable dependencies
  - repo: local
    hooks:
      - id: safety-check
        name: safety-dependency-check
        entry: bash -c 'pip install safety 2>/dev/null && safety check --json || echo "⚠️  Safety check skipped (install safety for full security scanning)"'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Pytest marker validation - prevent CI failures from marker syntax errors
      - id: validate-pytest-markers
        name: validate-pytest-markers
        entry: python scripts/validate-pytest-markers.py
        language: python
        pass_filenames: false
        stages: [pre-commit]
        files: ^tests/.*\.py$

      # Pytestmark E402 violation check - prevent pytestmark-before-imports anti-pattern
      # Root cause: pytestmark placed before/between imports violates ruff E402
      # This prevents the #1 recurring CI failure pattern
      - id: check-pytestmark-e402
        name: check-pytestmark-e402-violations
        entry: python scripts/fix-pytestmark-e402.py --check
        language: python
        pass_filenames: false
        stages: [pre-commit]
        files: ^tests/.*\.py$

      # File size limits - prevent large file proliferation
      - id: check-file-sizes
        name: check-python-file-sizes
        entry: python scripts/check_file_sizes.py
        language: python
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

      # Pytest fixture validation - catch missing fixtures before commit
      # Root cause fix: Story 8 strategic analysis identified 78 tests failing
      # due to fixture references without fixture definitions being copied
      - id: validate-pytest-fixtures
        name: validate-pytest-fixtures
        entry: python scripts/validate-pytest-fixtures.py
        language: python
        pass_filenames: false
        stages: [pre-commit]
        files: ^tests/.*\.py$

      # Mock target validation - catch stale patch() targets after refactoring
      # Root cause fix: Story 8 strategic analysis identified 45+ test failures
      # caused by mock targets pointing to moved/renamed modules after refactoring
      # NOTE: Uses uv run to ensure project dependencies are available for validation
      # This prevents false positives when system Python lacks pandas, openpyxl, etc.
      - id: validate-mock-targets
        name: validate-mock-targets
        entry: uv run python3 scripts/validate-mock-targets.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^tests/.*\.py$

      # isinstance violation check - prevent xdist failures before commit
      # Root cause: isinstance() fails with pytest-xdist parallel workers
      # This prevents 15% of recurring CI failure pattern
      - id: check-isinstance-violations
        name: check-isinstance-violations
        entry: bash scripts/check-isinstance-violations.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^tests/.*\.py$

      # xdist_group marker validation - prevent session fixture slowdown
      # Root cause: Missing markers cause 60s embedding model load per worker
      # This prevents 10% of recurring CI failure pattern
      - id: validate-xdist-markers
        name: validate-xdist-markers
        entry: uv run python3 scripts/validate-xdist-markers.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^tests/integration/.*\.py$

      # Deferred import detection - prevent test performance regressions
      # Root cause: Tests importing raglite.main inside functions cause 5-15s overhead
      # This prevents 12% of recurring CI timeout pattern
      - id: check-deferred-imports
        name: check-deferred-imports
        entry: bash scripts/check-deferred-imports.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
        files: ^tests/.*test_.*\.py$
        # Exclude files with intentional deferred imports:
        # - test_story_7_4_integration.py: Tests MCP registration behavior
        # - test_scheduler_integration.py: Tests scheduler with mock isolation
        # - test_tft_training*.py: Tests TFT training with scheduler
        # - test_accuracy_performance.py: VS Code test discovery optimization
        # - test_search_core.py: VS Code test discovery optimization
        exclude: (test_story_7_4_integration|test_scheduler_integration|test_tft_training(_integration)?|test_accuracy_performance|test_search_core)\.py$

      # Mock coverage validation - prevent get_mistral_client mock gaps
      # Root cause: 17+ modules import get_mistral_client but only 5 patched
      # New modules bypass mock coverage causing 401 Unauthorized errors
      # This prevents mock coverage gaps before commit
      - id: validate-mock-coverage
        name: validate-mock-coverage
        entry: python scripts/validate-mock-coverage.py
        language: python
        pass_filenames: false
        stages: [pre-commit]
        files: ^(raglite/.*\.py|tests/fixtures/mock_clients\.py)$
