# pytest-unit.ini - Unit Tests Only (FASTEST)
#
# Usage:
#   pytest -c pytest-unit.ini
#   pytest -c pytest-unit.ini tests/unit/
#
# VS Code: Configure in .vscode/settings.json:
#   "python.testing.pytestArgs": ["-c", "pytest-unit.ini"]
#
# Performance: ~60-120 seconds for ~3500 unit tests
# No external dependencies, no fixtures, no Docker required

[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Optimized for speed - minimal output, short tracebacks
addopts =
    -v
    --tb=line
    --strict-markers
    --strict-config
    -ra
    --timeout=60
    --durations=5
    --durations-min=1.0
    --junitxml=test-results/pytest/junit-unit.xml
    -m "not slow and not health_check and not integration and not e2e"
    # Parallel execution safe for unit tests (no shared state)
    -n auto
    --dist loadfile

# Async mode
asyncio_mode = auto

# Aggressive warning suppression for speed
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Fast timeout (unit tests should be <1s each)
timeout_func_only = true

# All markers needed (pytest hooks add markers dynamically)
markers =
    slow: marks tests as slow (excluded)
    unit: marks tests as unit tests
    integration: marks tests as integration tests (excluded)
    e2e: marks tests as e2e tests (excluded)
    health_check: marks tests as health checks (excluded)
    preserve_collection: skip Qdrant cleanup (read-only tests)
    manages_collection_state: test modifies Qdrant collection
    postgresql_only: test only needs PostgreSQL
    external_api: marks tests hitting real external APIs
    smoke: marks tests as smoke tests
    p0: marks tests as P0 priority
    p1: marks tests as P1 priority
    p2: marks tests as P2 priority
    p3: marks tests as P3 priority
    test_id(id): unique test identifier
    priority(level): test priority
    reruns: marks tests for retry
    reruns_delay: delay between reruns
    order: controls test execution order
    validation: marks validation tests
    uat: marks UAT tests
    acceptance: marks acceptance tests

cache_dir = .pytest_cache
