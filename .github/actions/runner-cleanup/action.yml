name: 'Runner Resource Cleanup'
description: 'Aggressively clean zombie processes and reclaim memory on self-hosted runners'

inputs:
  cleanup-level:
    description: 'Cleanup intensity: light (processes only), medium (+ Docker), aggressive (+ Colima profiles)'
    required: false
    default: 'medium'
  min-free-memory-mb:
    description: 'Minimum free memory in MB to consider cleanup successful'
    required: false
    default: '4096'

runs:
  using: 'composite'
  steps:
    - name: Kill Zombie Processes
      shell: bash
      run: |
        echo "=== Runner Resource Cleanup ==="

        # Get initial memory state
        FREE_BEFORE=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
        FREE_MB_BEFORE=$((FREE_BEFORE * 4096 / 1024 / 1024))
        echo "Memory before cleanup: ${FREE_MB_BEFORE}MB"

        echo ""
        echo "--- Step 1: Kill QEMU processes ---"
        pkill -9 -f "qemu-system" 2>/dev/null && echo "Killed QEMU processes" || echo "No QEMU processes"

        echo ""
        echo "--- Step 2: Kill Lima processes ---"
        pkill -9 -f "limactl" 2>/dev/null && echo "Killed limactl" || echo "No limactl"
        pkill -9 -f "lima-guestagent" 2>/dev/null && echo "Killed lima-guestagent" || echo "No lima-guestagent"

        echo ""
        echo "--- Step 3: Kill resource_tracker/multiprocessing ---"
        pkill -9 -f "resource_tracker" 2>/dev/null && echo "Killed resource_tracker" || echo "No resource_tracker"
        pkill -9 -f "multiprocessing" 2>/dev/null && echo "Killed multiprocessing" || echo "No multiprocessing"

        echo ""
        echo "--- Step 4: Kill orphaned Python processes ---"
        pkill -9 -f "pytest" 2>/dev/null && echo "Killed pytest" || echo "No pytest"
        pkill -9 -f "python.*raglite" 2>/dev/null && echo "Killed raglite python" || echo "No raglite python"

        # Wait for memory to be reclaimed
        sleep 3

        # Check memory after
        FREE_AFTER=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
        FREE_MB_AFTER=$((FREE_AFTER * 4096 / 1024 / 1024))
        RECLAIMED=$((FREE_MB_AFTER - FREE_MB_BEFORE))

        echo ""
        echo "=== Cleanup Results ==="
        echo "Memory before: ${FREE_MB_BEFORE}MB"
        echo "Memory after:  ${FREE_MB_AFTER}MB"
        echo "Reclaimed:     ${RECLAIMED}MB"

        # Export for next step
        echo "FREE_MEMORY_MB=${FREE_MB_AFTER}" >> $GITHUB_ENV

    - name: Docker Resource Cleanup
      if: inputs.cleanup-level == 'medium' || inputs.cleanup-level == 'aggressive'
      shell: bash
      run: |
        echo ""
        echo "--- Step 5: Docker resource cleanup ---"

        # Only if Docker is accessible
        if docker info >/dev/null 2>&1; then
          echo "Pruning stopped containers..."
          docker container prune -f 2>/dev/null || true

          echo "Pruning unused volumes..."
          docker volume prune -f 2>/dev/null || true

          echo "Pruning unused networks..."
          docker network prune -f 2>/dev/null || true

          echo "Pruning dangling images..."
          docker image prune -f 2>/dev/null || true
        else
          echo "Docker not accessible, skipping Docker cleanup"
        fi

    - name: Colima Profile Cleanup
      if: inputs.cleanup-level == 'aggressive'
      shell: bash
      run: |
        echo ""
        echo "--- Step 6: Colima profile cleanup ---"

        # List and stop all CI profiles
        for PROFILE in ci-postgresql ci-other ci-test; do
          if colima status -p "$PROFILE" 2>/dev/null | grep -q "Running"; then
            echo "Stopping Colima profile: $PROFILE"
            colima stop -p "$PROFILE" -f 2>/dev/null || true
          fi
        done

        # Remove stale Lima network state
        echo "Cleaning Lima network state..."
        rm -rf "$HOME/.colima/_lima/_networks" 2>/dev/null || true

        # Final memory check
        sleep 2
        FREE_FINAL=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
        FREE_MB_FINAL=$((FREE_FINAL * 4096 / 1024 / 1024))
        echo "Final free memory: ${FREE_MB_FINAL}MB"

    - name: Validate Memory Recovery
      shell: bash
      env:
        MIN_FREE_MB: ${{ inputs.min-free-memory-mb }}
      run: |
        FREE_MB="${FREE_MEMORY_MB:-0}"

        if [ "$FREE_MB" -lt "$MIN_FREE_MB" ]; then
          echo "WARNING: Only ${FREE_MB}MB free after cleanup (target: ${MIN_FREE_MB}MB)"
          echo "   Runner may need manual intervention"
        else
          echo "Memory recovery successful: ${FREE_MB}MB free"
        fi
