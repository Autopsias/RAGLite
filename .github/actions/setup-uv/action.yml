name: 'Setup UV'
description: 'Install UV package manager with retry logic'
runs:
  using: 'composite'
  steps:
    - name: Install uv
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if curl --retry 3 -LsSf https://astral.sh/uv/install.sh | sh; then
            echo "$HOME/.local/bin" >> $GITHUB_PATH
            uv --version && exit 0
          fi
          echo "UV installation attempt $attempt failed, retrying..."
          sleep 2
        done
        echo "UV installation failed after 3 attempts"
        exit 1
