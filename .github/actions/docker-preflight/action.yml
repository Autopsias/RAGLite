name: 'Docker Pre-flight Validation'
description: 'Validates Docker daemon availability and starts Colima if needed with exponential backoff'

inputs:
  max-wait-seconds:
    description: 'Maximum seconds to wait for Docker daemon to be ready'
    required: false
    default: '90'
  check-ports:
    description: 'Comma-separated list of ports to validate (e.g., "6333,5432")'
    required: false
    default: ''
  skip-colima-restart:
    description: 'Skip Colima restart, only verify Docker is accessible'
    required: false
    default: 'false'
  colima-profile:
    description: 'Colima profile name for isolated Docker daemon (enables true parallel execution)'
    required: false
    default: 'default'

runs:
  using: 'composite'
  steps:
    - name: Setup Docker Config (Bypass Keychain)
      shell: bash
      run: |
        # Create isolated Docker config to bypass macOS keychain credential helper
        # credHelpers with empty strings explicitly disable helpers BEFORE PATH auto-detection
        DOCKER_CFG="$HOME/.docker-ci-config"
        mkdir -p "$DOCKER_CFG"
        cat > "$DOCKER_CFG/config.json" << 'DOCKERCFG'
        {
          "auths": {},
          "credHelpers": {
            "docker.io": "",
            "index.docker.io": "",
            "registry-1.docker.io": "",
            "ghcr.io": "",
            "quay.io": ""
          }
        }
        DOCKERCFG
        echo "DOCKER_CONFIG=$DOCKER_CFG" >> $GITHUB_ENV
        echo "Created Docker config at $DOCKER_CFG to bypass keychain"

    - name: Check Docker Command Availability
      shell: bash
      run: |
        echo "=== Docker Pre-flight Validation ==="
        if ! command -v docker &> /dev/null; then
          echo "❌ Docker command not found in PATH"
          echo "Please install Docker or Colima"
          exit 1
        fi
        echo "✅ Docker command found: $(which docker)"

    - name: Validate Docker Daemon Accessibility
      shell: bash
      env:
        MAX_WAIT: ${{ inputs.max-wait-seconds }}
        SKIP_COLIMA_RESTART: ${{ inputs.skip-colima-restart }}
        COLIMA_PROFILE: ${{ inputs.colima-profile }}
      run: |
        echo "=== Checking Docker daemon accessibility ==="
        echo "    Colima profile: $COLIMA_PROFILE"

        # ENHANCED: Dual-level health check (socket + daemon responsiveness)
        # Level 1: Check if Docker socket exists for the specified profile
        COLIMA_SOCKET="$HOME/.colima/${COLIMA_PROFILE}/docker.sock"

        # Set DOCKER_HOST for this profile (critical for parallel execution)
        export DOCKER_HOST="unix://$COLIMA_SOCKET"
        echo "    DOCKER_HOST: $DOCKER_HOST"
        if [[ -S "$COLIMA_SOCKET" ]]; then
          echo "✅ Docker socket exists: $COLIMA_SOCKET"

          # Level 2: Check if daemon is responsive (not zombie) - with retry
          RESPONSIVE=false
          for ATTEMPT in 1 2 3; do
            echo "Checking daemon responsiveness (attempt $ATTEMPT/3)..."
            if timeout 10 docker info &> /dev/null; then
              echo "✅ Docker daemon is responsive"
              docker version | head -10
              RESPONSIVE=true
              break
            fi
            if [ $ATTEMPT -lt 3 ]; then
              echo "Daemon not responsive, waiting 2s before retry..."
              sleep 2
            fi
          done

          if [ "$RESPONSIVE" = "false" ]; then
            echo "⚠️  Docker socket exists but daemon not responsive after 3 retries (zombie state detected)"
            echo "   This indicates Colima VM is corrupted - forcing cleanup with VM recreation"
            # Force cleanup even though socket exists
            FORCE_CLEANUP=true
          else
            exit 0
          fi
        else
          echo "⚠️  Docker socket not found"
        fi

        echo "⚠️  Docker daemon not accessible"

        # If skip-colima-restart is true, just verify Docker, don't restart
        if [[ "$SKIP_COLIMA_RESTART" == "true" ]]; then
          echo "⚠️  Docker daemon not accessible (skip-colima-restart=true)"
          echo "Waiting for Docker to become accessible (docker-setup should have started it)..."

          ELAPSED=0
          INTERVAL=2
          while [[ $ELAPSED -lt $MAX_WAIT ]]; do
            if docker info &> /dev/null; then
              echo "✅ Docker daemon is now ready (took ${ELAPSED}s)"
              docker version | head -10
              exit 0
            fi

            if [[ $((ELAPSED % 10)) -eq 0 ]] && [[ $ELAPSED -gt 0 ]]; then
              echo "Still waiting for Docker daemon... (${ELAPSED}s/${MAX_WAIT}s)"
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Docker daemon did not become ready within ${MAX_WAIT}s"
          echo "This job requires docker-setup to have started Colima first"
          exit 1
        fi

        # Detect Colima - check if colima command exists (primary detection)
        # Don't rely on socket file - it may not exist if VM was deleted/corrupted
        if command -v colima &> /dev/null; then
          echo "🔧 Detected Colima (colima command found at: $(which colima))"

          # AGGRESSIVE CLEANUP: Docker not accessible + Colima socket exists = force full restart
          # Don't rely on colima status - it can be unreliable when Colima is broken
          echo "🧹 Docker daemon not accessible - forcing Colima cleanup regardless of reported state"
          echo "   (Colima status can be unreliable when VM is corrupted or in zombie state)"

          COLIMA_STATUS=$(colima status 2>&1 || true)
          echo "   Current colima status: $COLIMA_STATUS"

          # ENHANCED: Detect zombie state - socket exists but daemon unresponsive (with retry)
          if [[ -S "$COLIMA_SOCKET" ]]; then
            DAEMON_RESPONSIVE=false
            for RETRY in 1 2 3; do
              if timeout 10 docker info &> /dev/null; then
                DAEMON_RESPONSIVE=true
                break
              fi
              sleep 2
            done

            if [ "$DAEMON_RESPONSIVE" = "false" ]; then
              echo "   🧟 ZOMBIE STATE DETECTED: Socket exists but daemon unresponsive after retries"
              echo "   Root cause: VM corruption, network issues, or process deadlock"
              FORCE_CLEANUP=true
            fi
          fi

          # Check VM memory usage before cleanup decision
          if command -v colima &> /dev/null; then
            VM_STATUS=$(colima status 2>&1 || echo "unknown")
            if [[ "$VM_STATUS" == *"colima is running"* ]]; then
              # Get VM memory stats (if available)
              echo "Checking VM memory usage..."
              VM_MEM_INFO=$(docker info 2>/dev/null | grep "Total Memory" || echo "unknown")
              echo "VM Memory: $VM_MEM_INFO"

              # If VM memory > 80% or unknown, trigger preemptive restart
              # Note: docker info doesn't show memory % easily, so we trigger cleanup on zombie/unresponsive
            fi
          fi

          # Always force cleanup when Docker is inaccessible - VM recreation instead of restart
          echo "🔄 Forcing Colima profile '$COLIMA_PROFILE' full VM deletion and recreation..."
          colima stop -p "$COLIMA_PROFILE" -f 2>/dev/null || true
          sleep 2
          colima delete -p "$COLIMA_PROFILE" -f 2>/dev/null || true

          # Remove stale Lima network sockets (root cause of "user-v2_ep.sock not found")
          # Lima recreates this directory automatically on next start
          echo "🧹 Removing stale Lima network state..."
          rm -rf "$HOME/.colima/_lima/_networks"
          sleep 2
          echo "✅ Colima cleanup complete, proceeding with fresh VM start"

          echo "Starting Colima with retry logic..."

          # CRITICAL: Unset RUNNER_TRACKING_ID to prevent GitHub Actions runner
          # from killing Colima during job cleanup. The runner tracks processes
          # via this env var, not process tree, so nohup alone doesn't work.
          unset RUNNER_TRACKING_ID
          echo "NOTE: Unset RUNNER_TRACKING_ID to prevent runner cleanup from killing Colima"

          # Exponential backoff parameters
          ATTEMPT=1
          MAX_ATTEMPTS=3
          WAIT_TIME=2

          while [[ $ATTEMPT -le $MAX_ATTEMPTS ]]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Starting Colima profile '$COLIMA_PROFILE'..."

            # Start Colima with specified profile - RUNNER_TRACKING_ID is unset so runner won't kill it
            # Each profile gets its own VM and Docker daemon for true parallel isolation
            # INCREASED: 4GB memory (was 3GB) to prevent VM zombie state under container load
            # Root cause: Qdrant (1GB) + PostgreSQL (512MB+256MB shm) + QEMU overhead can exhaust 3GB
            if colima start -p "$COLIMA_PROFILE" --cpu 2 --memory 4 --disk 25 --runtime docker 2>&1; then
              echo "✅ Colima profile '$COLIMA_PROFILE' started successfully"
              # Update DOCKER_HOST to point to this profile's socket
              export DOCKER_HOST="unix://$HOME/.colima/${COLIMA_PROFILE}/docker.sock"
              break
            else
              if [[ $ATTEMPT -eq $MAX_ATTEMPTS ]]; then
                echo "❌ Failed to start Colima after $MAX_ATTEMPTS attempts"
                exit 1
              fi

              echo "⚠️  Colima start failed, waiting ${WAIT_TIME}s before retry..."
              sleep $WAIT_TIME
              WAIT_TIME=$((WAIT_TIME * 2))  # Exponential backoff
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          # Wait for Docker daemon to be ready
          echo "⏳ Waiting for Docker daemon to be ready (max ${MAX_WAIT}s)..."
          ELAPSED=0
          INTERVAL=2

          while [[ $ELAPSED -lt $MAX_WAIT ]]; do
            if docker info &> /dev/null; then
              echo "✅ Docker daemon is now ready (took ${ELAPSED}s)"
              docker version | head -10
              exit 0
            fi

            if [[ $((ELAPSED % 10)) -eq 0 ]] && [[ $ELAPSED -gt 0 ]]; then
              echo "Still waiting for Docker daemon... (${ELAPSED}s/${MAX_WAIT}s)"
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Docker daemon did not become ready within ${MAX_WAIT}s"
          echo "Check Colima status: colima status"
          exit 1
        fi

        # Non-Colima case: colima command not found
        echo "❌ Docker daemon not running and colima command not found"
        echo "Please install Colima: brew install colima"
        echo "Or start Docker Desktop manually"
        exit 1

    - name: Set Docker Host Environment Variable
      shell: bash
      env:
        COLIMA_PROFILE: ${{ inputs.colima-profile }}
      run: |
        echo "=== Setting DOCKER_HOST for profile '$COLIMA_PROFILE' ==="

        # Set DOCKER_HOST for the specified profile
        COLIMA_SOCKET="$HOME/.colima/${COLIMA_PROFILE}/docker.sock"
        if [[ -S "$COLIMA_SOCKET" ]]; then
          echo "DOCKER_HOST=unix://$COLIMA_SOCKET" >> $GITHUB_ENV
          echo "✅ DOCKER_HOST set to: unix://$COLIMA_SOCKET"
        else
          echo "⚠️ Socket not found at $COLIMA_SOCKET, using default"
        fi

    - name: Validate Port Availability
      if: inputs.check-ports != ''
      shell: bash
      env:
        PORTS: ${{ inputs.check-ports }}
      run: |
        echo "=== Validating port availability ==="

        IFS=',' read -ra PORT_ARRAY <<< "$PORTS"
        CONFLICTS=0

        for PORT in "${PORT_ARRAY[@]}"; do
          PORT=$(echo "$PORT" | xargs)  # Trim whitespace

          if lsof -ti :"$PORT" &> /dev/null; then
            echo "❌ Port $PORT is already in use"
            lsof -i :"$PORT" || true
            CONFLICTS=$((CONFLICTS + 1))
          else
            echo "✅ Port $PORT is available"
          fi
        done

        if [[ $CONFLICTS -gt 0 ]]; then
          echo "❌ $CONFLICTS port conflict(s) detected"
          echo "Please free the ports before starting containers"
          exit 1
        fi

        echo "✅ All requested ports are available"

    - name: Verify Docker Daemon Final State
      shell: bash
      env:
        COLIMA_PROFILE: ${{ inputs.colima-profile }}
      run: |
        echo "=== Final Docker daemon verification for profile '$COLIMA_PROFILE' ==="

        # Ensure DOCKER_HOST is set for this profile
        export DOCKER_HOST="unix://$HOME/.colima/${COLIMA_PROFILE}/docker.sock"
        echo "    DOCKER_HOST: $DOCKER_HOST"

        if ! docker info &> /dev/null; then
          echo "❌ Docker daemon still not accessible after pre-flight"
          exit 1
        fi

        echo "✅ Docker daemon is accessible and ready"
        echo ""
        echo "Docker Info:"
        docker info | grep -E "Server Version|Operating System|Total Memory|CPUs" || true
        echo ""
        echo "Colima profiles running:"
        colima list 2>/dev/null || true
