name: NFR Accuracy Validation (NFR6/NFR7)

# This workflow runs comprehensive accuracy validation tests that are critical for merge approval
# Separated from main CI for better visibility and independent timeout management
#
# UPDATED 2025-11-05: Now runs as REQUIRED CHECK on PRs to main
# UPDATED 2025-11-04: Story 2.15 - Now uses normalized ground truth (49 queries, filtered from 50)
#
# Runtime: ~5-10 minutes (with cache) | ~30 minutes (cache miss)
#   - Uses normalized ground truth: tests/ground_truth_normalized.json (49 queries)
#   - Integrated validation: Stories 2.11 + 2.14 + 2.15 combined
#   - Script: scripts/validate-epic-2-final.py
#   - Caching: PDF hash + ground truth hash (persistent on self-hosted runners)
#
# NFR Targets (BLOCKING):
#   - NFR6: ≥70% retrieval accuracy (Epic 2 Phase 2A Decision Gate) ✅ ACHIEVED: 71.4%
#   - NFR7: ≥95% attribution accuracy
#
# Strategy: Required PR Check (Best Practice for Expensive Tests)
#   ✅ Cache hit (~5-10 min) is acceptable for PR merge delay
#   ✅ Simple workflow - no merge queue complexity
#   ✅ Blocks PRs that would degrade accuracy
#   ✅ Validates after merge as safety net

on:
  # PRIMARY: Required check on PRs to main
  # This prevents merging PRs that would degrade accuracy
  # Expected runtime: 5-10 min (with cache) | 30 min (cache miss on first run)
  pull_request:
    branches:
      - main

  # SECONDARY: Validation after merge to main (safety net)
  # This catches any edge cases and validates the main branch state
  push:
    branches:
      - 'main'

  # MANUAL: On-demand testing during development
  # Use this to test accuracy on feature branches before creating PR
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (default: current branch)'
        required: false
        default: ''

  # OPTIONAL: Nightly validation on main branch
  # Uncomment if you want daily accuracy regression testing
  # schedule:
  #   - cron: '0 2 * * *'  # 2 AM UTC daily

jobs:
  accuracy-validation:
    name: "✅ NFR: Accuracy Validation (NFR6/NFR7)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 60  # Increased from 30 to accommodate full test (30-38 min required)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Calculate cache key (PDF + Ground Truth hash)
        id: pdf-hash
        run: |
          PDF_PATH="docs/sample pdf/2025-08 Performance Review CONSO_v2.pdf"
          GT_PATH="tests/ground_truth_normalized.json"

          if [ ! -f "$PDF_PATH" ]; then
            echo "❌ ERROR: PDF file not found: $PDF_PATH"
            exit 1
          fi

          if [ ! -f "$GT_PATH" ]; then
            echo "❌ ERROR: Ground truth file not found: $GT_PATH"
            exit 1
          fi

          # Calculate hashes for both PDF and ground truth
          PDF_HASH=$(sha256sum "$PDF_PATH" | cut -d' ' -f1)
          GT_HASH=$(sha256sum "$GT_PATH" | cut -d' ' -f1 | cut -c1-8)  # Short hash for brevity

          # Combined cache key (invalidates when either changes)
          CACHE_KEY="$PDF_HASH-$GT_HASH"
          echo "hash=$CACHE_KEY" >> $GITHUB_OUTPUT
          echo "📄 PDF hash: $PDF_HASH"
          echo "📋 Ground truth hash: $GT_HASH (short)"
          echo "🔑 Combined cache key: $CACHE_KEY"

          # Local cache directory (self-hosted runner persistent storage)
          CACHE_DIR="$HOME/.raglite-cache/ingestion-data-$CACHE_KEY"
          echo "cache_dir=$CACHE_DIR" >> $GITHUB_OUTPUT
          echo "📂 Cache directory: $CACHE_DIR"

      - name: Check for cached ingestion data
        id: cache-check
        run: |
          CACHE_DIR="${{ steps.pdf-hash.outputs.cache_dir }}"

          if [ -d "$CACHE_DIR/.qdrant-export" ] && [ -d "$CACHE_DIR/.postgres-export" ]; then
            echo "✅ Cache HIT - found cached data (saves ~25 minutes)"
            echo "   Qdrant: $CACHE_DIR/.qdrant-export"
            echo "   PostgreSQL: $CACHE_DIR/.postgres-export"
            echo "cache_hit=true" >> $GITHUB_OUTPUT

            # Copy cached data to working directory
            cp -r "$CACHE_DIR/.qdrant-export" .
            cp -r "$CACHE_DIR/.postgres-export" .
          else
            echo "⚠️ Cache MISS - will perform full ingestion (~25 minutes)"
            echo "   This is expected on first run or after PDF changes"
            echo "cache_hit=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install pytest pytest-asyncio pytest-xdist pytest-timeout

      - name: Verify Qdrant is available
        run: |
          echo "Checking persistent Qdrant instance..."
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf http://localhost:6333/collections > /dev/null 2>&1; then
              echo "✅ Qdrant available for accuracy tests"
              # Check for 500 errors and restart if needed
              ERROR_500_COUNT=$(curl -sf http://localhost:6333/telemetry 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print(sum(endpoint.get('500', {}).get('count', 0) for endpoint in data['result']['requests']['rest']['responses'].values()))" 2>/dev/null || echo "0")
              echo "Recent 500 errors: $ERROR_500_COUNT"
              if [ "$ERROR_500_COUNT" -gt 0 ]; then
                echo "⚠️  Warning: Qdrant has $ERROR_500_COUNT recent 500 errors"
                echo "Restarting Qdrant to clear error state..."
                docker restart raglite-qdrant
                sleep 5
              fi
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Waiting for Qdrant... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 1
          done
          echo "❌ Qdrant not available after ${MAX_RETRIES}s"
          exit 1

      - name: Start and verify PostgreSQL
        run: |
          echo "Ensuring fresh PostgreSQL container..."

          # Check if container exists
          if docker ps -a --format '{{.Names}}' | grep -q "^raglite-postgresql$"; then
            echo "PostgreSQL container exists - restarting to ensure fresh state..."

            # CRITICAL: Always restart to prevent zombie/hung state
            # Container may show as "running" but be unresponsive (seen 4-day old logs)
            docker restart raglite-postgresql
            echo "Waiting for restart to complete..."
            sleep 5
          else
            echo "Creating new PostgreSQL container..."
            docker run -d \
              -p 5432:5432 \
              -e POSTGRES_DB=raglite \
              -e POSTGRES_USER=raglite \
              -e POSTGRES_PASSWORD=raglite \
              --name raglite-postgresql \
              postgres:16
            echo "Waiting for initial startup..."
            sleep 8
          fi

          echo "✅ PostgreSQL container refreshed"

          # Wait for PostgreSQL to be ready (max 30 seconds)
          echo "Waiting for PostgreSQL to be ready..."

          # Debug: Check if psql is available
          if ! command -v psql &> /dev/null; then
            echo "⚠️  WARNING: psql command not found! Attempting to use docker exec instead..."
            USE_DOCKER_EXEC=true
          else
            echo "✓ psql command available"
            USE_DOCKER_EXEC=false
          fi

          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Try to connect using docker exec if psql not available
            if [ "$USE_DOCKER_EXEC" = true ]; then
              if docker exec raglite-postgresql psql -U raglite -d postgres -c "SELECT 1" > /dev/null 2>&1; then
                echo "✅ PostgreSQL is available (via docker exec)"

                # Create raglite database if missing
                docker exec raglite-postgresql psql -U raglite -d postgres -c "SELECT 1 FROM pg_database WHERE datname='raglite'" | grep -q 1 || \
                  docker exec raglite-postgresql psql -U raglite -d postgres -c "CREATE DATABASE raglite" > /dev/null 2>&1

                echo "✅ Database 'raglite' ready"
                exit 0
              fi
            else
              # Try to connect using local psql
              if PGPASSWORD=raglite psql -h localhost -p 5432 -U raglite -d postgres -c "SELECT 1" > /dev/null 2>&1; then
                echo "✅ PostgreSQL is available at localhost:5432"

                # Verify raglite database exists, create if missing
                if PGPASSWORD=raglite psql -h localhost -p 5432 -U raglite -d raglite -c "SELECT 1" > /dev/null 2>&1; then
                  echo "✅ Database 'raglite' is accessible"
                  exit 0
                else
                  echo "⚠️  Creating database 'raglite'..."
                  PGPASSWORD=raglite psql -h localhost -p 5432 -U raglite -d postgres -c "CREATE DATABASE raglite" 2>&1 | grep -v "already exists" || true
                  sleep 1
                fi
              fi
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $((RETRY_COUNT % 5)) -eq 0 ]; then
              echo "Waiting for PostgreSQL... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            fi
            sleep 1
          done

          echo "❌ PostgreSQL not available after ${MAX_RETRIES}s"
          echo ""
          echo "Debug information:"
          echo "- Container status: $(docker ps -a --filter name=raglite-postgresql --format '{{.Status}}')"
          echo "- psql available: $(command -v psql &> /dev/null && echo 'yes' || echo 'no')"
          echo ""
          echo "Container logs (last 50 lines):"
          docker logs raglite-postgresql --tail 50
          exit 1

      - name: Initialize Qdrant collection (if cache miss)
        if: steps.cache-check.outputs.cache_hit != 'true'
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing Qdrant collection (financial_docs)..."
          python scripts/init-qdrant.py
          echo "✅ Qdrant collection initialized"

      - name: Initialize PostgreSQL schema (if cache miss)
        if: steps.cache-check.outputs.cache_hit != 'true'
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing PostgreSQL schema (financial_chunks, financial_tables, entity_mappings)..."
          python scripts/init-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Ingest PDF (if cache miss)
        if: steps.cache-check.outputs.cache_hit != 'true'
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: raglite
          POSTGRES_USER: raglite
          POSTGRES_PASSWORD: raglite
        run: |
          source ci-venv/bin/activate
          echo "📄 Cache miss detected - performing full PDF ingestion (~13-15 minutes)..."
          python scripts/ingest-for-validation.py
          echo "✅ PDF ingestion complete"

      - name: Import cached data (if cache hit)
        if: steps.cache-check.outputs.cache_hit == 'true'
        run: |
          source ci-venv/bin/activate

          echo "🔄 Restoring Qdrant snapshot from cache..."
          python scripts/import-qdrant-snapshot.py --input .qdrant-export

          echo "🔄 Restoring PostgreSQL data from cache..."
          python scripts/import-postgres-data.py --input .postgres-export

          echo "✅ Data restored from cache (saved ~25 minutes)"

      - name: Verify data integrity (if cache hit)
        if: steps.cache-check.outputs.cache_hit == 'true'
        continue-on-error: true
        id: cache-verify
        run: |
          source ci-venv/bin/activate

          echo "🔍 Verifying Qdrant collection..."
          python -c "
          from raglite.shared.clients import get_qdrant_client
          from raglite.shared.config import settings

          qdrant = get_qdrant_client()
          count = qdrant.count(collection_name=settings.qdrant_collection_name).count

          if count == 0:
              raise ValueError('Qdrant collection is empty!')

          print(f'✅ Qdrant: {count} chunks')
          "

          echo "🔍 Verifying PostgreSQL tables..."
          python -c "
          import psycopg2
          from raglite.shared.config import settings

          conn_str = f'postgresql://{settings.postgres_user}:{settings.postgres_password}@{settings.postgres_host}:{settings.postgres_port}/{settings.postgres_db}'
          conn = psycopg2.connect(conn_str)
          cursor = conn.cursor()

          cursor.execute('SELECT COUNT(*) FROM financial_tables')
          table_count = cursor.fetchone()[0]

          cursor.execute('SELECT COUNT(*) FROM financial_chunks')
          chunk_count = cursor.fetchone()[0]

          if table_count == 0 or chunk_count == 0:
              raise ValueError(f'PostgreSQL tables are empty! tables={table_count}, chunks={chunk_count}')

          print(f'✅ PostgreSQL: {table_count} tables, {chunk_count} chunks')

          cursor.close()
          conn.close()
          "

      - name: Handle corrupt cache - trigger ingestion fallback
        if: steps.cache-check.outputs.cache_hit == 'true' && steps.cache-verify.outcome == 'failure'
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: raglite
          POSTGRES_USER: raglite
          POSTGRES_PASSWORD: raglite
        run: |
          source ci-venv/bin/activate
          echo "⚠️  Cache verification failed - falling back to fresh ingestion"
          echo "This indicates cache is corrupt or incomplete"

          # Reinitialize empty Qdrant collection (clears corrupt data)
          echo "🔧 Reinitializing Qdrant collection..."
          python scripts/init-qdrant.py

          # Reinitialize PostgreSQL schema (clears corrupt data)
          echo "🔧 Reinitializing PostgreSQL schema..."
          python scripts/init-postgresql.py

          # Run full PDF ingestion
          echo "📄 Starting full PDF ingestion (~13-15 minutes)..."
          python scripts/ingest-for-validation.py

          echo "✅ Fresh ingestion complete - workflow can proceed"

      - name: Run Epic 2 Final Validation (Story 2.15)
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: raglite
          POSTGRES_USER: raglite
          POSTGRES_PASSWORD: raglite
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Epic 2 Final Validation (Story 2.15)"
          echo "- Ground truth: tests/ground_truth_normalized.json (49 queries from validated 50-query fixtures)"
          echo "- Target: ≥70% retrieval accuracy (Epic 2 Decision Gate)"
          echo "- Integrated: Stories 2.11 + 2.14 + 2.15 combined"
          echo "- Script: scripts/validate-epic-2-final.py"

          if [ "${{ steps.cache-check.outputs.cache_hit }}" == "true" ]; then
            echo "- Using cached data"
          else
            echo "- Cache miss: will perform full ingestion (~25 minutes)"
          fi
          echo "========================================="

          # Run Story 2.15 final validation script
          python scripts/validate-epic-2-final.py

          # Save results to pytest-compatible XML for artifact upload
          if [ -f "docs/validation/epic-2-final-validation.json" ]; then
            echo "✅ Validation complete - results saved"

            # Extract accuracy for reporting
            ACCURACY=$(python -c "import json; data=json.load(open('docs/validation/epic-2-final-validation.json')); print(data['metrics']['overall_accuracy'])")
            echo ""
            echo "========================================="
            echo "EPIC 2 VALIDATION RESULT: ${ACCURACY}%"

            if (( $(echo "$ACCURACY >= 70" | bc -l) )); then
              echo "✅ DECISION GATE: EPIC_2_COMPLETE"
            else
              echo "❌ DECISION GATE: Below 70% threshold"
            fi
            echo "========================================="
          else
            echo "❌ Validation failed - no results file generated"
            exit 1
          fi
        continue-on-error: false

      - name: Export data for caching (if cache miss)
        if: steps.cache-check.outputs.cache_hit == 'false' && success()
        continue-on-error: true  # Don't block workflow if cache export fails (non-critical optimization)
        run: |
          source ci-venv/bin/activate

          echo "📦 Exporting Qdrant snapshot for caching..."
          python scripts/export-qdrant-snapshot.py --output .qdrant-export

          echo "📦 Exporting PostgreSQL data for caching..."
          python scripts/export-postgres-data.py --output .postgres-export

          # Save to persistent cache directory
          CACHE_DIR="${{ steps.pdf-hash.outputs.cache_dir }}"
          mkdir -p "$CACHE_DIR"

          cp -r .qdrant-export "$CACHE_DIR/"
          cp -r .postgres-export "$CACHE_DIR/"

          echo "✅ Data exported and cached for next run"
          echo "   Cache directory: $CACHE_DIR"
          echo "   This will save ~25 minutes on subsequent runs"

      - name: Upload accuracy test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-validation-results
          path: pytest-accuracy-report.xml
          retention-days: 30

      - name: Report accuracy metrics
        if: always()
        run: |
          echo "========================================="
          echo "Accuracy Validation Complete"
          echo "========================================="
          if [ -f pytest-accuracy-report.xml ]; then
            echo "Results uploaded to artifacts: accuracy-validation-results"
            echo "Review detailed metrics in GitHub Actions artifacts"
          else
            echo "⚠️  Warning: pytest-accuracy-report.xml not found"
          fi
