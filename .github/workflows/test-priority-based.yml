name: Priority-Based Test Execution

# WORKFLOW PURPOSE: Nightly full test runs and manual priority-based testing
# NOTE: Epic/story branch CI is handled by ci.yml to avoid duplication
# This workflow is for:
#   1. Nightly full test runs (schedule)
#   2. Manual on-demand testing (workflow_dispatch)
#   3. Main branch validation after merge (push to main)

on:
  push:
    branches:
      - main        # Only validate main branch after merge
  schedule:
    # Nightly full test run at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which test suite to run'
        required: true
        default: 'pre-merge'
        type: choice
        options:
          - smoke
          - pre-merge
          - full

jobs:
  # Job 1: P0 Smoke Tests (6 minutes) - Critical path validation
  smoke-tests:
    name: "Smoke Tests (P0 - 6 min)"
    runs-on: [self-hosted, raglite]
    if: github.event_name != 'schedule' || github.event.inputs.test_suite == 'smoke'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install pytest pytest-asyncio pytest-xdist pytest-timeout pytest-cov

      - name: Start Qdrant
        run: docker compose up -d qdrant

      - name: Wait for Qdrant
        run: |
          echo "Waiting for Qdrant to initialize..."
          sleep 5
          timeout 30 bash -c 'until curl -sf http://localhost:6333/healthz > /dev/null; do sleep 2; done'
          echo "✅ Qdrant is ready"

      - name: Run P0 smoke tests
        run: |
          source ci-venv/bin/activate
          pytest tests/ --tb=short -v \
            --cov=raglite \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not slow and priority('P0')"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: smoke-tests
          name: codecov-smoke

  # Job 2: P0+P1 Pre-Merge Tests (20 minutes) - Required for merge
  pre-merge-tests:
    name: "Pre-Merge (P0+P1 - 20 min)"
    runs-on: [self-hosted, raglite]
    needs: smoke-tests
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.event.inputs.test_suite != 'smoke'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install pytest pytest-asyncio pytest-xdist pytest-timeout pytest-cov

      - name: Start services (Qdrant, PostgreSQL)
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for Qdrant to initialize..."
          sleep 5
          timeout 30 bash -c 'until curl -sf http://localhost:6333/healthz > /dev/null; do sleep 2; done'
          echo "✅ Qdrant is ready"
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done' || true

      - name: Run P0+P1 pre-merge tests
        run: |
          source ci-venv/bin/activate
          pytest tests/ --tb=short -v \
            --cov=raglite \
            --cov-report=xml \
            --cov-report=term-missing \
            -n auto \
            --dist loadfile \
            -m "not slow and (priority('P0') or priority('P1'))"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: pre-merge-tests
          name: codecov-pre-merge

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.readFileSync('pytest-report.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Pre-Merge Tests (P0+P1) Results\n\n\`\`\`\n${testResults}\n\`\`\``
            });

  # Job 3: Full Test Suite (40 minutes) - Nightly or on-demand
  full-test-suite:
    name: "Full Suite (All priorities - 40 min)"
    runs-on: [self-hosted, raglite]
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_suite == 'full' ||
      contains(github.event.head_commit.message, '[full-tests]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install pytest pytest-asyncio pytest-xdist pytest-timeout pytest-cov

      - name: Start services (Qdrant, PostgreSQL)
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for Qdrant to initialize..."
          sleep 5
          timeout 30 bash -c 'until curl -sf http://localhost:6333/healthz > /dev/null; do sleep 2; done'
          echo "✅ Qdrant is ready"
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done' || true

      - name: Run full test suite (including slow tests)
        run: |
          source ci-venv/bin/activate
          pytest tests/ --tb=short -v \
            --cov=raglite \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            -n auto \
            --dist loadfile \
            --run-slow \
            -m ""

      - name: Generate priority distribution report
        run: |
          python scripts/analyze-test-priorities.py > docs/test-priority-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: full-suite
          name: codecov-full

      - name: Upload priority report
        uses: actions/upload-artifact@v4
        with:
          name: priority-report
          path: docs/test-priority-report.md

  # Job 4: Generate Test Report Summary
  test-summary:
    name: "Generate Test Summary"
    runs-on: [self-hosted, raglite]
    needs: [smoke-tests, pre-merge-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status | Duration | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke (P0) | ${{ needs.smoke-tests.result }} | ~6 min | N/A |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-Merge (P0+P1) | ${{ needs.pre-merge-tests.result }} | ~20 min | N/A |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Priority Distribution:**" >> $GITHUB_STEP_SUMMARY
          echo "- P0 (Critical): 30 tests (16.3%)" >> $GITHUB_STEP_SUMMARY
          echo "- P1 (High): 60 tests (32.6%)" >> $GITHUB_STEP_SUMMARY
          echo "- P2 (Medium): 46 tests (25.0%)" >> $GITHUB_STEP_SUMMARY
          echo "- P3 (Low): 48 tests (26.1%)" >> $GITHUB_STEP_SUMMARY
