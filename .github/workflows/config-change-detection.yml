# Config Change Detection Workflow
#
# Strategic recommendation from test-strategy-analyst (2025-12-24):
# Detect when configuration files change and remind to review related tests.
#
# This prevents config-test drift where tests hardcode values that config changes.

name: Config Change Detection

on:
  pull_request:
    paths:
      # Configuration files that require test review when changed
      - 'raglite/forecasting/regressor_config.py'
      - 'raglite/forecasting/model_selection.py'
      - 'raglite/external_data/orm_models.py'
      - 'raglite/shared/config.py'

jobs:
  check-config-test-sync:
    name: Check Config-Test Synchronization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            config:
              - 'raglite/forecasting/regressor_config.py'
              - 'raglite/forecasting/model_selection.py'
              - 'raglite/external_data/orm_models.py'
              - 'raglite/shared/config.py'
            tests:
              - 'tests/unit/test_regressor_config*.py'
              - 'tests/unit/test_story_6_11*.py'
              - 'tests/unit/test_story_6_16*.py'
              - 'tests/integration/test_model_selection*.py'

      - name: Check for config-test sync
        id: sync-check
        env:
          CONFIG_CHANGED: ${{ steps.changed-files.outputs.config_any_changed }}
          TESTS_CHANGED: ${{ steps.changed-files.outputs.tests_any_changed }}
          CONFIG_FILES: ${{ steps.changed-files.outputs.config_all_changed_files }}
        run: |
          echo "Config files changed: $CONFIG_CHANGED"
          echo "Test files changed: $TESTS_CHANGED"

          if [[ "$CONFIG_CHANGED" == "true" ]]; then
            echo "config_changed=true" >> $GITHUB_OUTPUT

            # List which config files changed (safe - from action output, not user input)
            echo "Changed config files:"
            echo "$CONFIG_FILES"

            if [[ "$TESTS_CHANGED" != "true" ]]; then
              echo "needs_review=true" >> $GITHUB_OUTPUT
              echo "::warning::Configuration files changed but related tests were not updated. Please review test files for hardcoded values."
            else
              echo "needs_review=false" >> $GITHUB_OUTPUT
              echo "Tests were also updated - good!"
            fi
          else
            echo "config_changed=false" >> $GITHUB_OUTPUT
            echo "needs_review=false" >> $GITHUB_OUTPUT
          fi

      - name: Post review reminder
        if: steps.sync-check.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        env:
          CONFIG_FILES: ${{ steps.changed-files.outputs.config_all_changed_files }}
        with:
          script: |
            const changedConfigs = process.env.CONFIG_FILES.split(' ').filter(f => f);

            // Map config files to related test files
            const configTestMap = {
              'raglite/forecasting/regressor_config.py': [
                'tests/unit/test_regressor_config_story_6_16.py',
                'tests/unit/test_story_6_11_mcp_multivariate.py'
              ],
              'raglite/forecasting/model_selection.py': [
                'tests/unit/test_model_selection*.py',
                'tests/integration/test_model_selection_cache_integration.py'
              ],
              'raglite/external_data/orm_models.py': [
                'tests/integration/test_*_integration.py'
              ],
              'raglite/shared/config.py': [
                'tests/unit/test_config.py'
              ]
            };

            let testFiles = new Set();
            changedConfigs.forEach(config => {
              const tests = configTestMap[config] || [];
              tests.forEach(t => testFiles.add(t));
            });

            const configList = changedConfigs.map(f => `- \`${f}\``).join('\n');
            const testList = [...testFiles].map(f => `- \`${f}\``).join('\n');

            const body = `## ⚠️ Config Change Detection

            Configuration files were modified but related test files were not updated.

            **Changed config files:**
            ${configList}

            **Related test files to review:**
            ${testList}

            ### What to check:
            1. Tests may have **hardcoded expected values** that no longer match the config
            2. Assertions like \`assert 'some_value' in config\` may now fail
            3. Consider using **data-driven tests** that derive expectations from the source of truth

            ### Recommended action:
            - Review the related test files
            - Update any hardcoded expectations to match the new configuration
            - Or mark tests as \`@pytest.mark.skip(reason="Pending config sync")\` with a TODO

            ---
            *This check is a reminder, not a blocker. Use your judgment on whether test updates are needed.*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Summary
        env:
          CONFIG_CHANGED: ${{ steps.sync-check.outputs.config_changed }}
          NEEDS_REVIEW: ${{ steps.sync-check.outputs.needs_review }}
          CONFIG_FILES: ${{ steps.changed-files.outputs.config_all_changed_files }}
        run: |
          echo "## Config Change Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$CONFIG_CHANGED" == "true" ]]; then
            echo "### Configuration files changed" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$CONFIG_FILES" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            if [[ "$NEEDS_REVIEW" == "true" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Related tests were NOT updated.** Please review for hardcoded values." >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ Related tests were also updated." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No configuration files changed in this PR." >> $GITHUB_STEP_SUMMARY
          fi
