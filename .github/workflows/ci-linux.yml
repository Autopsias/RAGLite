# RAGLite CI - GitHub-Hosted Linux Runners (Phase 3)
# This workflow eliminates Colima complexity by using native Docker on Linux
#
# Benefits over macOS self-hosted runner:
# - No Colima VM overhead (saves 2-3GB per shard)
# - No Lima network corruption issues
# - True parallel execution (all 3 shards simultaneously)
# - Auto-scaling with GitHub's infrastructure
# - Simpler debugging (no VM state issues)
#
# Target: <20 minutes total with parallel shards

name: CI (Linux)

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        type: boolean
        default: true
      integration_shard:
        description: 'Which shard to run'
        type: choice
        options:
          - all
          - postgresql-db
          - postgresql-ml
          - retrieval-core
          - retrieval-embedding
          - mcp
          - other
        default: 'all'
      skip_to_stage:
        description: 'Skip to specific stage (saves time on re-runs)'
        type: choice
        options:
          - all                    # Run everything (default)
          - integration-only       # Skip lint + validate (existing)
          - skip-lint              # Skip only lint-gate
          - skip-validate          # Skip only validate
        default: 'all'

permissions:
  contents: read
  pull-requests: write
  checks: write

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  # NOTE: Removed LOKY_MAX_CPU_COUNT=1 which was forcing sequential execution
  # Libraries using joblib/loky (statsmodels, etc.) can now parallelize properly
  # CI Optimization: Use smaller embedding model (MiniLM: 80MB/5s vs Fin-E5: 2GB/60s)
  CI_FAST_EMBEDDING: "true"

jobs:
  # ============================================================
  # Lint Gate (same as macOS version)
  # ============================================================
  lint-gate:
    name: "🔒 Lint Gate: Ruff + Black"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip lint gate when running integration-only or skip-lint
    if: inputs.skip_to_stage != 'integration-only' && inputs.skip_to_stage != 'skip-lint'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install linting dependencies
        run: |
          uv pip install ruff black --system --quiet

      - name: Lint Check (ruff)
        run: |
          ruff check raglite/ tests/ --output-format=github

      - name: Format Check (black)
        run: |
          ruff format raglite/ tests/ --check

      - name: File Size Check
        run: |
          python scripts/check_file_sizes.py

  # ============================================================
  # Validate (same as macOS version, no containers needed)
  # ============================================================
  validate:
    name: "📝 Code Quality: Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-gate
    # Skip validate when running integration-only or skip-validate
    # Use always() to allow running when lint-gate is skipped (via skip-lint option)
    if: >-
      always() &&
      inputs.skip_to_stage != 'integration-only' &&
      inputs.skip_to_stage != 'skip-validate' &&
      (needs.lint-gate.result == 'success' || needs.lint-gate.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          uv sync --all-groups

      - name: Type Check (mypy)
        run: |
          uv run mypy raglite/ --ignore-missing-imports --no-error-summary

      - name: Security Scan (bandit)
        run: |
          uv run bandit -r raglite/ -ll -q -f txt --skip B608,B310

      - name: Validate Pytest Collection
        run: |
          uv run pytest --collect-only -q tests/ 2>&1 | tee collection.log
          if grep -E "^(ERROR|E   |ERRORS|ModuleNotFoundError|ImportError:)" collection.log; then
            echo "FAIL: Test collection errors detected!"
            exit 1
          fi

      - name: Tests (Fast - excludes slow/health_check)
        env:
          LIGHTWEIGHT_TESTS: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest tests/ \
            --ignore=tests/health/ \
            -m "not slow and not health_check and not integration" \
            --tb=short \
            -q \
            --timeout=120 \
            -n 4 \
            --junitxml=test-results/junit.xml \
            2>&1 || exit_code=$?
          exit ${exit_code:-0}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tier1
          path: test-results/
          retention-days: 7

  # ============================================================
  # Integration Tests - Native Docker Services (No Colima!)
  # Each shard runs with its own service containers
  # ============================================================
  integration:
    name: "🔗 Tests: Integration (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Allow step timeout (25 min) + service startup overhead
    needs: validate
    # Run integration tests on:
    # - Push to main (always run full integration on main)
    # - workflow_dispatch with run_integration=true
    # - workflow_dispatch with skip_to_stage options (skips lint and/or validate)
    if: >-
      always() && (
        (needs.validate.result == 'success') ||
        (needs.validate.result == 'skipped' && github.event_name == 'workflow_dispatch')
      ) && (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)
      )

    # Native Docker services - no Colima needed!
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.0
        ports:
          - 6335:6333
        # Note: Qdrant image doesn't have curl/wget, so we skip container health check
        # Health verified via Python in "Verify Service Health" step
      postgres:
        image: postgres:16
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
          POSTGRES_DB: raglite_ci
        options: --health-cmd "pg_isready -U raglite_ci -d raglite_ci" --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      # TRUE PARALLEL EXECUTION - all 6 shards run simultaneously
      # REBALANCED 2026-01-25: Split postgresql into db + ml, retrieval into core + embedding
      # - postgresql-db: Database-focused forecasting/model_selection/insights
      # - postgresql-ml: ML-heavy tests (chronos, catboost, ensemble, epic6)
      # - retrieval-core: Chunking + ingestion workflow (no embedding model)
      # - retrieval-embedding: Embedding + retrieval tests (serial, 1 worker)
      # Target: <18 min per shard, <20 min total CI
      max-parallel: 6
      matrix:
        shard: [postgresql-db, postgresql-ml, retrieval-core, retrieval-embedding, mcp, other]
        include:
          - shard: postgresql-db
            # Database-focused forecasting tests: forecasting/, model_selection/, insights/
            # SPLIT 2026-01-25: Lighter tests that primarily do DB operations
            pytest_paths: "tests/integration/forecasting/ tests/integration/model_selection/ tests/integration/insights/ tests/integration/test_demand_regressors.py tests/integration/test_forecast_external.py"
            pytest_ignore: ""
            workers: 2
            ci_shard: postgresql-db
            description: "PostgreSQL + forecasting DB tests"
          - shard: postgresql-ml
            # ML-heavy tests: epic6/, story_6_23 AC tests, chronos, catboost, ensemble
            # SPLIT 2026-01-25: Tests that load heavy ML stack (~3-4GB statsmodels, catboost, pytorch)
            # Single worker to prevent OOM and xdist_group serialization overhead
            pytest_paths: "tests/integration/epic6/ tests/integration/story_6_23/test_ac1_variable_cost_mape.py tests/integration/story_6_23/test_ac2_data_quality.py tests/integration/story_6_23/test_ac3_pass_rate.py tests/integration/story_6_23/test_ac4_performance.py tests/integration/story_6_23/test_epic6_quality_gate.py tests/integration/story_6_23/test_mape_validation.py tests/integration/test_adaptive_catboost_weights.py tests/integration/test_auto_forecast_update.py tests/integration/test_catboost_core.py tests/integration/test_chronos_ensemble.py tests/integration/test_ensemble_real_data.py tests/integration/test_epic6_core.py tests/integration/test_mcp_validation_integration.py"
            pytest_ignore: ""
            workers: 1  # Single worker for ML-heavy tests - prevents OOM and xdist serialization
            ci_shard: postgresql-ml
            description: "PostgreSQL + ML-heavy tests"
          - shard: retrieval-core
            # Lightweight tests that DON'T need embedding model
            # Uses --dist loadfile for file-level isolation (no xdist_group needed)
            # SPLIT 2026-01-25: Chunking + ingestion workflow tests separated from embedding tests
            pytest_paths: "tests/integration/chunking/ tests/integration/story_2_14/ tests/integration/test_chunking_consistency.py tests/integration/test_chunking_core.py tests/integration/test_pypdfium_ingestion.py tests/integration/test_page_parallelism.py"
            pytest_ignore: ""
            workers: 2
            ci_shard: retrieval-core
            description: "Chunking + ingestion workflow (no embedding)"
          - shard: retrieval-embedding
            # Heavy tests that NEED embedding model
            # Single worker to avoid model loading contention
            # SPLIT 2026-01-25: Embedding tests isolated for reliable serial execution
            pytest_paths: "tests/integration/ingestion/ tests/integration/retrieval/ tests/integration/ac3_ground_truth/ tests/integration/parallel_ingestion/ tests/integration/test_analytical_core.py tests/integration/test_metadata_core.py tests/integration/test_hybrid_search_integration.py tests/integration/test_main_integration.py tests/integration/test_retrieval_core.py tests/integration/test_e2e_query_validation.py tests/integration/test_sql_routing.py tests/integration/test_multi_index_integration.py tests/integration/test_document_segregation.py tests/integration/test_excerpt_validation_core.py tests/integration/test_parallel_ingestion.py tests/integration/test_mcp_async_ingestion.py"
            pytest_ignore: ""
            workers: 1  # Single worker for embedding tests - prevents contention
            ci_shard: retrieval-embedding
            description: "Embedding + retrieval tests (serial)"
          - shard: mcp
            # MCP tools + agentic tests (forecasting validation tests moved to postgresql shard)
            # Root-level: agentic_*, mcp_*, response_validation
            # REBALANCED 2026-01-24: Removed epic6/ and story_6_23 AC1-4 (slow forecasting) to postgresql shard
            # FIX 2026-01-24: Moved test_mcp_async_ingestion.py to retrieval shard (needs embedding warmup)
            # FIX 2026-01-24: Moved test_mcp_validation_integration.py to postgresql shard (loads heavy forecasting stack)
            pytest_paths: "tests/integration/mcp/ tests/integration/story_6_23/test_ac5_mcp_tools.py tests/integration/story_6_23/test_mcp_integration.py tests/integration/external_data_mcp/ tests/integration/helpers/ tests/integration/test_agentic_framework.py tests/integration/test_agentic_workflow_suite.py tests/integration/test_analysis_agent_workflow.py tests/integration/test_mcp_server.py tests/integration/test_story_6_23_mcp_tools.py tests/integration/test_external_data_mcp_core.py tests/integration/test_mcp_response_validation.py"
            pytest_ignore: ""
            workers: 2  # Restored: asyncio fixes should prevent hangs
            ci_shard: mcp
            description: "MCP + agentic tests"
          - shard: other
            # Remaining integration tests: anomaly, validation, external_data, etc.
            # External data tests moved from postgresql shards (P1 fix for slow CI)
            # UPDATED 2026-01-25: Excludes tests from postgresql-db and postgresql-ml shards
            pytest_paths: "tests/integration/"
            # Exclude all subdirectories and root-level tests assigned to other shards
            # NOTE: external_data tests NOW INCLUDED (removed from ignore list)
            pytest_ignore: "--ignore=tests/integration/forecasting/ --ignore=tests/integration/model_selection/ --ignore=tests/integration/insights/ --ignore=tests/integration/chunking/ --ignore=tests/integration/ingestion/ --ignore=tests/integration/retrieval/ --ignore=tests/integration/story_2_14/ --ignore=tests/integration/ac3_ground_truth/ --ignore=tests/integration/parallel_ingestion/ --ignore=tests/integration/mcp/ --ignore=tests/integration/story_6_23/ --ignore=tests/integration/external_data_mcp/ --ignore=tests/integration/epic6/ --ignore=tests/integration/helpers/ --ignore=tests/integration/fixtures/ --ignore=tests/integration/workflows/ --ignore=tests/integration/test_accuracy_validation.py --ignore=tests/integration/test_unified_validation_e2e.py --ignore=tests/integration/test_adaptive_catboost_weights.py --ignore=tests/integration/test_auto_forecast_update.py --ignore=tests/integration/test_catboost_core.py --ignore=tests/integration/test_chronos_ensemble.py --ignore=tests/integration/test_demand_regressors.py --ignore=tests/integration/test_ensemble_real_data.py --ignore=tests/integration/test_epic6_core.py --ignore=tests/integration/test_forecast_external.py --ignore=tests/integration/test_analytical_core.py --ignore=tests/integration/test_chunking_consistency.py --ignore=tests/integration/test_chunking_core.py --ignore=tests/integration/test_metadata_core.py --ignore=tests/integration/test_hybrid_search_integration.py --ignore=tests/integration/test_main_integration.py --ignore=tests/integration/test_retrieval_core.py --ignore=tests/integration/test_pypdfium_ingestion.py --ignore=tests/integration/test_e2e_query_validation.py --ignore=tests/integration/test_agentic_framework.py --ignore=tests/integration/test_agentic_workflow_suite.py --ignore=tests/integration/test_analysis_agent_workflow.py --ignore=tests/integration/test_mcp_server.py --ignore=tests/integration/test_mcp_validation_integration.py --ignore=tests/integration/test_story_6_23_mcp_tools.py --ignore=tests/integration/test_external_data_mcp_core.py --ignore=tests/integration/test_sql_routing.py --ignore=tests/integration/test_multi_index_integration.py --ignore=tests/integration/test_document_segregation.py --ignore=tests/integration/test_excerpt_validation_core.py --ignore=tests/integration/test_mcp_async_ingestion.py --ignore=tests/integration/test_mcp_response_validation.py --ignore=tests/integration/test_parallel_ingestion.py --ignore=tests/integration/test_page_parallelism.py"
            workers: 2  # Restored: asyncio fixes should prevent hangs
            ci_shard: other
            description: "Other integration tests"

    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: "6335"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci
      POSTGRES_DB: raglite_ci
      CI_SHARD: ${{ matrix.ci_shard }}
      # Required for tests that use Mistral API (query classification, metadata extraction)
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    steps:
      - name: Check if shard should run
        id: shard-check
        env:
          SHARD: ${{ matrix.shard }}
          TARGET: ${{ inputs.integration_shard }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Run all shards on push events (no shard selection available)
          # On workflow_dispatch, respect the integration_shard input
          if [[ "$EVENT_NAME" == "push" ]] || [[ "$EVENT_NAME" == "pull_request" ]] || [[ "$TARGET" == "all" ]] || [[ "$TARGET" == "$SHARD" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Running shard '$SHARD' (event: $EVENT_NAME, target: ${TARGET:-all})"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping shard '$SHARD' (target: $TARGET)"
          fi

      - name: Checkout code
        if: steps.shard-check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.shard-check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache HuggingFace Models
        if: steps.shard-check.outputs.should_run == 'true' && !startsWith(matrix.ci_shard, 'postgresql')
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-models-minilm-v1
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - name: Install Dependencies
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          uv sync --all-groups

      - name: Verify Service Health
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Checking Qdrant connectivity (with retries) ==="
          for i in 1 2 3 4 5 6; do
            if uv run python -c "from qdrant_client import QdrantClient; c = QdrantClient(host='localhost', port=6335, timeout=5); c.get_collections(); print('Qdrant is healthy')" 2>/dev/null; then
              break
            fi
            echo "Qdrant not ready (attempt $i/6), waiting 5s..."
            sleep 5
          done

          echo "=== Checking PostgreSQL connectivity ==="
          uv run python -c "import psycopg2; conn = psycopg2.connect(host='localhost', port=5433, database='raglite_ci', user='raglite_ci', password='raglite_ci'); cur = conn.cursor(); cur.execute('SELECT 1'); print('PostgreSQL is healthy'); conn.close()"

      - name: Initialize Test Database Schema
        if: steps.shard-check.outputs.should_run == 'true'
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
          POSTGRES_DB: raglite_ci
        run: |
          echo "=== Initializing Test Database Schema ==="
          uv run python scripts/init-test-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Pre-download Embedding Model
        if: steps.shard-check.outputs.should_run == 'true' && !startsWith(matrix.ci_shard, 'postgresql')
        env:
          CI_FAST_EMBEDDING: "true"
        run: |
          echo "📥 Pre-downloading MiniLM embedding model..."
          uv run python -c "from sentence_transformers import SentenceTransformer; m = SentenceTransformer('all-MiniLM-L6-v2'); print(f'✅ Model ready: {m.get_sentence_embedding_dimension()} dims')"

      - name: Initialize Qdrant Collection
        # Skip Qdrant init for postgresql shards (db + ml) - they don't use embeddings
        if: steps.shard-check.outputs.should_run == 'true' && !startsWith(matrix.ci_shard, 'postgresql')
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6335"
          QDRANT_COLLECTION: financial_docs_ci
          CI_FAST_EMBEDDING: "true"
          MATRIX_SHARD: ${{ matrix.ci_shard }}
          # Required for PDF ingestion (even with skip_metadata, some code paths validate the key)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          echo "=== Initializing Qdrant Collection for CI (Shard: ${MATRIX_SHARD}) ==="
          uv run python scripts/init-ci-qdrant.py
          echo "✅ Qdrant collection ready"

      - name: Validate xdist_group Markers
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Validating xdist_group markers for embedding tests ==="
          uv run python scripts/validate-xdist-markers.py --verbose
          echo "✅ Marker validation passed"

      - name: Validate Test Collection with xdist
        if: steps.shard-check.outputs.should_run == 'true'
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
          WORKERS: ${{ matrix.workers }}
        run: |
          echo "=== Validating pytest collection with --dist loadgroup (Shard: $MATRIX_SHARD) ==="
          uv run pytest --collect-only --dist loadgroup -n $WORKERS -q tests/integration/ 2>&1 | tee /tmp/collection.log
          if grep -E "ERROR|ModuleNotFoundError|ImportError:" /tmp/collection.log; then
            echo "❌ Test collection failed with xdist enabled"
            exit 1
          fi
          echo "✅ Test collection validation passed"

      - name: Record shard start time
        if: steps.shard-check.outputs.should_run == 'true'
        id: start_time
        run: |
          echo "start=$(date +%s)" >> $GITHUB_OUTPUT
          echo "⏱️ Shard start time: $(date)"

      - name: Run Integration Tests
        if: steps.shard-check.outputs.should_run == 'true'
        timeout-minutes: 25  # Increased for postgresql shard serialization
        env:
          PYTHONPATH: ${{ github.workspace }}
          DESCRIPTION: ${{ matrix.description }}
          WORKERS: ${{ matrix.workers }}
          PYTEST_PATHS: ${{ matrix.pytest_paths }}
          PYTEST_IGNORE: ${{ matrix.pytest_ignore }}
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          echo "========================================="
          echo "Running Integration Tests - Shard: $MATRIX_SHARD"
          echo "Description: $DESCRIPTION"
          echo "Workers: $WORKERS"
          echo "CI_SHARD: ${CI_SHARD}"
          echo "========================================="

          # Build pytest command with shard-specific options
          # CRITICAL FIX (2026-01-22): Use separate MARKER_EXPR variable to avoid bash quoting issues
          # Problem: PYTEST_OPTS="-m 'not health_check'" passes literal quotes to pytest
          # Solution: Quote the marker expression at the point of use, not in the variable
          # NOTE: Do NOT add "not slow" here - many integration tests have module-level slow markers
          # The 160-page PDF tests are protected by fixture-level CI skip guard instead.
          # External API tests excluded as safety net (rely on VCR cassettes)
          MARKER_EXPR="not health_check and not atdd and not external_api"
          # HANG FIX (2026-01-23): Added --timeout-method=thread for per-test timeouts in xdist workers
          # The thread method starts a timer thread per test item, which works correctly with xdist
          # Increased per-test timeout to 180s (was 120s) to allow for embedding model loading
          # OOM FIX (2026-01-24): --max-worker-restart=0 prevents infinite restart loops on OOM
          # Without this, xdist keeps restarting crashed workers (usually OOM kills)
          # which obscures the real issue and wastes CI time. Fails fast instead.
          # PERF FIX (2026-01-25): Use loadfile for non-embedding shards (better parallelization)
          # loadfile groups tests by file, eliminating xdist_group overhead for lightweight shards
          if [[ "$MATRIX_SHARD" == *"-core"* ]]; then
            DIST_MODE="loadfile"  # File-level isolation for lightweight shards
          else
            DIST_MODE="loadgroup"  # xdist_group compatibility for embedding shards
          fi
          PYTEST_OPTS="--tb=short -v -n $WORKERS --dist $DIST_MODE --timeout=180 --timeout-method=thread --maxfail=10 --max-worker-restart=0"

          # Add --skip-ingestion for shards with pre-ingested data (retrieval, mcp)
          # PostgreSQL shards (db + ml) don't use Qdrant/embeddings, so skip-ingestion doesn't apply
          if [[ "$MATRIX_SHARD" != postgresql-* ]]; then
            PYTEST_OPTS="$PYTEST_OPTS --skip-ingestion"
            echo "Using --skip-ingestion (collection pre-populated by init-ci-qdrant.py)"
          fi

          # Backup timeout: 1500s (25 min) hard kill if pytest hangs completely
          # Catches cases where pytest-timeout doesn't work (e.g., stuck in fixture teardown)
          # --kill-after=60 guarantees SIGKILL after 60s if SIGTERM fails
          # INCREASED (2026-01-25): From 1200s to 1500s to prevent timeouts on postgresql/retrieval
          # shards which have heavy ML stack loads and xdist_group serialization overhead
          timeout --kill-after=60 --preserve-status 1500 \
            uv run pytest $PYTEST_PATHS \
              $PYTEST_IGNORE \
              -m "$MARKER_EXPR" \
              $PYTEST_OPTS \
              --junitxml=test-results/integration-${MATRIX_SHARD}-junit.xml \
              2>&1 || exit_code=$?

          exit ${exit_code:-0}

      - name: Check for Hanging Tests (on failure)
        if: failure() && steps.shard-check.outputs.should_run == 'true'
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          echo "========================================="
          echo "🔍 Diagnosing Test Hang/Timeout (Shard: $MATRIX_SHARD)"
          echo "========================================="

          echo ""
          echo "=== Timeout Configuration ==="
          echo "Layer 1: Job timeout = 30 min (P0-5 FIX: workers=1 sequential execution)"
          echo "Layer 2: Step timeout = 25 min (SIGINT->SIGTERM->SIGKILL)"
          echo "Layer 3: Backup timeout = 1500s (25 min hard kill)"
          echo "Layer 4: pytest-timeout = 180s per test (with --timeout-method=thread for workers)"

          echo ""
          echo "=== Active pytest processes ==="
          ps aux | grep -E "pytest|python" | grep -v grep || echo "No pytest processes found (likely killed by timeout)"

          echo ""
          echo "=== Memory usage ==="
          free -h

          echo ""
          echo "=== Test output tail (last 100 lines) ==="
          if [ -f "test-results/integration-${MATRIX_SHARD}-junit.xml" ]; then
            tail -100 "test-results/integration-${MATRIX_SHARD}-junit.xml" || true
          else
            echo "No JUnit XML found - tests may have been killed before completion"
          fi

          echo ""
          echo "=== Common timeout causes ==="
          echo "1. Session fixtures not cleaned up (async resources, semaphores)"
          echo "2. Embedding model loading timeout (2GB model + slow I/O)"
          echo "3. xdist worker deadlock (event loop mismatch)"
          echo "4. Network timeout waiting for Qdrant/PostgreSQL"
          echo ""
          echo "=== Resolution steps ==="
          echo "1. Check which test was running when timeout hit"
          echo "2. Add @pytest.mark.timeout(X) to specific slow tests"
          echo "3. Review fixture teardown in conftest.py"
          echo "4. Consider reducing parallelism if memory-bound"

      - name: Report Test Durations
        if: always() && steps.shard-check.outputs.should_run == 'true'
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          echo "=== Top 10 Slowest Tests (Shard: $MATRIX_SHARD) ==="
          # Parse JUnit XML for test durations
          if [ -f "test-results/integration-${MATRIX_SHARD}-junit.xml" ]; then
            # Extract test names and times, sort by time descending
            grep -oP 'testcase.*?time="\K[^"]+|name="\K[^"]+' "test-results/integration-${MATRIX_SHARD}-junit.xml" | \
              paste - - | \
              sort -t$'\t' -k2 -rn | \
              head -10 | \
              awk -F'\t' '{printf "%.2fs - %s\n", $2, $1}'
          else
            echo "No JUnit XML found for shard $MATRIX_SHARD"
          fi

      - name: Extract Duration Data (Phase 3)
        if: always() && steps.shard-check.outputs.should_run == 'true'
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          # Phase 3: Extract structured duration data for shard balancing analysis
          if [ -f "test-results/integration-${MATRIX_SHARD}-junit.xml" ]; then
            uv run python scripts/extract-test-durations.py \
              "test-results/integration-${MATRIX_SHARD}-junit.xml" \
              --output "test-results/durations-${MATRIX_SHARD}.json" \
              --format json \
              --top 20 || echo "Duration extraction failed (non-fatal)"
          fi

      - name: Check shard timing budget
        if: always() && steps.shard-check.outputs.should_run == 'true'
        env:
          START_TIME: ${{ steps.start_time.outputs.start }}
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))

          echo "========================================="
          echo "⏱️ Shard Timing Report: $MATRIX_SHARD"
          echo "========================================="
          echo "Duration: ${MINUTES}m ${SECONDS}s (${DURATION}s total)"

          # Warning at 15 minutes
          if [ $DURATION -gt 900 ]; then
            echo "⚠️ WARNING: Shard exceeded 15-minute budget (${DURATION}s)"
            echo "Consider investigating slow tests or rebalancing shards."
          fi

          # Critical at 25 minutes (approaching 30-minute timeout)
          if [ $DURATION -gt 1500 ]; then
            echo "❌ CRITICAL: Shard approaching timeout limit (${DURATION}s / 1800s max)"
            echo "Shard may fail on next run if tests get slower."
          fi

          # Success message if within budget
          if [ $DURATION -le 900 ]; then
            echo "✅ Shard completed within 15-minute budget"
          fi

          echo "========================================="

      - name: Upload Integration Results
        if: always() && steps.shard-check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-${{ matrix.shard }}-linux
          path: test-results/
          retention-days: 7

  # ============================================================
  # Aggregate Results
  # ============================================================
  integration-aggregate:
    name: "📊 Integration Results (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: integration
    if: always() && needs.integration.result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-integration-*-linux
          path: test-results/
          merge-multiple: true

      - name: Report Summary
        run: |
          echo "## Integration Test Results (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All shards completed on GitHub-hosted Linux runners." >> $GITHUB_STEP_SUMMARY
          ls -la test-results/ || echo "No test results found"
