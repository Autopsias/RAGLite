# RAGLite CI - GitHub-Hosted Linux Runners (Phase 3)
# This workflow eliminates Colima complexity by using native Docker on Linux
#
# Benefits over macOS self-hosted runner:
# - No Colima VM overhead (saves 2-3GB per shard)
# - No Lima network corruption issues
# - True parallel execution (all 3 shards simultaneously)
# - Auto-scaling with GitHub's infrastructure
# - Simpler debugging (no VM state issues)
#
# Target: <20 minutes total with parallel shards

name: CI (Linux)

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        type: boolean
        default: true
      integration_shard:
        description: 'Which shard to run'
        type: choice
        options:
          - all
          - postgresql
          - retrieval
          - mcp
          - other
        default: 'all'

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  APP_ENV: test
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  LOKY_MAX_CPU_COUNT: "1"
  # CI Optimization: Use smaller embedding model (MiniLM: 80MB/5s vs Fin-E5: 2GB/60s)
  CI_FAST_EMBEDDING: "true"

jobs:
  # ============================================================
  # Lint Gate (same as macOS version)
  # ============================================================
  lint-gate:
    name: "🔒 Lint Gate: Ruff + Black"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install linting dependencies
        run: |
          uv pip install ruff black --system --quiet

      - name: Lint Check (ruff)
        run: |
          ruff check raglite/ tests/ --output-format=github

      - name: Format Check (black)
        run: |
          ruff format raglite/ tests/ --check

      - name: File Size Check
        run: |
          python scripts/check_file_sizes.py

  # ============================================================
  # Validate (same as macOS version, no containers needed)
  # ============================================================
  validate:
    name: "📝 Code Quality: Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          uv sync --all-groups

      - name: Type Check (mypy)
        run: |
          uv run mypy raglite/ --ignore-missing-imports --no-error-summary

      - name: Security Scan (bandit)
        run: |
          uv run bandit -r raglite/ -ll -q -f txt --skip B608,B310

      - name: Validate Pytest Collection
        run: |
          uv run pytest --collect-only -q tests/ 2>&1 | tee collection.log
          if grep -E "^(ERROR|E   |ERRORS|ModuleNotFoundError|ImportError:)" collection.log; then
            echo "FAIL: Test collection errors detected!"
            exit 1
          fi

      - name: Tests (Fast - excludes slow/health_check)
        env:
          LIGHTWEIGHT_TESTS: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest tests/ \
            --ignore=tests/health/ \
            -m "not slow and not health_check and not integration" \
            --tb=short \
            -q \
            --timeout=120 \
            -n 4 \
            --junitxml=test-results/junit.xml \
            2>&1 || exit_code=$?
          exit ${exit_code:-0}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tier1
          path: test-results/
          retention-days: 7

  # ============================================================
  # Integration Tests - Native Docker Services (No Colima!)
  # Each shard runs with its own service containers
  # ============================================================
  integration:
    name: "🔗 Tests: Integration (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Increased from 30 to allow for session fixture overhead
    needs: validate
    # Run integration tests on:
    # - Push to main (always run full integration on main)
    # - workflow_dispatch with run_integration=true
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)

    # Native Docker services - no Colima needed!
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.0
        ports:
          - 6335:6333
        # Note: Qdrant image doesn't have curl/wget, so we skip container health check
        # Health verified via Python in "Verify Service Health" step
      postgres:
        image: postgres:16
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
          POSTGRES_DB: raglite_ci
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      # TRUE PARALLEL EXECUTION - all 4 shards run simultaneously
      # Re-balanced 2026-01-22: Split old MCP shard for faster CI
      # Old: 3 shards with MCP having 564 tests on 1 worker = 45+ min
      # New: 4 shards balanced ~35-60 tests each, target <20 min total
      max-parallel: 4
      matrix:
        shard: [postgresql, retrieval, mcp, other]
        include:
          - shard: postgresql
            # PostgreSQL + forecasting + model_selection + root-level forecasting tests
            # Root-level: adaptive_catboost, auto_forecast, catboost_core, chronos, demand_regressors, ensemble, epic6, forecast_external
            pytest_paths: "tests/integration/forecasting/ tests/integration/model_selection/ tests/integration/external_data/ tests/integration/insights/ tests/integration/test_adaptive_catboost_weights.py tests/integration/test_auto_forecast_update.py tests/integration/test_catboost_core.py tests/integration/test_chronos_ensemble.py tests/integration/test_demand_regressors.py tests/integration/test_ensemble_real_data.py tests/integration/test_epic6_core.py tests/integration/test_forecast_external.py tests/integration/test_external_data_core.py tests/integration/test_external_data_schema.py tests/integration/test_ecb_macro_core.py"
            pytest_ignore: ""
            workers: 4  # No embedding model needed - safe to parallelize
            ci_shard: postgresql
            description: "PostgreSQL + forecasting tests (no embedding, 4x parallelization)"
          - shard: retrieval
            # RAG/retrieval + accuracy tests + parallel ingestion + root-level embedding tests
            # Root-level: analytical_core, chunking_*, metadata_core, hybrid_search, main_integration
            pytest_paths: "tests/integration/chunking/ tests/integration/ingestion/ tests/integration/retrieval/ tests/integration/story_2_14/ tests/integration/ac3_ground_truth/ tests/integration/parallel_ingestion/ tests/integration/test_analytical_core.py tests/integration/test_chunking_consistency.py tests/integration/test_chunking_core.py tests/integration/test_metadata_core.py tests/integration/test_hybrid_search_integration.py tests/integration/test_main_integration.py tests/integration/test_retrieval_core.py tests/integration/test_pypdfium_ingestion.py tests/integration/test_e2e_query_validation.py"
            pytest_ignore: ""
            workers: 4
            ci_shard: retrieval
            description: "RAG/retrieval + embedding tests (xdist_group keeps embedding tests on 1 worker)"
          - shard: mcp
            # MCP tools + story tests + epic6 + agentic tests
            # Root-level: agentic_*, mcp_*, story tests
            pytest_paths: "tests/integration/mcp/ tests/integration/story_6_23/ tests/integration/external_data_mcp/ tests/integration/epic6/ tests/integration/helpers/ tests/integration/test_agentic_framework.py tests/integration/test_agentic_workflow_suite.py tests/integration/test_analysis_agent_workflow.py tests/integration/test_mcp_server.py tests/integration/test_mcp_validation_integration.py tests/integration/test_story_6_23_mcp_tools.py tests/integration/test_external_data_mcp_core.py"
            pytest_ignore: ""
            workers: 2  # Embedding model tests - use xdist_group
            ci_shard: mcp
            description: "MCP + agentic tests (2x parallelization)"
          - shard: other
            # Remaining integration tests: anomaly detection, AC tests, validation, etc.
            # Only tests that don't need embedding model or special fixtures
            pytest_paths: "tests/integration/"
            # Exclude all subdirectories and root-level tests assigned to other shards
            pytest_ignore: "--ignore=tests/integration/forecasting/ --ignore=tests/integration/model_selection/ --ignore=tests/integration/external_data/ --ignore=tests/integration/insights/ --ignore=tests/integration/chunking/ --ignore=tests/integration/ingestion/ --ignore=tests/integration/retrieval/ --ignore=tests/integration/story_2_14/ --ignore=tests/integration/ac3_ground_truth/ --ignore=tests/integration/parallel_ingestion/ --ignore=tests/integration/mcp/ --ignore=tests/integration/story_6_23/ --ignore=tests/integration/external_data_mcp/ --ignore=tests/integration/epic6/ --ignore=tests/integration/helpers/ --ignore=tests/integration/fixtures/ --ignore=tests/integration/workflows/ --ignore=tests/integration/test_accuracy_validation.py --ignore=tests/integration/test_unified_validation_e2e.py --ignore=tests/integration/test_adaptive_catboost_weights.py --ignore=tests/integration/test_auto_forecast_update.py --ignore=tests/integration/test_catboost_core.py --ignore=tests/integration/test_chronos_ensemble.py --ignore=tests/integration/test_demand_regressors.py --ignore=tests/integration/test_ensemble_real_data.py --ignore=tests/integration/test_epic6_core.py --ignore=tests/integration/test_forecast_external.py --ignore=tests/integration/test_external_data_core.py --ignore=tests/integration/test_external_data_schema.py --ignore=tests/integration/test_ecb_macro_core.py --ignore=tests/integration/test_analytical_core.py --ignore=tests/integration/test_chunking_consistency.py --ignore=tests/integration/test_chunking_core.py --ignore=tests/integration/test_metadata_core.py --ignore=tests/integration/test_hybrid_search_integration.py --ignore=tests/integration/test_main_integration.py --ignore=tests/integration/test_retrieval_core.py --ignore=tests/integration/test_pypdfium_ingestion.py --ignore=tests/integration/test_e2e_query_validation.py --ignore=tests/integration/test_agentic_framework.py --ignore=tests/integration/test_agentic_workflow_suite.py --ignore=tests/integration/test_analysis_agent_workflow.py --ignore=tests/integration/test_mcp_server.py --ignore=tests/integration/test_mcp_validation_integration.py --ignore=tests/integration/test_story_6_23_mcp_tools.py --ignore=tests/integration/test_external_data_mcp_core.py"
            workers: 4  # Remaining tests can parallelize
            ci_shard: other
            description: "Other integration tests (anomaly, validation, misc)"

    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: "6335"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci
      POSTGRES_DB: raglite_ci
      CI_SHARD: ${{ matrix.ci_shard }}
      # Required for tests that use Mistral API (query classification, metadata extraction)
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    steps:
      - name: Check if shard should run
        id: shard-check
        env:
          SHARD: ${{ matrix.shard }}
          TARGET: ${{ inputs.integration_shard }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Run all shards on push events (no shard selection available)
          # On workflow_dispatch, respect the integration_shard input
          if [[ "$EVENT_NAME" == "push" ]] || [[ "$EVENT_NAME" == "pull_request" ]] || [[ "$TARGET" == "all" ]] || [[ "$TARGET" == "$SHARD" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Running shard '$SHARD' (event: $EVENT_NAME, target: ${TARGET:-all})"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping shard '$SHARD' (target: $TARGET)"
          fi

      - name: Checkout code
        if: steps.shard-check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.shard-check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          uv sync --all-groups

      - name: Verify Service Health
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Checking Qdrant connectivity (with retries) ==="
          for i in 1 2 3 4 5 6; do
            if uv run python -c "from qdrant_client import QdrantClient; c = QdrantClient(host='localhost', port=6335, timeout=5); c.get_collections(); print('Qdrant is healthy')" 2>/dev/null; then
              break
            fi
            echo "Qdrant not ready (attempt $i/6), waiting 5s..."
            sleep 5
          done

          echo "=== Checking PostgreSQL connectivity ==="
          uv run python -c "import psycopg2; conn = psycopg2.connect(host='localhost', port=5433, database='raglite_ci', user='raglite_ci', password='raglite_ci'); cur = conn.cursor(); cur.execute('SELECT 1'); print('PostgreSQL is healthy'); conn.close()"

      - name: Initialize Test Database Schema
        if: steps.shard-check.outputs.should_run == 'true'
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
          POSTGRES_DB: raglite_ci
        run: |
          echo "=== Initializing Test Database Schema ==="
          uv run python scripts/init-test-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Initialize Qdrant Collection
        if: steps.shard-check.outputs.should_run == 'true' && matrix.ci_shard != 'postgresql'
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6335"
          QDRANT_COLLECTION: financial_docs_ci
          CI_FAST_EMBEDDING: "true"
          MATRIX_SHARD: ${{ matrix.ci_shard }}
          # Required for PDF ingestion (even with skip_metadata, some code paths validate the key)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          echo "=== Initializing Qdrant Collection for CI (Shard: ${MATRIX_SHARD}) ==="
          uv run python scripts/init-ci-qdrant.py
          echo "✅ Qdrant collection ready"

      - name: Run Integration Tests
        if: steps.shard-check.outputs.should_run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          DESCRIPTION: ${{ matrix.description }}
          WORKERS: ${{ matrix.workers }}
          PYTEST_PATHS: ${{ matrix.pytest_paths }}
          PYTEST_IGNORE: ${{ matrix.pytest_ignore }}
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          echo "========================================="
          echo "Running Integration Tests - Shard: $MATRIX_SHARD"
          echo "Description: $DESCRIPTION"
          echo "Workers: $WORKERS"
          echo "CI_SHARD: ${CI_SHARD}"
          echo "========================================="

          # Build pytest command with shard-specific options
          # CRITICAL FIX (2026-01-22): Use separate MARKER_EXPR variable to avoid bash quoting issues
          # Problem: PYTEST_OPTS="-m 'not health_check'" passes literal quotes to pytest
          # Solution: Quote the marker expression at the point of use, not in the variable
          MARKER_EXPR="not health_check"
          PYTEST_OPTS="--tb=short -v -n $WORKERS --dist loadgroup --timeout=120 --maxfail=10"

          # Add --skip-ingestion for shards with pre-ingested data (retrieval, mcp)
          # PostgreSQL shard doesn't use Qdrant/embeddings, so skip-ingestion doesn't apply
          if [[ "$MATRIX_SHARD" != "postgresql" ]]; then
            PYTEST_OPTS="$PYTEST_OPTS --skip-ingestion"
            echo "Using --skip-ingestion (collection pre-populated by init-ci-qdrant.py)"
          fi

          uv run pytest $PYTEST_PATHS \
            $PYTEST_IGNORE \
            -m "$MARKER_EXPR" \
            $PYTEST_OPTS \
            --junitxml=test-results/integration-${MATRIX_SHARD}-junit.xml \
            2>&1 || exit_code=$?

          exit ${exit_code:-0}

      - name: Upload Integration Results
        if: always() && steps.shard-check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-${{ matrix.shard }}-linux
          path: test-results/
          retention-days: 7

  # ============================================================
  # Aggregate Results
  # ============================================================
  integration-aggregate:
    name: "📊 Integration Results (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: integration
    if: always() && needs.integration.result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-integration-*-linux
          path: test-results/
          merge-multiple: true

      - name: Report Summary
        run: |
          echo "## Integration Test Results (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All shards completed on GitHub-hosted Linux runners." >> $GITHUB_STEP_SUMMARY
          ls -la test-results/ || echo "No test results found"
