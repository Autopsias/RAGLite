# RAGLite CI - GitHub-Hosted Linux Runners (Phase 3)
# This workflow eliminates Colima complexity by using native Docker on Linux
#
# Benefits over macOS self-hosted runner:
# - No Colima VM overhead (saves 2-3GB per shard)
# - No Lima network corruption issues
# - True parallel execution (all 3 shards simultaneously)
# - Auto-scaling with GitHub's infrastructure
# - Simpler debugging (no VM state issues)
#
# Target: <20 minutes total with parallel shards

name: CI (Linux)

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        type: boolean
        default: true
      integration_shard:
        description: 'Which shard to run'
        type: choice
        options:
          - all
          - postgresql
          - retrieval
          - mcp
          - other
        default: 'all'
      skip_to_stage:
        description: 'Skip to specific stage (saves time on re-runs)'
        type: choice
        options:
          - all                    # Run everything (default)
          - integration-only       # Skip lint + validate (existing)
          - skip-lint              # Skip only lint-gate
          - skip-validate          # Skip only validate
        default: 'all'

permissions:
  contents: read
  pull-requests: write
  checks: write

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  # NOTE: Removed LOKY_MAX_CPU_COUNT=1 which was forcing sequential execution
  # Libraries using joblib/loky (statsmodels, etc.) can now parallelize properly
  # CI Optimization: Use smaller embedding model (MiniLM: 80MB/5s vs Fin-E5: 2GB/60s)
  CI_FAST_EMBEDDING: "true"

jobs:
  # ============================================================
  # Lint Gate (same as macOS version)
  # ============================================================
  lint-gate:
    name: "🔒 Lint Gate: Ruff + Black"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip lint gate when running integration-only or skip-lint
    if: inputs.skip_to_stage != 'integration-only' && inputs.skip_to_stage != 'skip-lint'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install linting dependencies
        run: |
          uv pip install ruff black --system --quiet

      - name: Lint Check (ruff)
        run: |
          ruff check raglite/ tests/ --output-format=github

      - name: Format Check (black)
        run: |
          ruff format raglite/ tests/ --check

      - name: File Size Check
        run: |
          python scripts/check_file_sizes.py

  # ============================================================
  # Validate (same as macOS version, no containers needed)
  # ============================================================
  validate:
    name: "📝 Code Quality: Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-gate
    # Skip validate when running integration-only or skip-validate
    # Use always() to allow running when lint-gate is skipped (via skip-lint option)
    if: >-
      always() &&
      inputs.skip_to_stage != 'integration-only' &&
      inputs.skip_to_stage != 'skip-validate' &&
      (needs.lint-gate.result == 'success' || needs.lint-gate.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          uv sync --all-groups

      - name: Type Check (mypy)
        run: |
          uv run mypy raglite/ --ignore-missing-imports --no-error-summary

      - name: Security Scan (bandit)
        run: |
          uv run bandit -r raglite/ -ll -q -f txt --skip B608,B310

      - name: Validate Pytest Collection
        run: |
          uv run pytest --collect-only -q tests/ 2>&1 | tee collection.log
          if grep -E "^(ERROR|E   |ERRORS|ModuleNotFoundError|ImportError:)" collection.log; then
            echo "FAIL: Test collection errors detected!"
            exit 1
          fi

      - name: Tests (Fast - excludes slow/health_check)
        env:
          LIGHTWEIGHT_TESTS: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest tests/ \
            --ignore=tests/health/ \
            -m "not slow and not health_check and not integration" \
            --tb=short \
            -q \
            --timeout=120 \
            -n 4 \
            --junitxml=test-results/junit.xml \
            2>&1 || exit_code=$?
          exit ${exit_code:-0}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tier1
          path: test-results/
          retention-days: 7

  # ============================================================
  # Integration Tests - Native Docker Services (No Colima!)
  # Each shard runs with its own service containers
  # ============================================================
  integration:
    name: "🔗 Tests: Integration (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Optimized: 2x expected duration (15min) with memory fixes in place
    needs: validate
    # Run integration tests on:
    # - Push to main (always run full integration on main)
    # - workflow_dispatch with run_integration=true
    # - workflow_dispatch with skip_to_stage options (skips lint and/or validate)
    if: >-
      always() && (
        (needs.validate.result == 'success') ||
        (needs.validate.result == 'skipped' && github.event_name == 'workflow_dispatch')
      ) && (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)
      )

    # Native Docker services - no Colima needed!
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.0
        ports:
          - 6335:6333
        # Note: Qdrant image doesn't have curl/wget, so we skip container health check
        # Health verified via Python in "Verify Service Health" step
      postgres:
        image: postgres:16
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
          POSTGRES_DB: raglite_ci
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      # TRUE PARALLEL EXECUTION - all 4 shards run simultaneously
      # Re-balanced 2026-01-22: Split old MCP shard for faster CI
      # Old: 3 shards with MCP having 564 tests on 1 worker = 45+ min
      # New: 4 shards balanced ~35-60 tests each, target <20 min total
      max-parallel: 4
      matrix:
        shard: [postgresql, retrieval, mcp, other]
        include:
          - shard: postgresql
            # PostgreSQL + forecasting + model_selection + root-level forecasting tests
            # Root-level: adaptive_catboost, auto_forecast, catboost_core, chronos, demand_regressors, ensemble, epic6, forecast_external
            # REMOVED external_data tests - moved to "other" shard (P1 fix for slow CI)
            pytest_paths: "tests/integration/forecasting/ tests/integration/model_selection/ tests/integration/insights/ tests/integration/test_adaptive_catboost_weights.py tests/integration/test_auto_forecast_update.py tests/integration/test_catboost_core.py tests/integration/test_chronos_ensemble.py tests/integration/test_demand_regressors.py tests/integration/test_ensemble_real_data.py tests/integration/test_epic6_core.py tests/integration/test_forecast_external.py"
            pytest_ignore: ""
            workers: 4  # No embedding model needed - safe to parallelize
            ci_shard: postgresql
            description: "PostgreSQL + forecasting tests (fast, no embedding, 4x parallelization)"
          - shard: retrieval
            # RAG/retrieval + accuracy tests + parallel ingestion + root-level embedding tests
            # Root-level: analytical_core, chunking_*, metadata_core, hybrid_search, main_integration, sql_routing
            # MEMORY FIX (2026-01-23): Reduced from 4 to 1 worker - embedding model tests use 2GB per worker
            pytest_paths: "tests/integration/chunking/ tests/integration/ingestion/ tests/integration/retrieval/ tests/integration/story_2_14/ tests/integration/ac3_ground_truth/ tests/integration/parallel_ingestion/ tests/integration/test_analytical_core.py tests/integration/test_chunking_consistency.py tests/integration/test_chunking_core.py tests/integration/test_metadata_core.py tests/integration/test_hybrid_search_integration.py tests/integration/test_main_integration.py tests/integration/test_retrieval_core.py tests/integration/test_pypdfium_ingestion.py tests/integration/test_e2e_query_validation.py tests/integration/test_sql_routing.py tests/integration/test_multi_index_integration.py tests/integration/test_document_segregation.py tests/integration/test_excerpt_validation_core.py tests/integration/test_parallel_ingestion.py tests/integration/test_page_parallelism.py"
            pytest_ignore: ""
            workers: 1
            ci_shard: retrieval
            description: "RAG/retrieval + embedding tests (1 worker prevents 4×2GB memory exhaustion)"
          - shard: mcp
            # MCP tools + story tests + epic6 + agentic tests
            # Root-level: agentic_*, mcp_*, story tests, async_ingestion, response_validation
            # OPTIMIZED (2026-01-23): 2 workers with xdist_group - embedding tests stay on one worker
            pytest_paths: "tests/integration/mcp/ tests/integration/story_6_23/ tests/integration/external_data_mcp/ tests/integration/epic6/ tests/integration/helpers/ tests/integration/test_agentic_framework.py tests/integration/test_agentic_workflow_suite.py tests/integration/test_analysis_agent_workflow.py tests/integration/test_mcp_server.py tests/integration/test_mcp_validation_integration.py tests/integration/test_story_6_23_mcp_tools.py tests/integration/test_external_data_mcp_core.py tests/integration/test_mcp_async_ingestion.py tests/integration/test_mcp_response_validation.py"
            pytest_ignore: ""
            workers: 2
            ci_shard: mcp
            description: "MCP + agentic tests (2 workers, xdist_group keeps embedding tests together)"
          - shard: other
            # Remaining integration tests: anomaly, validation, external_data, etc.
            # External data tests moved from postgresql shard (P1 fix for slow CI)
            pytest_paths: "tests/integration/"
            # Exclude all subdirectories and root-level tests assigned to other shards
            # NOTE: external_data tests NOW INCLUDED (removed from ignore list)
            pytest_ignore: "--ignore=tests/integration/forecasting/ --ignore=tests/integration/model_selection/ --ignore=tests/integration/insights/ --ignore=tests/integration/chunking/ --ignore=tests/integration/ingestion/ --ignore=tests/integration/retrieval/ --ignore=tests/integration/story_2_14/ --ignore=tests/integration/ac3_ground_truth/ --ignore=tests/integration/parallel_ingestion/ --ignore=tests/integration/mcp/ --ignore=tests/integration/story_6_23/ --ignore=tests/integration/external_data_mcp/ --ignore=tests/integration/epic6/ --ignore=tests/integration/helpers/ --ignore=tests/integration/fixtures/ --ignore=tests/integration/workflows/ --ignore=tests/integration/test_accuracy_validation.py --ignore=tests/integration/test_unified_validation_e2e.py --ignore=tests/integration/test_adaptive_catboost_weights.py --ignore=tests/integration/test_auto_forecast_update.py --ignore=tests/integration/test_catboost_core.py --ignore=tests/integration/test_chronos_ensemble.py --ignore=tests/integration/test_demand_regressors.py --ignore=tests/integration/test_ensemble_real_data.py --ignore=tests/integration/test_epic6_core.py --ignore=tests/integration/test_forecast_external.py --ignore=tests/integration/test_analytical_core.py --ignore=tests/integration/test_chunking_consistency.py --ignore=tests/integration/test_chunking_core.py --ignore=tests/integration/test_metadata_core.py --ignore=tests/integration/test_hybrid_search_integration.py --ignore=tests/integration/test_main_integration.py --ignore=tests/integration/test_retrieval_core.py --ignore=tests/integration/test_pypdfium_ingestion.py --ignore=tests/integration/test_e2e_query_validation.py --ignore=tests/integration/test_agentic_framework.py --ignore=tests/integration/test_agentic_workflow_suite.py --ignore=tests/integration/test_analysis_agent_workflow.py --ignore=tests/integration/test_mcp_server.py --ignore=tests/integration/test_mcp_validation_integration.py --ignore=tests/integration/test_story_6_23_mcp_tools.py --ignore=tests/integration/test_external_data_mcp_core.py --ignore=tests/integration/test_sql_routing.py --ignore=tests/integration/test_multi_index_integration.py --ignore=tests/integration/test_document_segregation.py --ignore=tests/integration/test_excerpt_validation_core.py --ignore=tests/integration/test_mcp_async_ingestion.py --ignore=tests/integration/test_mcp_response_validation.py --ignore=tests/integration/test_parallel_ingestion.py --ignore=tests/integration/test_page_parallelism.py"
            workers: 4  # External data tests can parallelize with VCR cassettes
            ci_shard: other
            description: "Other integration tests (anomaly, validation, external_data, misc)"

    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: "6335"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci
      POSTGRES_DB: raglite_ci
      CI_SHARD: ${{ matrix.ci_shard }}
      # Required for tests that use Mistral API (query classification, metadata extraction)
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    steps:
      - name: Check if shard should run
        id: shard-check
        env:
          SHARD: ${{ matrix.shard }}
          TARGET: ${{ inputs.integration_shard }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Run all shards on push events (no shard selection available)
          # On workflow_dispatch, respect the integration_shard input
          if [[ "$EVENT_NAME" == "push" ]] || [[ "$EVENT_NAME" == "pull_request" ]] || [[ "$TARGET" == "all" ]] || [[ "$TARGET" == "$SHARD" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Running shard '$SHARD' (event: $EVENT_NAME, target: ${TARGET:-all})"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping shard '$SHARD' (target: $TARGET)"
          fi

      - name: Checkout code
        if: steps.shard-check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.shard-check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          uv sync --all-groups

      - name: Verify Service Health
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Checking Qdrant connectivity (with retries) ==="
          for i in 1 2 3 4 5 6; do
            if uv run python -c "from qdrant_client import QdrantClient; c = QdrantClient(host='localhost', port=6335, timeout=5); c.get_collections(); print('Qdrant is healthy')" 2>/dev/null; then
              break
            fi
            echo "Qdrant not ready (attempt $i/6), waiting 5s..."
            sleep 5
          done

          echo "=== Checking PostgreSQL connectivity ==="
          uv run python -c "import psycopg2; conn = psycopg2.connect(host='localhost', port=5433, database='raglite_ci', user='raglite_ci', password='raglite_ci'); cur = conn.cursor(); cur.execute('SELECT 1'); print('PostgreSQL is healthy'); conn.close()"

      - name: Initialize Test Database Schema
        if: steps.shard-check.outputs.should_run == 'true'
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
          POSTGRES_DB: raglite_ci
        run: |
          echo "=== Initializing Test Database Schema ==="
          uv run python scripts/init-test-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Initialize Qdrant Collection
        if: steps.shard-check.outputs.should_run == 'true' && matrix.ci_shard != 'postgresql'
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6335"
          QDRANT_COLLECTION: financial_docs_ci
          CI_FAST_EMBEDDING: "true"
          MATRIX_SHARD: ${{ matrix.ci_shard }}
          # Required for PDF ingestion (even with skip_metadata, some code paths validate the key)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          echo "=== Initializing Qdrant Collection for CI (Shard: ${MATRIX_SHARD}) ==="
          uv run python scripts/init-ci-qdrant.py
          echo "✅ Qdrant collection ready"

      - name: Validate xdist_group Markers
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Validating xdist_group markers for embedding tests ==="
          uv run python scripts/validate-xdist-markers.py --verbose
          echo "✅ Marker validation passed"

      - name: Validate Test Collection with xdist
        if: steps.shard-check.outputs.should_run == 'true'
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
          WORKERS: ${{ matrix.workers }}
        run: |
          echo "=== Validating pytest collection with --dist loadgroup (Shard: $MATRIX_SHARD) ==="
          uv run pytest --collect-only --dist loadgroup -n $WORKERS -q tests/integration/ 2>&1 | tee /tmp/collection.log
          if grep -E "ERROR|ModuleNotFoundError|ImportError:" /tmp/collection.log; then
            echo "❌ Test collection failed with xdist enabled"
            exit 1
          fi
          echo "✅ Test collection validation passed"

      - name: Run Integration Tests
        if: steps.shard-check.outputs.should_run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          DESCRIPTION: ${{ matrix.description }}
          WORKERS: ${{ matrix.workers }}
          PYTEST_PATHS: ${{ matrix.pytest_paths }}
          PYTEST_IGNORE: ${{ matrix.pytest_ignore }}
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          echo "========================================="
          echo "Running Integration Tests - Shard: $MATRIX_SHARD"
          echo "Description: $DESCRIPTION"
          echo "Workers: $WORKERS"
          echo "CI_SHARD: ${CI_SHARD}"
          echo "========================================="

          # Build pytest command with shard-specific options
          # CRITICAL FIX (2026-01-22): Use separate MARKER_EXPR variable to avoid bash quoting issues
          # Problem: PYTEST_OPTS="-m 'not health_check'" passes literal quotes to pytest
          # Solution: Quote the marker expression at the point of use, not in the variable
          # NOTE: Integration tests ARE marked slow by design - don't exclude them!
          # Unit tests exclude slow, but integration tests NEED slow tests to run
          # External API tests excluded as safety net (rely on VCR cassettes)
          MARKER_EXPR="not health_check and not atdd and not external_api"
          PYTEST_OPTS="--tb=short -v -n $WORKERS --dist loadgroup --timeout=120 --maxfail=10"

          # Add --skip-ingestion for shards with pre-ingested data (retrieval, mcp)
          # PostgreSQL shard doesn't use Qdrant/embeddings, so skip-ingestion doesn't apply
          if [[ "$MATRIX_SHARD" != "postgresql" ]]; then
            PYTEST_OPTS="$PYTEST_OPTS --skip-ingestion"
            echo "Using --skip-ingestion (collection pre-populated by init-ci-qdrant.py)"
          fi

          uv run pytest $PYTEST_PATHS \
            $PYTEST_IGNORE \
            -m "$MARKER_EXPR" \
            $PYTEST_OPTS \
            --junitxml=test-results/integration-${MATRIX_SHARD}-junit.xml \
            2>&1 || exit_code=$?

          exit ${exit_code:-0}

      - name: Report Test Durations
        if: always() && steps.shard-check.outputs.should_run == 'true'
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          echo "=== Top 10 Slowest Tests (Shard: $MATRIX_SHARD) ==="
          # Parse JUnit XML for test durations
          if [ -f "test-results/integration-${MATRIX_SHARD}-junit.xml" ]; then
            # Extract test names and times, sort by time descending
            grep -oP 'testcase.*?time="\K[^"]+|name="\K[^"]+' "test-results/integration-${MATRIX_SHARD}-junit.xml" | \
              paste - - | \
              sort -t$'\t' -k2 -rn | \
              head -10 | \
              awk -F'\t' '{printf "%.2fs - %s\n", $2, $1}'
          else
            echo "No JUnit XML found for shard $MATRIX_SHARD"
          fi

      - name: Upload Integration Results
        if: always() && steps.shard-check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-${{ matrix.shard }}-linux
          path: test-results/
          retention-days: 7

  # ============================================================
  # Aggregate Results
  # ============================================================
  integration-aggregate:
    name: "📊 Integration Results (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: integration
    if: always() && needs.integration.result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-integration-*-linux
          path: test-results/
          merge-multiple: true

      - name: Report Summary
        run: |
          echo "## Integration Test Results (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All shards completed on GitHub-hosted Linux runners." >> $GITHUB_STEP_SUMMARY
          ls -la test-results/ || echo "No test results found"
