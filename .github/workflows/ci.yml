# RAGLite CI - Consolidated Pipeline (Best Practices Aligned)
# Self-hosted runners with 24GB RAM shared across projects
#
# Architecture: 4 focused jobs in single workflow
# - lint-gate: Every push/PR, <2 min, fast feedback
# - validate: Every push/PR, <10 min, unit tests with mocked deps
# - integration: Main pushes only (or manual trigger), <30 min, full integration suite
# - accuracy-gate: Main pushes only (post-merge), <45 min, AC3 >=70% validation
#
# Execution Matrix:
# | Event              | lint | validate | int-full | accuracy |
# |--------------------|------|----------|----------|----------|
# | PR to any branch   |  ✓   |    ✓     |    ✗     |    ✗     |
# | Push to feature    |  ✓   |    ✓     |    ✗     |    ✗     |
# | Push to main       |  ✓   |    ✓     |    ✓     |    ✓     |
# | workflow_dispatch  |  ✓   |    ✓     | (if flag)| (if flag)|
#
# Note: Integration tests require real infrastructure (Qdrant/PostgreSQL) and are
# all marked @pytest.mark.slow. Unit tests in 'validate' provide fast PR feedback.
# Full integration suite runs on main for comprehensive validation.

name: CI

'on':
  push:
    branches: [main, develop, "story/**", "epic/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run full integration tests (requires containers)'
        type: boolean
        default: false
      run_accuracy_gate:
        description: 'Run accuracy validation (NFR6/NFR7)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"  # Prevent .pyc generation (avoids bytecode cache pollution)
  LOKY_MAX_CPU_COUNT: "1"  # Prevent joblib multiprocessing conflicts with pytest

jobs:
  # ============================================================
  # GATE 0: Linting (fastest feedback, must pass before tests)
  # Runs on every push/PR
  # Target: <2 minutes, <1GB RAM
  # ============================================================
  lint-gate:
    name: "🔒 Lint Gate: Ruff + Black"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Proactive UV Cache Cleanup (Pre-Install)
        uses: ./.github/actions/validate-cache

      - name: Setup UV
        uses: ./.github/actions/setup-uv

      - name: Install linting dependencies
        run: |
          echo "Installing dependencies (linting only)..."
          uv pip install ruff black --system --quiet

      - name: Check E402 pytestmark Violations
        run: |
          echo "=== Checking for pytestmark E402 violations ==="
          python scripts/fix-pytestmark-e402.py --check
          echo "No pytestmark E402 violations found"

      - name: Lint Check (ruff)
        run: |
          echo "=== Running ruff linter ==="
          ruff check raglite/ tests/ --output-format=github
          echo "Ruff linting passed"

      - name: Format Check (black)
        run: |
          echo "=== Checking code formatting ==="
          ruff format raglite/ tests/ --check
          echo "Black formatting passed"

      - name: File Size Check
        run: |
          echo "=== Checking file sizes (500 LOC limit) ==="
          python scripts/check_file_sizes.py
          echo "File size check passed - no violations"

      - name: Mock Coverage Validation
        run: |
          echo "=== Validating get_mistral_client mock coverage ==="
          python scripts/validate-mock-coverage.py
          echo "Mock coverage validation passed"

  # ============================================================
  # TIER 1: Fast PR Validation
  # Runs on every push/PR, AFTER lint-gate passes
  # Target: <10 minutes, <4GB RAM, NO containers
  # ============================================================
  validate:
    name: "📝 Code Quality: Lint & Format"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 15
    needs: lint-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Proactive Cache Cleanup (Pre-Install)
        uses: ./.github/actions/validate-cache

      - name: Setup UV
        uses: ./.github/actions/setup-uv

      - name: Setup Python + UV
        run: |
          echo "Creating virtual environment..."
          uv venv ci-venv --python 3.11 --quiet 2>/dev/null || uv venv ci-venv --quiet
          source ci-venv/bin/activate
          echo "Installing dependencies (lightweight mode)..."
          uv pip install -e ".[dev]" --quiet

      - name: Type Check (mypy)
        run: |
          source ci-venv/bin/activate
          echo "Running mypy type checker..."
          mypy raglite/ --ignore-missing-imports --no-error-summary

      - name: Security Scan (bandit)
        run: |
          source ci-venv/bin/activate
          echo "Running security scan..."
          bandit -r raglite/ -ll -q -f txt --skip B608,B310

      - name: Validate Mock Patch Targets (P0-1)
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating mock patch targets exist"
          echo "Prevents stale mocks after refactoring"
          echo "Root cause: Mock targets drift during refactoring"
          echo "========================================="
          python scripts/validate-mock-targets.py --verbose
          if [ $? -ne 0 ]; then
            echo "FAIL: Invalid mock patch targets detected!"
            echo "Run: python scripts/validate-mock-targets.py --fix-suggestions"
            exit 1
          fi
          echo "Mock target validation passed"

      - name: Check isinstance Violations (P0-2)
        run: |
          echo "========================================="
          echo "Checking for isinstance usage on custom classes"
          echo "Prevents xdist parallel execution failures"
          echo "Root cause: isinstance fails with pytest-xdist"
          echo "========================================="
          bash scripts/check-isinstance-violations.sh
          if [ $? -ne 0 ]; then
            echo "FAIL: isinstance violations detected!"
            echo "See .claude/rules/testing.md for isinstance Checks with pytest-xdist"
            exit 1
          fi
          echo "isinstance validation passed"

      - name: Validate Pytest Collection (Import Errors)
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating pytest can collect all tests"
          echo "Catches import errors before test execution"
          echo "========================================="
          pytest --collect-only -q tests/ 2>&1 | tee collection.log

          # Check for actual collection errors (not test names containing 'error')
          # Look for pytest error markers at start of line, or Python exception types
          if grep -E "^(ERROR|E   |ERRORS|ModuleNotFoundError|ImportError:)" collection.log; then
            echo "FAIL: Test collection errors detected!"
            exit 1
          fi
          echo "Collection validation passed"

      - name: Validate Pytest Fixtures
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating pytest fixture resolution"
          echo "Prevents 'fixture not found' errors in CI"
          echo "========================================="
          pytest --collect-only -q tests/ 2>&1 | head -50
          # Check for fixture errors in collection
          if pytest --collect-only -q tests/ 2>&1 | grep -i "fixture.*not found"; then
            echo "FAIL: Fixture references without definitions detected!"
            exit 1
          fi
          echo "Fixture validation passed"

      - name: Validate xdist_group Markers (P0-3)
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating xdist_group markers on embedding tests"
          echo "Prevents 4x model load overhead in parallel tests"
          echo "Root cause: Session fixtures are per-worker with xdist"
          echo "========================================="
          python scripts/validate-xdist-markers.py --fix-suggestions
          if [ $? -ne 0 ]; then
            echo "FAIL: Missing xdist_group markers detected!"
            echo "All tests using embedding model need: pytest.mark.xdist_group(name='embedding_model')"
            exit 1
          fi
          echo "xdist_group marker validation passed"

      - name: Tests (Fast - excludes slow/health_check)
        env:
          LIGHTWEIGHT_TESTS: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Running Fast Unit Tests (excludes integration)"
          echo "Excludes: slow, health_check, integration markers"
          echo "Mode: Parallel (4 workers, default load distribution)"
          echo "========================================="
          pytest tests/ \
            -m "not slow and not health_check and not integration" \
            --tb=short \
            -q \
            --timeout=120 \
            -n 4 \
            --junitxml=test-results/junit.xml \
            2>&1 || exit_code=$?

          # Exit with test result
          exit ${exit_code:-0}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tier1
          path: test-results/
          retention-days: 7

  # ============================================================
  # TIER 2: Full Integration Tests (Sharded for Performance)
  # Runs on: Main branch pushes (post-merge) OR manual trigger with flag
  # Target: <15 minutes (3 parallel shards), <4GB RAM per shard
  # Note: Tests split into 3 shards running in parallel
  # ============================================================
  integration:
    name: "🔗 Tests: Integration (${{ matrix.shard }})"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 30
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)

    strategy:
      fail-fast: false
      matrix:
        shard: [postgresql, other]
        include:
          # Shard 1: PostgreSQL-only tests (forecasting, model_selection, external_data, insights)
          # These directories don't require the embedding model for most operations
          - shard: postgresql
            variant: shard-postgresql
            pytest_paths: "tests/integration/forecasting/ tests/integration/model_selection/ tests/integration/external_data/ tests/integration/insights/"
            pytest_ignore: ""
            workers: 2
            description: "~230 PostgreSQL-focused tests"
          # Shard 2: Remaining integration tests (ingestion, retrieval, MCP, etc.)
          # These tests typically use the embedding model via session fixtures
          - shard: other
            variant: shard-other
            pytest_paths: "tests/integration/"
            pytest_ignore: "--ignore=tests/integration/forecasting/ --ignore=tests/integration/model_selection/ --ignore=tests/integration/external_data/ --ignore=tests/integration/insights/"
            workers: 2
            description: "~680 remaining tests"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup Orphaned Processes (P0 Fix)
        run: |
          echo "=== Cleanup orphaned resource_tracker processes ==="
          pkill -9 -f "resource_tracker" 2>/dev/null || echo "No orphaned resource_tracker processes"
          pkill -9 -f "multiprocessing" 2>/dev/null || echo "No orphaned multiprocessing processes"
          echo "Process cleanup complete"

      - name: Clear Python bytecode & pytest cache
        uses: ./.github/actions/validate-cache

      - name: Docker Pre-flight Validation
        uses: ./.github/actions/docker-preflight
        with:
          max-wait-seconds: '60'
          check-ports: '6333,6335,6337,6339,6340,5432,5433,5434,5435,5438'

      - name: Start Test Containers
        run: |
          chmod +x scripts/ci/start-test-containers.sh
          ./scripts/ci/start-test-containers.sh ${{ matrix.variant }}
          echo "Containers started for shard '${{ matrix.shard }}', loading environment..."
          cat .ci-env

      - name: Validate CI Credential Consistency
        run: |
          echo "=== Validating CI credentials against centralized config ==="
          source scripts/ci/container-config.sh
          validate_ci_credentials .github/workflows/ci.yml
          echo "Credential validation passed"

      - name: Verify Container Volume Mounts (P0 Fix)
        run: |
          echo "=== Verifying container volume mounts for shard '${{ matrix.shard }}' ==="
          source .ci-env

          # Get container names from .ci-env (set by container-config.sh)
          QDRANT_CONTAINER_NAME="${QDRANT_CONTAINER:-raglite-qdrant-${{ matrix.variant }}}"
          POSTGRES_CONTAINER_NAME="${POSTGRES_CONTAINER:-raglite-postgresql-${{ matrix.variant }}}"

          # Check Qdrant mount
          QDRANT_MOUNT=$(docker inspect "$QDRANT_CONTAINER_NAME" --format='{{range .Mounts}}{{println .Source}}{{end}}' 2>/dev/null || echo "")
          if [[ -n "$QDRANT_MOUNT" ]] && [[ "$QDRANT_MOUNT" != *"/raglite/"* ]]; then
            echo "WARNING: Qdrant volume mount incorrect: $QDRANT_MOUNT"
            echo "Recreating Qdrant container..."
            docker stop "$QDRANT_CONTAINER_NAME" 2>/dev/null || true
            docker rm "$QDRANT_CONTAINER_NAME" 2>/dev/null || true
            ./scripts/ci/start-test-containers.sh ${{ matrix.variant }} --qdrant-only --skip-cleanup
          else
            echo "Qdrant mount OK: $QDRANT_MOUNT"
          fi

          # Check PostgreSQL mount
          PG_MOUNT=$(docker inspect "$POSTGRES_CONTAINER_NAME" --format='{{range .Mounts}}{{println .Source}}{{end}}' 2>/dev/null || echo "")
          if [[ -n "$PG_MOUNT" ]] && [[ "$PG_MOUNT" != *"/raglite/"* ]]; then
            echo "WARNING: PostgreSQL volume mount incorrect: $PG_MOUNT"
            echo "Recreating PostgreSQL container..."
            docker stop "$POSTGRES_CONTAINER_NAME" 2>/dev/null || true
            docker rm "$POSTGRES_CONTAINER_NAME" 2>/dev/null || true
            ./scripts/ci/start-test-containers.sh ${{ matrix.variant }} --postgresql-only --skip-cleanup
          else
            echo "PostgreSQL mount OK: $PG_MOUNT"
          fi

          echo "Volume mount verification complete"

      - name: Setup UV
        uses: ./.github/actions/setup-uv

      - name: Setup Python + UV
        run: |
          uv venv ci-venv --python 3.11 --quiet 2>/dev/null || uv venv ci-venv --quiet
          source ci-venv/bin/activate
          uv pip install -e ".[dev]" --quiet

      - name: Verify Container Health
        run: |
          source ci-venv/bin/activate
          source .ci-env

          echo "=== Waiting for containers to be fully ready ==="
          sleep 5

          echo "=== Checking Qdrant connectivity (with retry) ==="
          for i in 1 2 3 4 5; do
            if python -c "from qdrant_client import QdrantClient; c = QdrantClient(host='localhost', port=${QDRANT_PORT}); c.get_collections(); print('Qdrant is healthy')" 2>/dev/null; then
              break
            fi
            echo "Qdrant not ready, attempt $i/5, waiting 5s..."
            sleep 5
          done

          echo "=== Checking PostgreSQL connectivity (with retry) ==="
          # Credentials sourced from .ci-env (generated by container-config.sh)
          for i in 1 2 3 4 5; do
            if python -c "import psycopg2; conn = psycopg2.connect(host='localhost', port=${POSTGRES_PORT}, database='${POSTGRES_DB}', user='${POSTGRES_USER}', password='${POSTGRES_PASSWORD}'); cur = conn.cursor(); cur.execute('SELECT 1'); print('PostgreSQL is healthy'); conn.close()" 2>/dev/null; then
              break
            fi
            echo "PostgreSQL not ready, attempt $i/5, waiting 5s..."
            sleep 5
          done

          echo "=== Container health verification complete ==="

      - name: Check Available Memory
        run: |
          echo "=== Memory Check Before Integration Tests ==="
          vm_stat | head -5
          # Warn if <4GB available (macOS)
          FREE_PAGES=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
          FREE_MB=$((FREE_PAGES * 4096 / 1024 / 1024))
          echo "Approx free memory: ${FREE_MB}MB"
          if [ "$FREE_MB" -lt 4000 ]; then
            echo "WARNING: Low memory detected (<4GB free). OOM risk with parallel tests."
          fi

      - name: Run Integration Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source ci-venv/bin/activate
          source .ci-env
          echo "========================================="
          echo "Running Integration Tests - Shard: ${{ matrix.shard }}"
          echo "Description: ${{ matrix.description }}"
          echo "Workers: ${{ matrix.workers }}"
          echo "Qdrant: localhost:${QDRANT_PORT}"
          echo "PostgreSQL: localhost:${POSTGRES_PORT}"
          echo "========================================="

          # Build pytest command with shard-specific arguments (directory-based sharding)
          pytest ${{ matrix.pytest_paths }} \
            ${{ matrix.pytest_ignore }} \
            -m "not health_check" \
            --tb=short \
            -v \
            -n ${{ matrix.workers }} \
            --dist loadgroup \
            --timeout=120 \
            --junitxml=test-results/integration-${{ matrix.shard }}-junit.xml \
            2>&1 || exit_code=$?

          exit ${exit_code:-0}

      - name: Upload Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Cleanup Containers
        if: always()
        run: |
          chmod +x scripts/ci/cleanup-test-containers.sh
          ./scripts/ci/cleanup-test-containers.sh ${{ matrix.variant }} --force || true

  # ============================================================
  # Integration Results Aggregation
  # Merges JUnit reports from all shards for unified reporting
  # ============================================================
  integration-aggregate:
    name: "📊 Integration Results"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5
    needs: integration
    if: always() && needs.integration.result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-integration-*
          path: test-results/
          merge-multiple: true

      - name: Setup Python
        run: |
          python3 --version

      - name: Merge JUnit Reports
        run: |
          python3 scripts/ci/merge-junit-reports.py \
            test-results/integration-*-junit.xml \
            -o test-results/integration-merged-junit.xml

      - name: Upload Merged Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-merged
          path: test-results/integration-merged-junit.xml
          retention-days: 7

      - name: Report Summary
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/integration-merged-junit.xml ]; then
            # Extract stats from merged report
            TESTS=$(grep -oP 'tests="\K[0-9]+' test-results/integration-merged-junit.xml | head -1 || echo "0")
            FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results/integration-merged-junit.xml | head -1 || echo "0")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results/integration-merged-junit.xml | head -1 || echo "0")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================
  # TIER 3: Accuracy Gate (AC3 Validation)
  # Runs on: Main branch pushes (post-merge) OR manual trigger with flag
  # Target: <45 minutes, validates >=70% accuracy
  # Note: Resource-intensive, so not run on PRs - integration tests provide pre-merge validation
  # ============================================================
  accuracy-gate:
    name: "✅ NFR: Accuracy Validation (NFR6/NFR7)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 45
    needs: integration-aggregate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_accuracy_gate == true)

    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: "6335"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_DB: raglite_ci
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci

    steps:
      - name: Production Safety Check
        run: |
          echo "Verifying test database ports..."
          if [ "$QDRANT_PORT" = "6333" ] || [ "$POSTGRES_PORT" = "5432" ]; then
            echo "FATAL: Production ports detected!"
            echo "QDRANT_PORT=$QDRANT_PORT (should be 6335)"
            echo "POSTGRES_PORT=$POSTGRES_PORT (should be 5433)"
            exit 1
          fi
          echo "Safety check passed: Using test ports"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup Orphaned Processes (P0 Fix)
        run: |
          echo "=== Cleanup orphaned resource_tracker processes ==="
          pkill -9 -f "resource_tracker" 2>/dev/null || echo "No orphaned resource_tracker processes"
          pkill -9 -f "multiprocessing" 2>/dev/null || echo "No orphaned multiprocessing processes"
          echo "Process cleanup complete"

      - name: Clear Python bytecode & pytest cache
        uses: ./.github/actions/validate-cache

      - name: Docker Pre-flight Validation
        uses: ./.github/actions/docker-preflight
        with:
          max-wait-seconds: '60'
          check-ports: '6333,6335,5432,5433'

      - name: Start Test Containers
        run: |
          chmod +x scripts/ci/start-test-containers.sh
          ./scripts/ci/start-test-containers.sh test
          source .ci-env

      - name: Setup UV
        uses: ./.github/actions/setup-uv

      - name: Setup Python + UV
        run: |
          uv venv ci-venv --python 3.11 --quiet 2>/dev/null || uv venv ci-venv --quiet
          source ci-venv/bin/activate
          uv pip install -e ".[dev]" --quiet

      - name: Initialize Databases
        run: |
          source ci-venv/bin/activate
          echo "Initializing Qdrant collection..."
          python scripts/init-qdrant.py
          echo "Initializing PostgreSQL schema..."
          python scripts/init-test-postgresql.py

      - name: Ingest PDF for Validation
        run: |
          source ci-venv/bin/activate
          echo "Ingesting validation PDF (~15 minutes)..."
          python scripts/ingest-for-validation.py

      - name: Run AC3 Validation (>=70%)
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Epic 2 AC3 Validation (>=70% threshold)"
          echo "========================================="
          python scripts/validate-epic-2-final.py

          # Extract accuracy and validate threshold
          ACCURACY=$(python -c "import json; print(json.load(open('docs/validation/epic-2-final-validation.json'))['metrics']['overall_accuracy'])")
          echo "Accuracy: ${ACCURACY}%"

          if (( $(echo "$ACCURACY >= 70" | bc -l) )); then
            echo "PASS: AC3 accuracy gate passed (${ACCURACY}% >= 70%)"
          else
            echo "FAIL: AC3 accuracy below threshold (${ACCURACY}% < 70%)"
            exit 1
          fi

      - name: Upload Accuracy Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-validation-results
          path: docs/validation/
          retention-days: 30

      - name: Cleanup Containers
        if: always()
        run: |
          chmod +x scripts/ci/cleanup-test-containers.sh
          ./scripts/ci/cleanup-test-containers.sh test --force || true
