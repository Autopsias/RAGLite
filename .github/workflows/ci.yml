# RAGLite CI/CD Pipeline
# Optimized with UV package manager for 10-100x faster installs
# Supports self-hosted macOS runners with parallel execution
# Based on Powerpoint Agent Generator CI best practices
# Updated: 2025-10-28 - Test Suite Consolidation
# Updated: 2025-10-29 - Runner Isolation (raglite label) + Resource Limits
#
# IMPORTANT: All tests consolidated in tests/ directory (2025-10-28)
# Total test count: ~402 tests (200+ unit, 115+ integration, 28 e2e)
# NFR validation: Accuracy (NFR6/NFR7), Performance (NFR13), Coverage (80%)
#
# RUNNER ISOLATION (2025-10-29):
# - Uses ONLY runners with 'raglite' label (raglite-runner-1, raglite-runner-2)
# - Prevents cross-project resource contention (20 total system runners)
# - Pytest workers limited to 4 (prevents 110-process explosion)
# - Expected: 2 jobs max parallel × 4 workers = 8 processes (~3-5 GB RAM)

name: CI

on:
  push:
    branches: [main, develop, "story/**", "epic/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Restrict permissions (security best practice)
permissions:
  contents: read
  pull-requests: write
  checks: write

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Global environment variables (inherited by ALL jobs)
env:
  APP_ENV: test
  CI: "true"

jobs:
  # ============================================================================
  # INFRASTRUCTURE VERIFICATION
  # ============================================================================

  # ============================================================================
  # JOB 0: Docker Daemon Health Check
  # Ensures Docker is available before running jobs that require it
  # ============================================================================
  docker-health-check:
    name: "🐳 Infrastructure: Docker Availability"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5
    outputs:
      docker-available: ${{ steps.check-docker.outputs.available }}

    steps:
      - name: Check Docker daemon availability
        id: check-docker
        run: |
          echo "========================================="
          echo "Docker Daemon Health Check"
          echo "========================================="

          # Check if Docker command exists
          if ! command -v docker &> /dev/null; then
            echo "❌ Docker command not found"
            echo "available=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Check if Docker daemon is running
          if docker info &> /dev/null; then
            echo "✅ Docker daemon is running"
            docker version
            echo ""
            echo "Docker context:"
            docker context ls
            echo ""
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Docker daemon is not running"
            echo ""
            echo "Docker context:"
            docker context ls || true
            echo ""
            echo "To fix this issue, start Docker Desktop:"
            echo "  open -a Docker"
            echo ""
            echo "available=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify Docker socket
        if: steps.check-docker.outputs.available == 'true'
        run: |
          echo "Verifying Docker socket accessibility..."

          DOCKER_SOCKET=$(docker context inspect --format '{{.Endpoints.docker.Host}}' | sed 's|unix://||')
          echo "Docker socket path: $DOCKER_SOCKET"

          if [ -S "$DOCKER_SOCKET" ]; then
            echo "✅ Docker socket is accessible at $DOCKER_SOCKET"
          else
            echo "❌ Docker socket not found at $DOCKER_SOCKET"
            exit 1
          fi

  # ============================================================================
  # CODE QUALITY CHECKS
  # ============================================================================

  # ============================================================================
  # JOB 1: Linting & Formatting
  # ============================================================================
  lint:
    name: "📝 Code Quality: Lint & Format"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install ruff isort

      - name: Run Ruff linter
        run: |
          source ci-venv/bin/activate
          ruff check . --output-format=github
        continue-on-error: true

      - name: Run Ruff formatter check
        run: |
          source ci-venv/bin/activate
          # Use ruff format to match pre-commit hook configuration
          ruff format --check --diff raglite/ tests/ scripts/
        continue-on-error: true

      - name: Run isort import check
        run: |
          source ci-venv/bin/activate
          isort --check-only --diff raglite/ tests/ scripts/
        continue-on-error: true

  # ============================================================================
  # JOB 1.5: File Size Validation
  # ============================================================================
  file-size-check:
    name: "📏 Code Quality: File Size Limits"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file sizes
        run: |
          echo "========================================="
          echo "FILE SIZE VALIDATION"
          echo "- Warning threshold: 400 LOC"
          echo "- Hard limit: 500 LOC"
          echo "- Mode: Block new violations in raglite/"
          echo "========================================="
          python3 scripts/check_file_sizes.py --verbose

  # ============================================================================
  # JOB 2: Type Checking
  # ============================================================================
  type-check:
    name: "🔍 Code Quality: Type Check (mypy)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          # SQLAlchemy 2.x has built-in type hints, no stubs needed (sqlalchemy-stubs is for 1.x only)
          uv pip install mypy types-requests types-setuptools

      - name: Run mypy on raglite/ package
        run: |
          source ci-venv/bin/activate
          mypy raglite/ --show-error-codes
        continue-on-error: false

  # ============================================================================
  # JOB 3: Security Scanning
  # ============================================================================
  security:
    name: "🔒 Code Quality: Security Scan"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install security scanning tools with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install bandit[toml] safety
          uv pip install -e .

      - name: Run Bandit security linter
        run: |
          source ci-venv/bin/activate
          bandit -r raglite/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Safety dependency scanner
        run: |
          source ci-venv/bin/activate
          safety check --json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # ============================================================================
  # TEST SUITES
  # ============================================================================

  # ============================================================================
  # JOB 4: Unit Tests (~200 tests)
  # ============================================================================
  test-unit:
    name: "🧪 Tests: Unit (~200 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          # FIX: Install pytest-mock (was missing) and pin versions to match local environment
          uv pip install \
            pytest==8.4.2 \
            pytest-cov==5.0.0 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Run unit tests with coverage
        run: |
          source ci-venv/bin/activate

          # FIX: Add project root and scripts to PYTHONPATH
          # This matches local Test Explorer environment where scripts/ is importable
          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          echo "========================================="
          echo "CI MODE: Unit Tests with Coverage"
          echo "- Running ALL unit tests (including slow)"
          echo "- Parallel workers: 4 (safe parallelism, no shared state)"
          echo "- Target: <10 minutes"
          echo "- PYTHONPATH: ${PYTHONPATH}"
          echo "========================================="
          pytest tests/unit/ \
            -n 4 \
            --dist loadfile \
            -m "" \
            --cov=raglite \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junitxml=pytest-unit-report.xml \
            -v

      - name: Enforce coverage threshold (80%)
        run: |
          source ci-venv/bin/activate
          coverage report --fail-under=80
        continue-on-error: true

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            coverage.xml
            htmlcov/
            pytest-unit-report.xml
          retention-days: 30

  # ============================================================================
  # JOB 5: Integration Tests (~115 tests, requires Qdrant)
  # CI MODE: Uses 160-page full PDF for comprehensive testing
  # ============================================================================
  test-integration:
    name: "🔗 Tests: Integration (~115 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 90  # Sequential execution requires 45-50 min + buffer for slow tests
    needs: [docker-health-check, test-unit]
    # CRITICAL FIX: Set APP_ENV=test at job level for consistent test database routing
    # This ensures ALL steps (health check, init, tests) use the same test infrastructure:
    # - Qdrant: port 6335, collection financial_docs_ci
    # - PostgreSQL: port 5433, database raglite_ci
    env:
      APP_ENV: test
      QDRANT_HOST: localhost
      QDRANT_PORT: 6335
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: raglite_ci
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci
      TEST_USE_FULL_PDF: "false"
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Start and verify Qdrant (Test Instance)
        run: |
          # CI FIX: Use docker-compose test services for consistency and isolation
          CONTAINER_PORT="${QDRANT_PORT:-6335}"
          QDRANT_URL="http://localhost:${CONTAINER_PORT}"

          echo "Ensuring Qdrant TEST container on port ${CONTAINER_PORT}..."

          # ENHANCED CLEANUP: More aggressive for self-hosted runners
          echo "Cleaning up any containers using port $CONTAINER_PORT..."
          docker ps -a --filter "name=raglite-qdrant-test" --format '{{.Names}}' | xargs -r docker rm -f 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Ports}}' | grep ":${CONTAINER_PORT}->" | awk '{print $1}' | xargs -r docker rm -f || true
          # macOS-specific: kill processes holding the port
          if command -v lsof > /dev/null 2>&1; then
            lsof -ti:${CONTAINER_PORT} | xargs -r kill -9 2>/dev/null || true
          fi
          sleep 5

          # ENHANCED STORAGE HEALTH CHECK: More corruption detection
          # Root cause: cancel-in-progress can leave storage in bad state
          STORAGE_PATH="./qdrant_storage_test"
          if [ -d "$STORAGE_PATH" ]; then
            echo "Checking Qdrant storage health..."
            NEEDS_CLEANUP=false
            [ -f "$STORAGE_PATH/.lock" ] && NEEDS_CLEANUP=true && echo "⚠️  Stale lock file"
            find "$STORAGE_PATH" -name "*.tmp" -type f 2>/dev/null | grep -q . && NEEDS_CLEANUP=true && echo "⚠️  Temp files"
            [ ! -f "$STORAGE_PATH/raft_state.json" ] && [ ! -d "$STORAGE_PATH/collections" ] && NEEDS_CLEANUP=true && echo "⚠️  Missing files"
            [ ! -w "$STORAGE_PATH" ] && NEEDS_CLEANUP=true && echo "⚠️  Permission issue"
            [ "$NEEDS_CLEANUP" = true ] && rm -rf "$STORAGE_PATH" && echo "Removed corrupted storage"
          fi
          mkdir -p "$STORAGE_PATH" && chmod 755 "$STORAGE_PATH"

          # Start test services using docker-compose for consistency
          docker compose up -d qdrant-test

          # Verify container started
          if ! docker ps --filter "name=raglite-qdrant-test" --format '{{.Names}}' | grep -q "raglite-qdrant-test"; then
            echo "❌ Container failed to start!"
            docker logs raglite-qdrant-test --tail 50 || true
            exit 1
          fi

          # ENHANCED HEALTH CHECK: Longer timeout with diagnostics
          MAX_RETRIES=60
          RETRY_COUNT=0

          echo "Waiting for Qdrant TEST instance to be ready..."
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Verify container still running
            if ! docker ps --filter "name=raglite-qdrant-test" --format '{{.Names}}' | grep -q "raglite-qdrant-test"; then
              echo "❌ Container stopped unexpectedly!"
              docker logs raglite-qdrant-test --tail 50 || true
              exit 1
            fi
            if curl -sf ${QDRANT_URL}/healthz > /dev/null 2>&1; then
              echo "✅ Qdrant TEST instance available at ${QDRANT_URL}"

              # Additional health check: verify cluster status
              CLUSTER_STATUS=$(curl -sf ${QDRANT_URL}/cluster | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "unknown")
              echo "Cluster status: $CLUSTER_STATUS"

              # Check telemetry for any recent 500 errors
              ERROR_500_COUNT=$(curl -sf ${QDRANT_URL}/telemetry 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print(sum(endpoint.get('500', {}).get('count', 0) for endpoint in data['result']['requests']['rest']['responses'].values()))" 2>/dev/null || echo "0")
              echo "Recent 500 errors: $ERROR_500_COUNT"

              if [ "$ERROR_500_COUNT" -gt 0 ]; then
                echo "⚠️  Warning: Qdrant has $ERROR_500_COUNT recent 500 errors"
                echo "Recreating Qdrant TEST container with fresh storage..."
                # FIX: Full recreate instead of restart to clear corrupted storage
                # Root cause: bind mount storage corruption from interrupted operations
                docker compose down qdrant-test || true
                rm -rf ./qdrant_storage_test
                docker compose up -d qdrant-test
                sleep 5
                echo "✅ Qdrant TEST container recreated with fresh storage"
              fi

              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $((RETRY_COUNT % 5)) -eq 0 ]; then
              echo "Waiting for Qdrant TEST... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            fi
            sleep 1
          done

          echo "❌ Qdrant TEST instance not available after ${MAX_RETRIES}s"
          echo "Container status:"
          docker ps -a --filter "name=raglite-qdrant-test" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo "Container logs:"
          docker logs raglite-qdrant-test --tail 50 || true
          echo "Storage contents:"
          ls -la "$STORAGE_PATH" 2>/dev/null || echo "Storage not accessible"
          exit 1

      - name: Start and verify PostgreSQL (Integration)
        run: |
          # CI FIX: Use database setup script for consistent test environment
          # Integration Tests: Ensure test databases and users are properly configured
          echo "Setting up PostgreSQL TEST environment..."

          # CRITICAL FIX: More aggressive cleanup to prevent port conflicts in CI
          echo "Cleaning up existing PostgreSQL test containers..."
          docker rm -f raglite-postgresql-test 2>/dev/null || true
          sleep 3  # Increased wait time for Docker networking cleanup

          # Also kill any processes that might be holding port 5433
          if command -v lsof > /dev/null 2>&1; then
            lsof -ti:5433 | xargs -r kill -9 2>/dev/null || true
          fi

          # Start test services using docker-compose for consistency
          docker compose up -d postgresql-test

          # CRITICAL FIX: Wait for PostgreSQL to FULLY initialize before running setup script
          # PostgreSQL needs time to complete initialization (create default DB, setup users, etc.)
          # Using docker logs to detect "database system is ready to accept connections"
          echo "Waiting for PostgreSQL to fully initialize..."
          MAX_INIT_WAIT=60
          INIT_COUNT=0

          while [ $INIT_COUNT -lt $MAX_INIT_WAIT ]; do
            # Check if PostgreSQL has completed initialization by looking for the ready message
            if docker logs raglite-postgresql-test 2>&1 | grep -q "database system is ready to accept connections"; then
              echo "✅ PostgreSQL initialization complete (${INIT_COUNT}s)"
              # Additional safety wait to ensure full readiness
              sleep 2
              break
            fi

            INIT_COUNT=$((INIT_COUNT + 1))
            if [ $((INIT_COUNT % 10)) -eq 0 ]; then
              echo "Waiting for PostgreSQL initialization... (${INIT_COUNT}s/${MAX_INIT_WAIT}s)"
            fi
            sleep 1
          done

          if [ $INIT_COUNT -eq $MAX_INIT_WAIT ]; then
            echo "❌ PostgreSQL did not complete initialization after ${MAX_INIT_WAIT}s"
            echo "Container logs:"
            docker logs raglite-postgresql-test --tail 50
            exit 1
          fi

          # Run database setup script to create users/databases
          ./scripts/ci-database-setup.sh

          echo "✅ PostgreSQL TEST environment ready with raglite_ci database"

      - name: Initialize Qdrant collection
        # NOTE: Uses job-level env vars (APP_ENV=test, QDRANT_PORT=6335)
        # This ensures collection is created on the TEST Qdrant instance
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing Qdrant collection (APP_ENV=${APP_ENV}, port ${QDRANT_PORT})..."
          python scripts/init-qdrant.py
          echo "✅ Qdrant collection initialized on port ${QDRANT_PORT}"

      - name: Initialize PostgreSQL schema
        # NOTE: Uses job-level env vars (APP_ENV=test, POSTGRES_PORT=5433, POSTGRES_DB=raglite_ci)
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing PostgreSQL schema (${POSTGRES_DB} on port ${POSTGRES_PORT})..."
          python scripts/init-test-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Run integration tests (CI fast mode)
        # NOTE: Environment variables are now set at job level (see test-integration.env)
        # This ensures ALL steps use consistent database configuration
        run: |
          source ci-venv/bin/activate

          # FIX: Add project root and scripts to PYTHONPATH
          # Integration tests also import from scripts directory
          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          # Determine marker filter based on branch
          # Main branch: run ALL tests including slow (thorough validation before release)
          # Other branches: skip slow tests (faster feedback during development)
          if [ "$GITHUB_REF" == "refs/heads/main" ]; then
            MARKER_FILTER=""
            echo "========================================="
            echo "CI MODE: Full Testing on MAIN (APP_ENV=${APP_ENV})"
            echo "- Running ALL integration tests (including slow)"
          else
            MARKER_FILTER="not slow"
            echo "========================================="
            echo "CI MODE: Fast Testing (APP_ENV=${APP_ENV})"
            echo "- Running core integration tests (slow tests skipped)"
          fi
          echo "- Qdrant: ${QDRANT_HOST}:${QDRANT_PORT}"
          echo "- PostgreSQL: ${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
          echo "- Using 10-page sample PDF (~10-15s ingestion)"
          echo "- CRITICAL FIX: Sequential execution (-n 0) to prevent pytest-xdist worker controller errors"
          echo "- Target: 45-50 minutes total (sequential due to shared state)"
          echo "- PYTHONPATH: ${PYTHONPATH}"
          echo "========================================="
          if [ -d "tests/integration" ] && [ -n "$(find tests/integration -name 'test_*.py' -type f)" ]; then
            # CRITICAL FIX: Use sequential execution (-n 0) instead of parallel (-n 1)
            # pytest-xdist worker controller has internal errors with shared Qdrant collection state
            # Integration tests share session fixtures that don't work properly with worker processes
            # FIX: Added --capture=no for live output to prevent 13min runner communication timeout
            pytest tests/integration/ \
              -n 0 \
              -m "$MARKER_FILTER" \
              -v \
              --tb=short \
              --maxfail=3 \
              --capture=no \
              --enforce-isolation-markers \
              --junitxml=pytest-integration-report.xml
          else
            echo "⚠️  No integration tests found, skipping..."
          fi
        continue-on-error: false

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: pytest-integration-report.xml
          retention-days: 30

  # ============================================================================
  # JOB 6: E2E Tests (~28 tests)
  # ============================================================================
  test-e2e:
    name: "🎯 Tests: E2E (~28 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 20  # Increased from 15 to prevent runner communication timeout
    needs: [docker-health-check, test-unit]

    # FIX: Prevent parallel execution with resource-heavy jobs to avoid resource starvation
    concurrency:
      group: resource-heavy-tests-${{ github.ref }}
      cancel-in-progress: false

    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: raglite_ci
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Start and verify PostgreSQL (E2E)
        run: |
          # E2E Tests: Ensure PostgreSQL test environment is available
          echo "Setting up PostgreSQL TEST environment for E2E tests..."

          # CRITICAL FIX: Clean up corrupted data directory from cancelled jobs
          # Root cause: cancel-in-progress can leave pg_filenode.map in bad state
          if [ -d "./postgresql_data_test" ]; then
            echo "Checking PostgreSQL storage health..."
            # Check for corruption markers
            if [ ! -f "./postgresql_data_test/global/pg_filenode.map" ] || \
               find ./postgresql_data_test -name "*.lock" -type f 2>/dev/null | grep -q .; then
              echo "⚠️  Detected corrupted or locked PostgreSQL storage"
              echo "Clearing storage for fresh start..."
              rm -rf ./postgresql_data_test
            fi
          fi

          # Clean up existing PostgreSQL test containers
          echo "Cleaning up existing PostgreSQL test containers..."
          docker rm -f raglite-postgresql-test 2>/dev/null || true
          sleep 3

          # Kill any processes holding port 5433
          if command -v lsof > /dev/null 2>&1; then
            lsof -ti:5433 | xargs -r kill -9 2>/dev/null || true
          fi

          # Start test services using docker-compose
          docker compose up -d postgresql-test

          # Wait for PostgreSQL to fully initialize
          echo "Waiting for PostgreSQL to fully initialize..."
          MAX_INIT_WAIT=60
          INIT_COUNT=0

          while [ $INIT_COUNT -lt $MAX_INIT_WAIT ]; do
            if docker logs raglite-postgresql-test 2>&1 | grep -q "database system is ready to accept connections"; then
              echo "✅ PostgreSQL initialization complete (${INIT_COUNT}s)"
              sleep 2
              break
            fi

            INIT_COUNT=$((INIT_COUNT + 1))
            if [ $((INIT_COUNT % 10)) -eq 0 ]; then
              echo "Waiting for PostgreSQL initialization... (${INIT_COUNT}s/${MAX_INIT_WAIT}s)"
            fi
            sleep 1
          done

          if [ $INIT_COUNT -eq $MAX_INIT_WAIT ]; then
            echo "❌ PostgreSQL did not complete initialization after ${MAX_INIT_WAIT}s"
            echo "Container logs:"
            docker logs raglite-postgresql-test --tail 50
            exit 1
          fi

          # Run database setup script to create users/databases
          ./scripts/ci-database-setup.sh

          echo "✅ PostgreSQL TEST environment ready for E2E tests"

      - name: Initialize PostgreSQL schema (E2E)
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing PostgreSQL schema for E2E tests..."
          python scripts/init-test-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Run E2E tests
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "CI MODE: E2E Tests"
          echo "- Running ALL E2E tests (including slow)"
          echo "- Sequential execution (full isolation)"
          echo "- Target: <15 minutes"
          echo "========================================="
          if [ -d "tests/e2e" ] && [ -n "$(find tests/e2e -name 'test_*.py' -type f)" ]; then
            # FIX: Use --capture=no for live output to maintain runner connection
            pytest tests/e2e/ \
              -n 0 \
              -m "" \
              -v \
              --tb=line \
              --capture=no \
              --junitxml=pytest-e2e-report.xml
          else
            echo "⚠️  No E2E tests found, skipping..."
          fi

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: pytest-e2e-report.xml
          retention-days: 30

