# RAGLite CI/CD Pipeline
# Optimized with UV package manager for 10-100x faster installs
# Supports self-hosted macOS runners with parallel execution
# Based on Powerpoint Agent Generator CI best practices
# Updated: 2025-10-28 - Test Suite Consolidation
# Updated: 2025-10-29 - Runner Isolation (raglite label) + Resource Limits
#
# IMPORTANT: All tests consolidated in tests/ directory (2025-10-28)
# Total test count: ~402 tests (200+ unit, 115+ integration, 28 e2e)
# NFR validation: Accuracy (NFR6/NFR7), Performance (NFR13), Coverage (80%)
#
# RUNNER ISOLATION (2025-10-29):
# - Uses ONLY runners with 'raglite' label (raglite-runner-1, raglite-runner-2)
# - Prevents cross-project resource contention (20 total system runners)
# - Pytest workers limited to 4 (prevents 110-process explosion)
# - Expected: 2 jobs max parallel × 4 workers = 8 processes (~3-5 GB RAM)

name: CI

on:
  push:
    branches: [main, develop, "story/**", "epic/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Restrict permissions (security best practice)
permissions:
  contents: read
  pull-requests: write
  checks: write

# Cancel in-progress runs for same branch/PR (but not on main)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Global environment variables (inherited by ALL jobs)
env:
  APP_ENV: test
  CI: "true"

jobs:
  # ============================================================================
  # INFRASTRUCTURE VERIFICATION
  # ============================================================================

  # ============================================================================
  # JOB 0: Docker Daemon Health Check
  # Ensures Docker is available before running jobs that require it
  # ============================================================================
  docker-health-check:
    name: "🐳 Infrastructure: Docker Availability"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5
    outputs:
      docker-available: ${{ steps.check-docker.outputs.available }}

    steps:
      - name: Check Docker daemon availability
        id: check-docker
        run: |
          echo "========================================="
          echo "Docker Daemon Health Check (Colima)"
          echo "========================================="

          # Check if Docker command exists
          if ! command -v docker &> /dev/null; then
            echo "❌ Docker command not found"
            echo "available=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Check if Colima is installed
          if ! command -v colima &> /dev/null; then
            echo "❌ Colima not found - install with: brew install colima"
            echo "available=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Check if Docker daemon is running (via Colima)
          if docker info &> /dev/null; then
            echo "✅ Docker daemon is running (via Colima)"
            colima status 2>/dev/null || true
            echo ""
            docker version
            echo ""
            echo "Docker context:"
            docker context ls
            echo ""
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Docker daemon is not running - starting Colima..."
            echo ""

            # SELF-HEALING: Start Colima (replaces Docker Desktop)
            # Colima is more stable for CI workloads than Docker Desktop
            echo "Starting Colima..."
            colima start --cpu 4 --memory 8 --disk 100 --runtime docker 2>&1 || true

            # Wait for Docker daemon to become available (max 90 seconds)
            echo "Waiting for Docker daemon to start..."
            MAX_WAIT=90
            WAIT_INTERVAL=3
            ELAPSED=0

            while [ $ELAPSED -lt $MAX_WAIT ]; do
              sleep $WAIT_INTERVAL
              ELAPSED=$((ELAPSED + WAIT_INTERVAL))

              if docker info &> /dev/null 2>&1; then
                echo ""
                echo "✅ Docker daemon started via Colima (${ELAPSED}s)"
                colima status 2>/dev/null || true
                docker version
                echo ""
                echo "Docker context:"
                docker context ls
                echo ""
                echo "available=true" >> $GITHUB_OUTPUT
                exit 0
              fi

              echo -n "."
            done

            # Timeout - Colima didn't start
            echo ""
            echo "❌ Colima failed to start after ${MAX_WAIT}s"
            echo ""
            colima status 2>/dev/null || echo "Colima status unavailable"
            echo ""
            echo "Docker context:"
            docker context ls || true
            echo ""
            echo "Manual intervention required:"
            echo "  1. Check Colima status: colima status"
            echo "  2. Restart Colima manually: colima start"
            echo "  3. Check system resources (CPU, memory, disk)"
            echo ""
            echo "available=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify Docker socket
        if: steps.check-docker.outputs.available == 'true'
        run: |
          echo "Verifying Docker socket accessibility..."

          DOCKER_SOCKET=$(docker context inspect --format '{{.Endpoints.docker.Host}}' | sed 's|unix://||')
          echo "Docker socket path: $DOCKER_SOCKET"

          if [ -S "$DOCKER_SOCKET" ]; then
            echo "✅ Docker socket is accessible at $DOCKER_SOCKET"
          else
            echo "❌ Docker socket not found at $DOCKER_SOCKET"
            exit 1
          fi

  # ============================================================================
  # CODE QUALITY CHECKS
  # ============================================================================

  # ============================================================================
  # JOB 1: Linting & Formatting
  # ============================================================================
  lint:
    name: "📝 Code Quality: Lint & Format"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Validate UV Cache
        run: |
          if [ -d ~/.cache/uv ]; then
            CACHE_SIZE=$(du -sm ~/.cache/uv 2>/dev/null | cut -f1 || echo "0")
            if [ "$CACHE_SIZE" -gt 4096 ]; then
              echo "Clearing oversized UV cache (${CACHE_SIZE}MB)..."
              rm -rf ~/.cache/uv
            fi
            PARTIAL=$(find ~/.cache/uv -name "*.partial" -o -name "*.tmp" 2>/dev/null | wc -l || echo "0")
            if [ "$PARTIAL" -gt 0 ]; then
              echo "Found corrupted cache entries, clearing..."
              rm -rf ~/.cache/uv
            fi
          fi

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install ruff isort

      - name: Run Ruff linter
        run: |
          source ci-venv/bin/activate
          ruff check . --output-format=github
        continue-on-error: true

      - name: Run Ruff formatter check
        run: |
          source ci-venv/bin/activate
          # Use ruff format to match pre-commit hook configuration
          ruff format --check --diff raglite/ tests/ scripts/
        continue-on-error: true

      - name: Run isort import check
        run: |
          source ci-venv/bin/activate
          isort --check-only --diff raglite/ tests/ scripts/
        continue-on-error: true

  # ============================================================================
  # JOB 1.5: File Size Validation
  # ============================================================================
  file-size-check:
    name: "📏 Code Quality: File Size Limits"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file sizes
        run: |
          echo "========================================="
          echo "FILE SIZE VALIDATION"
          echo "- Warning threshold: 400 LOC"
          echo "- Hard limit: 500 LOC"
          echo "- Mode: Block new violations in raglite/"
          echo "========================================="
          python3 scripts/check_file_sizes.py --verbose

  # ============================================================================
  # JOB 2: Type Checking
  # ============================================================================
  type-check:
    name: "🔍 Code Quality: Type Check (mypy)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Validate UV Cache
        run: |
          if [ -d ~/.cache/uv ]; then
            CACHE_SIZE=$(du -sm ~/.cache/uv 2>/dev/null | cut -f1 || echo "0")
            if [ "$CACHE_SIZE" -gt 4096 ]; then
              echo "Clearing oversized UV cache (${CACHE_SIZE}MB)..."
              rm -rf ~/.cache/uv
            fi
            PARTIAL=$(find ~/.cache/uv -name "*.partial" -o -name "*.tmp" 2>/dev/null | wc -l || echo "0")
            if [ "$PARTIAL" -gt 0 ]; then
              echo "Found corrupted cache entries, clearing..."
              rm -rf ~/.cache/uv
            fi
          fi

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          # SQLAlchemy 2.x has built-in type hints, no stubs needed (sqlalchemy-stubs is for 1.x only)
          uv pip install mypy types-requests types-setuptools

      - name: Run mypy on raglite/ package
        run: |
          source ci-venv/bin/activate
          mypy raglite/ --show-error-codes
        continue-on-error: false

  # ============================================================================
  # JOB 3: Security Scanning
  # ============================================================================
  security:
    name: "🔒 Code Quality: Security Scan"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install security scanning tools with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install bandit[toml] safety
          uv pip install -e .

      - name: Run Bandit security linter
        run: |
          source ci-venv/bin/activate
          bandit -r raglite/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Safety dependency scanner
        run: |
          source ci-venv/bin/activate
          safety check --json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # ============================================================================
  # TEST SUITES
  # ============================================================================

  # ============================================================================
  # JOB 4: Unit Tests (~200 tests)
  # ============================================================================
  test-unit:
    name: "🧪 Tests: Unit (~200 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Validate UV Cache
        run: |
          if [ -d ~/.cache/uv ]; then
            CACHE_SIZE=$(du -sm ~/.cache/uv 2>/dev/null | cut -f1 || echo "0")
            if [ "$CACHE_SIZE" -gt 4096 ]; then
              echo "Clearing oversized UV cache (${CACHE_SIZE}MB)..."
              rm -rf ~/.cache/uv
            fi
            PARTIAL=$(find ~/.cache/uv -name "*.partial" -o -name "*.tmp" 2>/dev/null | wc -l || echo "0")
            if [ "$PARTIAL" -gt 0 ]; then
              echo "Found corrupted cache entries, clearing..."
              rm -rf ~/.cache/uv
            fi
          fi

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          # FIX: Install pytest-mock (was missing) and pin versions to match local environment
          uv pip install \
            pytest==8.4.2 \
            pytest-cov==5.0.0 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Run unit tests with coverage
        run: |
          source ci-venv/bin/activate

          # FIX: Add project root and scripts to PYTHONPATH
          # This matches local Test Explorer environment where scripts/ is importable
          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          echo "========================================="
          echo "CI MODE: Unit Tests with Coverage"
          echo "- Running ALL unit tests (including slow)"
          echo "- Parallel workers: 4 (safe parallelism, no shared state)"
          echo "- Target: <10 minutes"
          echo "- PYTHONPATH: ${PYTHONPATH}"
          echo "========================================="
          pytest tests/unit/ \
            -n 4 \
            --dist loadfile \
            -m "" \
            --cov=raglite \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junitxml=pytest-unit-report.xml \
            -v

      - name: Enforce coverage threshold (80%)
        run: |
          source ci-venv/bin/activate
          coverage report --fail-under=80
        continue-on-error: true

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            coverage.xml
            htmlcov/
            pytest-unit-report.xml
          retention-days: 30

  # ============================================================================
  # JOB 5: Integration Tests (~115 tests, requires Qdrant)
  # CI MODE: Uses 160-page full PDF for comprehensive testing
  # ============================================================================
  test-integration:
    name: "🔗 Tests: Integration (~115 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 90  # Sequential execution requires 45-50 min + buffer for slow tests
    needs: [docker-health-check, test-unit]
    # CRITICAL FIX: Set APP_ENV=test at job level for consistent test database routing
    # This ensures ALL steps (health check, init, tests) use the same test infrastructure:
    # - Qdrant: port 6335, collection financial_docs_ci
    # - PostgreSQL: port 5433, database raglite_ci
    env:
      APP_ENV: test
      QDRANT_HOST: localhost
      QDRANT_PORT: 6335
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: raglite_ci
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci
      TEST_USE_FULL_PDF: "false"
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-test memory cleanup (OOM prevention)
        run: |
          echo "========================================="
          echo "Pre-Test Memory Cleanup (Self-Hosted Runner)"
          echo "========================================="

          # CRITICAL FIX (2025-12-24): Kill orphaned resource_tracker processes
          # These zombie processes from previous test runs prevent proper cleanup
          # and cause SIGKILL (exit code 137) during pytest shutdown
          echo ""
          echo "Cleaning up orphaned resource_tracker processes..."

          # List orphaned processes BEFORE cleanup (for diagnostics)
          JOBLIB_PIDS=$(pgrep -f "joblib.externals.loky.backend.resource_tracker" || true)
          MULTIPROC_PIDS=$(pgrep -f "multiprocessing.resource_tracker" || true)

          if [ -n "$JOBLIB_PIDS" ]; then
            echo "  Found orphaned joblib resource_tracker processes: $JOBLIB_PIDS"
            pkill -9 -f "joblib.externals.loky.backend.resource_tracker" && echo "  ✅ Killed joblib resource_tracker processes" || echo "  ⚠️  Failed to kill joblib processes"
          else
            echo "  No orphaned joblib resource_tracker processes found"
          fi

          if [ -n "$MULTIPROC_PIDS" ]; then
            echo "  Found orphaned multiprocessing resource_tracker processes: $MULTIPROC_PIDS"
            pkill -9 -f "multiprocessing.resource_tracker" && echo "  ✅ Killed multiprocessing resource_tracker processes" || echo "  ⚠️  Failed to kill multiprocessing processes"
          else
            echo "  No orphaned multiprocessing resource_tracker processes found"
          fi

          # Stop and remove any stale containers from previous runs
          echo ""
          echo "Cleaning up stale containers..."
          docker ps -a --filter "name=raglite-" --format '{{.Names}}' | xargs -r docker rm -f 2>/dev/null || true

          # Prune Docker resources to free memory
          echo "Pruning unused Docker resources..."
          docker system prune -f --volumes 2>/dev/null || true

          # Clear pip/uv caches if they're consuming too much memory
          # These can grow over time on self-hosted runners
          if [ -d ~/.cache/uv ]; then
            CACHE_SIZE=$(du -sm ~/.cache/uv 2>/dev/null | cut -f1 || echo "0")
            if [ "$CACHE_SIZE" -gt 2048 ]; then
              echo "Pruning large uv cache (${CACHE_SIZE}MB > 2GB limit)..."
              rm -rf ~/.cache/uv/builds-v0 2>/dev/null || true
            fi
          fi

          # Report initial memory state
          echo ""
          echo "Initial memory state:"
          if command -v vm_stat &> /dev/null; then
            PAGE_SIZE=$(sysctl -n hw.pagesize 2>/dev/null || echo 4096)
            FREE_PAGES=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
            INACTIVE_PAGES=$(vm_stat | grep "Pages inactive" | awk '{print $3}' | tr -d '.')
            FREE_MB=$((FREE_PAGES * PAGE_SIZE / 1024 / 1024))
            INACTIVE_MB=$((INACTIVE_PAGES * PAGE_SIZE / 1024 / 1024))
            AVAILABLE_MB=$((FREE_MB + INACTIVE_MB))
            echo "  Available: ${AVAILABLE_MB}MB"
          fi

          echo ""
          echo "✅ Pre-test cleanup complete"

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Validate UV Cache
        run: |
          if [ -d ~/.cache/uv ]; then
            CACHE_SIZE=$(du -sm ~/.cache/uv 2>/dev/null | cut -f1 || echo "0")
            if [ "$CACHE_SIZE" -gt 4096 ]; then
              echo "Clearing oversized UV cache (${CACHE_SIZE}MB)..."
              rm -rf ~/.cache/uv
            fi
            PARTIAL=$(find ~/.cache/uv -name "*.partial" -o -name "*.tmp" 2>/dev/null | wc -l || echo "0")
            if [ "$PARTIAL" -gt 0 ]; then
              echo "Found corrupted cache entries, clearing..."
              rm -rf ~/.cache/uv
            fi
          fi

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: 🚀 Start Test Containers
        run: |
          chmod +x scripts/ci/start-test-containers.sh
          ./scripts/ci/start-test-containers.sh test

          # Source exported environment variables
          source .ci-env

          echo "✅ Test containers ready:"
          echo "  - Qdrant: localhost:${QDRANT_PORT}"
          echo "  - PostgreSQL: localhost:${POSTGRES_PORT}"
          echo "  - APP_ENV: ${APP_ENV}"

      - name: Validate integration test isolation markers
        run: |
          echo "========================================="
          echo "Validating integration test isolation markers"
          echo "========================================="
          python3 -c "
          from pathlib import Path
          import sys

          errors = []
          integration_dir = Path('tests/integration')

          for test_file in integration_dir.glob('test_*.py'):
              content = test_file.read_text()

              # Skip if not an integration test file (check for pytest.mark.integration)
              if 'pytest.mark.integration' not in content:
                  continue

              # Check for isolation markers in pytestmark (module level)
              has_preserve = 'preserve_collection' in content
              has_manages = 'manages_collection_state' in content

              # Must have at least one isolation marker in the file
              if not (has_preserve or has_manages):
                  errors.append(f'{test_file}: Missing isolation marker (preserve_collection or manages_collection_state)')

          if errors:
              print('❌ Integration test files missing isolation markers:')
              for err in errors:
                  print(f'  - {err}')
              print()
              print('Fix: Add pytest.mark.preserve_collection or pytest.mark.manages_collection_state to pytestmark')
              sys.exit(1)
          else:
              count = len(list(integration_dir.glob('test_*.py')))
              print(f'✅ All {count} integration test files have proper isolation markers')
          "

      - name: 🔍 Pre-Test Diagnostics
        run: |
          echo "========================================="
          echo "Pre-Test System Diagnostics"
          echo "========================================="

          echo ""
          echo "=== System Resources ==="
          if command -v vm_stat &> /dev/null; then
            vm_stat | head -10
            echo ""
            echo "Memory Summary:"
            PAGE_SIZE=$(sysctl -n hw.pagesize 2>/dev/null || echo 4096)
            FREE_PAGES=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
            INACTIVE_PAGES=$(vm_stat | grep "Pages inactive" | awk '{print $3}' | tr -d '.')
            WIRED_PAGES=$(vm_stat | grep "Pages wired down" | awk '{print $4}' | tr -d '.')
            ACTIVE_PAGES=$(vm_stat | grep "Pages active" | awk '{print $3}' | tr -d '.')
            FREE_MB=$((FREE_PAGES * PAGE_SIZE / 1024 / 1024))
            INACTIVE_MB=$((INACTIVE_PAGES * PAGE_SIZE / 1024 / 1024))
            AVAILABLE_MB=$((FREE_MB + INACTIVE_MB))
            ACTIVE_MB=$((ACTIVE_PAGES * PAGE_SIZE / 1024 / 1024))
            WIRED_MB=$((WIRED_PAGES * PAGE_SIZE / 1024 / 1024))
            echo "  Available: ${AVAILABLE_MB}MB"
            echo "  Active: ${ACTIVE_MB}MB"
            echo "  Wired: ${WIRED_MB}MB"
          fi

          echo ""
          echo "=== Running Docker Containers ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep raglite || echo "No raglite containers found"

          echo ""
          echo "=== Port Usage (Test Ports) ==="
          echo "Qdrant (6335):"
          lsof -i:6335 || echo "  Port 6335 not in use"
          echo ""
          echo "PostgreSQL (5433):"
          lsof -i:5433 || echo "  Port 5433 not in use"

          echo ""
          echo "=== Process Tree ==="
          ps aux | grep -E "(docker|pytest|python)" | grep -v grep | head -20

          echo ""
          echo "=== Disk Space ==="
          df -h | grep -E "(Filesystem|/Users)"

          echo "========================================="

      - name: Run integration tests (CI fast mode)
        # NOTE: Environment variables are now set at job level (see test-integration.env)
        # This ensures ALL steps use consistent database configuration
        run: |
          source ci-venv/bin/activate

          # FIX: Add project root and scripts to PYTHONPATH
          # Integration tests also import from scripts directory
          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          # Start background memory monitor (logs every 30s, captures OOM patterns)
          echo "Starting background memory monitor..."
          (
            while true; do
              TIMESTAMP=$(date +"%H:%M:%S")
              if command -v vm_stat &> /dev/null; then
                # macOS memory monitoring
                PAGE_SIZE=$(sysctl -n hw.pagesize 2>/dev/null || echo 4096)
                FREE_PAGES=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
                INACTIVE_PAGES=$(vm_stat | grep "Pages inactive" | awk '{print $3}' | tr -d '.')
                WIRED_PAGES=$(vm_stat | grep "Pages wired down" | awk '{print $4}' | tr -d '.')
                ACTIVE_PAGES=$(vm_stat | grep "Pages active" | awk '{print $3}' | tr -d '.')

                FREE_MB=$((FREE_PAGES * PAGE_SIZE / 1024 / 1024))
                INACTIVE_MB=$((INACTIVE_PAGES * PAGE_SIZE / 1024 / 1024))
                AVAILABLE_MB=$((FREE_MB + INACTIVE_MB))
                ACTIVE_MB=$((ACTIVE_PAGES * PAGE_SIZE / 1024 / 1024))
                WIRED_MB=$((WIRED_PAGES * PAGE_SIZE / 1024 / 1024))

                echo "[$TIMESTAMP] MEM: available=${AVAILABLE_MB}MB active=${ACTIVE_MB}MB wired=${WIRED_MB}MB" >> memory_monitor.log

                # Alert if memory is critically low
                if [ $AVAILABLE_MB -lt 512 ]; then
                  echo "[$TIMESTAMP] ⚠️ CRITICAL: Only ${AVAILABLE_MB}MB available - OOM risk!" >> memory_monitor.log
                fi
              fi
              sleep 30
            done
          ) &
          MEMORY_MONITOR_PID=$!
          echo "Memory monitor PID: $MEMORY_MONITOR_PID"

          # Determine marker filter based on branch
          # Main branch: run ALL tests including slow (thorough validation before release)
          # Other branches: skip slow tests (faster feedback during development)
          if [ "$GITHUB_REF" == "refs/heads/main" ]; then
            MARKER_FILTER=""
            echo "========================================="
            echo "CI MODE: Full Testing on MAIN (APP_ENV=${APP_ENV})"
            echo "- Running ALL integration tests (including slow)"
          else
            MARKER_FILTER="not slow"
            echo "========================================="
            echo "CI MODE: Fast Testing (APP_ENV=${APP_ENV})"
            echo "- Running core integration tests (slow tests skipped)"
          fi
          echo "- Qdrant: ${QDRANT_HOST}:${QDRANT_PORT}"
          echo "- PostgreSQL: ${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
          echo "- Using 10-page sample PDF (~10-15s ingestion)"
          echo "- CRITICAL FIX: Sequential execution (-n 0) to prevent pytest-xdist worker controller errors"
          echo "- Target: 45-50 minutes total (sequential due to shared state)"
          echo "- PYTHONPATH: ${PYTHONPATH}"
          echo "========================================="

          TEST_EXIT_CODE=0
          if [ -d "tests/integration" ] && [ -n "$(find tests/integration -name 'test_*.py' -type f)" ]; then
            # CRITICAL FIX: Use sequential execution (-n 0) instead of parallel (-n 1)
            # pytest-xdist worker controller has internal errors with shared Qdrant collection state
            # Integration tests share session fixtures that don't work properly with worker processes
            # FIX: Added --capture=no for live output to prevent 13min runner communication timeout
            pytest tests/integration/ \
              -n 0 \
              -m "$MARKER_FILTER" \
              -v \
              --tb=short \
              --maxfail=3 \
              --capture=no \
              --enforce-isolation-markers \
              --junitxml=pytest-integration-report.xml || TEST_EXIT_CODE=$?
          else
            echo "⚠️  No integration tests found, skipping..."
          fi

          # Stop memory monitor
          kill $MEMORY_MONITOR_PID 2>/dev/null || true

          # Show memory log summary
          echo ""
          echo "========================================="
          echo "Memory Monitor Summary"
          echo "========================================="
          if [ -f memory_monitor.log ]; then
            echo "Memory samples during test run:"
            cat memory_monitor.log
            # Check for any critical warnings
            if grep -q "CRITICAL" memory_monitor.log; then
              echo ""
              echo "⚠️ CRITICAL memory warnings detected during test run!"
            fi
          else
            echo "No memory log generated"
          fi

          # Exit with test result
          exit $TEST_EXIT_CODE
        continue-on-error: false

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: pytest-integration-report.xml
          retention-days: 30

      - name: Cleanup containers (self-hosted runner hygiene)
        if: always()
        run: |
          echo "========================================="
          echo "Container Cleanup (Self-Hosted Runner)"
          echo "========================================="

          # ========================================
          # SAFE TEST CONTAINER CLEANUP
          # ========================================
          # SAFETY: Only targets containers with -test suffix to protect production
          # - qdrant-test (CI test database)
          # - postgresql-test (CI test database)
          # - NEVER touches production containers (qdrant, postgresql)
          # ========================================

          echo "🧹 Safe Test Container Cleanup (Test Services Only)"
          PROJECT_NAME="raglite"

          # Step 1: Remove qdrant-test containers by service label
          echo "Step 1: Removing qdrant-test containers..."
          QDRANT_TEST_IDS=$(docker ps -a \
            --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
            --filter "label=com.docker.compose.service=qdrant-test" \
            --format '{{.ID}}' 2>/dev/null || echo "")
          if [ -n "$QDRANT_TEST_IDS" ]; then
            echo "  Found qdrant-test containers: $QDRANT_TEST_IDS"
            echo "$QDRANT_TEST_IDS" | xargs -r docker rm -f 2>/dev/null || true
          else
            echo "  No qdrant-test containers found"
          fi

          # Step 2: Remove postgresql-test containers by service label
          echo "Step 2: Removing postgresql-test containers..."
          PG_TEST_IDS=$(docker ps -a \
            --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
            --filter "label=com.docker.compose.service=postgresql-test" \
            --format '{{.ID}}' 2>/dev/null || echo "")
          if [ -n "$PG_TEST_IDS" ]; then
            echo "  Found postgresql-test containers: $PG_TEST_IDS"
            echo "$PG_TEST_IDS" | xargs -r docker rm -f 2>/dev/null || true
          else
            echo "  No postgresql-test containers found"
          fi

          # Step 3: Fallback - remove by exact test container names
          echo "Step 3: Fallback cleanup by exact test container names..."
          docker ps -a --filter "name=raglite-qdrant-test" --format '{{.ID}}' 2>/dev/null | xargs -r docker rm -f 2>/dev/null || true
          docker ps -a --filter "name=raglite-postgresql-test" --format '{{.ID}}' 2>/dev/null | xargs -r docker rm -f 2>/dev/null || true

          # Step 3b: Remove CI-specific isolated containers (not production!)
          # These use ephemeral storage and unique names per job
          echo "Step 3b: Removing CI-specific isolated containers..."
          for suffix in agentic discovery burnin; do
            docker rm -f "raglite-qdrant-${suffix}" 2>/dev/null || true
            docker rm -f "raglite-postgresql-${suffix}" 2>/dev/null || true
          done

          # Step 4: Remove ONLY unused networks (safe - won't remove networks with running containers)
          echo "Step 4: Pruning unused networks..."
          docker network prune -f 2>/dev/null || true

          # Step 5: NO volume cleanup - test containers use bind mounts, not named volumes
          # SAFETY: Skipping volume prune to protect any production data volumes
          echo "Step 5: Skipping volume cleanup (protection for production data)"

          # Step 6: Wait for Docker to stabilize
          echo "Step 6: Waiting for Docker to stabilize..."
          sleep 3

          echo "✅ Safe CI container cleanup complete!"
          echo "ℹ️  Production containers (raglite-qdrant, raglite-postgresql) were NOT touched"
          echo "ℹ️  Cleaned: -test, -agentic, -discovery, -burnin containers"

          # Report disk space (early warning for storage issues)
          echo ""
          echo "Runner disk space:"
          df -h / | tail -1

          echo ""
          echo "✅ Container cleanup complete"

  # ============================================================================
  # JOB 6: E2E Tests (~28 tests)
  # ============================================================================
  test-e2e:
    name: "🎯 Tests: E2E (~28 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 20  # Increased from 15 to prevent runner communication timeout
    needs: [docker-health-check, test-unit]

    # FIX: Prevent parallel execution with resource-heavy jobs to avoid resource starvation
    concurrency:
      group: resource-heavy-tests-${{ github.ref }}
      cancel-in-progress: false

    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: raglite_ci
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Validate UV Cache
        run: |
          if [ -d ~/.cache/uv ]; then
            CACHE_SIZE=$(du -sm ~/.cache/uv 2>/dev/null | cut -f1 || echo "0")
            if [ "$CACHE_SIZE" -gt 4096 ]; then
              echo "Clearing oversized UV cache (${CACHE_SIZE}MB)..."
              rm -rf ~/.cache/uv
            fi
            PARTIAL=$(find ~/.cache/uv -name "*.partial" -o -name "*.tmp" 2>/dev/null | wc -l || echo "0")
            if [ "$PARTIAL" -gt 0 ]; then
              echo "Found corrupted cache entries, clearing..."
              rm -rf ~/.cache/uv
            fi
          fi

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Start Test Containers (E2E)
        run: |
          chmod +x scripts/ci/start-test-containers.sh
          ./scripts/ci/start-test-containers.sh test --postgresql-only
          source .ci-env

          # Run database setup script to create users/databases
          ./scripts/ci-database-setup.sh

          echo "✅ PostgreSQL TEST environment ready for E2E tests"

      - name: Initialize PostgreSQL schema (E2E)
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing PostgreSQL schema for E2E tests..."
          python scripts/init-test-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Memory diagnostics (E2E pre-test)
        run: |
          echo "📊 E2E Pre-Test Memory Check:"
          if command -v vm_stat &> /dev/null; then
            PAGE_SIZE=$(sysctl -n hw.pagesize 2>/dev/null || echo 4096)
            FREE_PAGES=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
            INACTIVE_PAGES=$(vm_stat | grep "Pages inactive" | awk '{print $3}' | tr -d '.')
            FREE_MB=$((FREE_PAGES * PAGE_SIZE / 1024 / 1024))
            INACTIVE_MB=$((INACTIVE_PAGES * PAGE_SIZE / 1024 / 1024))
            AVAILABLE_MB=$((FREE_MB + INACTIVE_MB))
            echo "  Available memory: ${AVAILABLE_MB}MB"
            if [ $AVAILABLE_MB -lt 1024 ]; then
              echo "  ⚠️ WARNING: Low memory (${AVAILABLE_MB}MB < 1GB)"
            else
              echo "  ✅ Memory adequate for E2E tests"
            fi
          fi
          echo ""
          docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}" 2>/dev/null | head -5 || true

      - name: Run E2E tests
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "CI MODE: E2E Tests"
          echo "- Running ALL E2E tests (including slow)"
          echo "- Sequential execution (full isolation)"
          echo "- Target: <15 minutes"
          echo "========================================="
          if [ -d "tests/e2e" ] && [ -n "$(find tests/e2e -name 'test_*.py' -type f)" ]; then
            # FIX: Use --capture=no for live output to maintain runner connection
            pytest tests/e2e/ \
              -n 0 \
              -m "" \
              -v \
              --tb=line \
              --capture=no \
              --junitxml=pytest-e2e-report.xml
          else
            echo "⚠️  No E2E tests found, skipping..."
          fi

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: pytest-e2e-report.xml
          retention-days: 30

