# RAGLite CI - Simplified Pipeline
# Designed for self-hosted runners with 24GB RAM shared across multiple projects
#
# Architecture: Three-Tier CI
# - Tier 1 (validate): Every push/PR, <10 min, no containers, mocked ML deps
# - Tier 2 (integration): Main branch only, <20 min, with containers
# - Tier 3: See nightly.yml for comprehensive validation
#
# Resource Budget: <4GB RAM for Tier 1, <6GB RAM for Tier 2
# This allows 2-3 projects to run CI simultaneously on shared runner

name: CI

on:
  push:
    branches: [main, develop, "story/**", "epic/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CI: "true"

jobs:
  # ============================================================
  # TIER 1: Fast PR Validation
  # Runs on every push/PR
  # Target: <10 minutes, <4GB RAM, NO containers
  # ============================================================
  validate:
    name: "Validate"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate UV Cache
        run: |
          if [ -d ~/.cache/uv ]; then
            CACHE_SIZE=$(du -sm ~/.cache/uv 2>/dev/null | cut -f1 || echo "0")
            if [ "$CACHE_SIZE" -gt 4096 ]; then
              echo "Clearing oversized UV cache (${CACHE_SIZE}MB)..."
              rm -rf ~/.cache/uv
            fi
            PARTIAL=$(find ~/.cache/uv -name "*.partial" -o -name "*.tmp" 2>/dev/null | wc -l || echo "0")
            if [ "$PARTIAL" -gt 0 ]; then
              echo "Found corrupted cache entries, clearing..."
              rm -rf ~/.cache/uv
            fi
          fi

      - name: Setup Python + UV
        run: |
          echo "Creating virtual environment..."
          uv venv ci-venv --python 3.11 --quiet 2>/dev/null || uv venv ci-venv --quiet
          source ci-venv/bin/activate
          echo "Installing dependencies (lightweight mode)..."
          uv pip install -e ".[dev]" --quiet

      - name: Lint + Format Check
        run: |
          source ci-venv/bin/activate
          echo "Running ruff linter..."
          ruff check raglite/ tests/ --output-format=github
          echo "Checking code formatting..."
          ruff format raglite/ tests/ --check

      - name: Type Check (mypy)
        run: |
          source ci-venv/bin/activate
          echo "Running mypy type checker..."
          mypy raglite/ --ignore-missing-imports --no-error-summary || true

      - name: Security Scan (bandit)
        run: |
          source ci-venv/bin/activate
          echo "Running security scan..."
          bandit -r raglite/ -ll -q -f txt || true

      - name: Unit Tests (Lightweight Mode)
        env:
          LIGHTWEIGHT_TESTS: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Running Unit Tests (LIGHTWEIGHT_TESTS=true)"
          echo "ML dependencies are mocked to save memory"
          echo "========================================="
          pytest tests/unit/ \
            -x \
            --tb=short \
            -q \
            --timeout=120 \
            --junitxml=test-results/junit.xml \
            2>&1 || exit_code=$?

          # Exit with test result
          exit ${exit_code:-0}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tier1
          path: test-results/
          retention-days: 7

  # ============================================================
  # TIER 2: Main Branch Integration Gate
  # Runs ONLY on main branch pushes
  # Target: <20 minutes, <6GB RAM, with containers
  # ============================================================
  integration:
    name: "Integration"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 30
    needs: validate
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker availability
        run: |
          if ! docker info &> /dev/null; then
            echo "Starting Colima..."
            colima start --cpu 4 --memory 6 --disk 50 --runtime docker 2>&1 || true
            sleep 5
          fi
          docker info > /dev/null || (echo "Docker not available" && exit 1)

      - name: Start Test Containers
        run: |
          chmod +x scripts/ci/start-test-containers.sh
          ./scripts/ci/start-test-containers.sh test
          echo "Containers started, loading environment..."
          cat .ci-env

      - name: Setup Python + UV
        run: |
          uv venv ci-venv --python 3.11 --quiet 2>/dev/null || uv venv ci-venv --quiet
          source ci-venv/bin/activate
          uv pip install -e ".[dev]" --quiet

      - name: Run Integration Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source ci-venv/bin/activate
          source .ci-env
          echo "========================================="
          echo "Running Integration Tests"
          echo "Qdrant: localhost:${QDRANT_PORT}"
          echo "PostgreSQL: localhost:${POSTGRES_PORT}"
          echo "========================================="
          pytest tests/integration/ \
            -x \
            --tb=short \
            -q \
            -n 0 \
            --timeout=300 \
            --junitxml=test-results/integration-junit.xml \
            2>&1 || exit_code=$?

          exit ${exit_code:-0}

      - name: Upload Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tier2
          path: test-results/
          retention-days: 7

      - name: Cleanup Containers
        if: always()
        run: |
          chmod +x scripts/ci/cleanup-test-containers.sh
          ./scripts/ci/cleanup-test-containers.sh test --force || true
