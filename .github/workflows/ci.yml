# RAGLite CI/CD Pipeline
# Optimized with UV package manager for 10-100x faster installs
# Supports self-hosted macOS runners with parallel execution
# Based on Powerpoint Agent Generator CI best practices
# Updated: 2025-10-28 - Test Suite Consolidation
# Updated: 2025-10-29 - Runner Isolation (raglite label) + Resource Limits
#
# IMPORTANT: All tests consolidated in tests/ directory (2025-10-28)
# Total test count: ~402 tests (200+ unit, 115+ integration, 28 e2e)
# NFR validation: Accuracy (NFR6/NFR7), Performance (NFR13), Coverage (80%)
#
# RUNNER ISOLATION (2025-10-29):
# - Uses ONLY runners with 'raglite' label (raglite-runner-1, raglite-runner-2)
# - Prevents cross-project resource contention (20 total system runners)
# - Pytest workers limited to 4 (prevents 110-process explosion)
# - Expected: 2 jobs max parallel × 4 workers = 8 processes (~3-5 GB RAM)

name: CI

on:
  push:
    branches: [main, develop, "story/**", "epic/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Restrict permissions (security best practice)
permissions:
  contents: read
  pull-requests: write
  checks: write

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # CODE QUALITY CHECKS
  # ============================================================================

  # ============================================================================
  # JOB 1: Linting & Formatting
  # ============================================================================
  lint:
    name: "📝 Code Quality: Lint & Format"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install ruff black isort

      - name: Run Ruff linter
        run: |
          source ci-venv/bin/activate
          ruff check . --output-format=github
        continue-on-error: true

      - name: Run Black formatter check
        run: |
          source ci-venv/bin/activate
          black --check --diff raglite/ tests/ scripts/
        continue-on-error: true

      - name: Run isort import check
        run: |
          source ci-venv/bin/activate
          isort --check-only --diff raglite/ tests/ scripts/
        continue-on-error: true

  # ============================================================================
  # JOB 2: Type Checking
  # ============================================================================
  type-check:
    name: "🔍 Code Quality: Type Check (mypy)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install mypy types-requests

      - name: Run mypy on raglite/ package
        run: |
          source ci-venv/bin/activate
          mypy raglite/ --show-error-codes --ignore-missing-imports
        continue-on-error: true

  # ============================================================================
  # JOB 3: Security Scanning
  # ============================================================================
  security:
    name: "🔒 Code Quality: Security Scan"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install security scanning tools with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install bandit[toml] safety
          uv pip install -e .

      - name: Run Bandit security linter
        run: |
          source ci-venv/bin/activate
          bandit -r raglite/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Safety dependency scanner
        run: |
          source ci-venv/bin/activate
          safety check --json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # ============================================================================
  # TEST SUITES
  # ============================================================================

  # ============================================================================
  # JOB 4: Unit Tests (~200 tests)
  # ============================================================================
  test-unit:
    name: "🧪 Tests: Unit (~200 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          # FIX: Install pytest-mock (was missing) and pin versions to match local environment
          uv pip install \
            pytest==8.4.2 \
            pytest-cov==5.0.0 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Run unit tests with coverage
        run: |
          source ci-venv/bin/activate

          # FIX: Add project root and scripts to PYTHONPATH
          # This matches local Test Explorer environment where scripts/ is importable
          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          echo "========================================="
          echo "CI MODE: Unit Tests with Coverage"
          echo "- Running ALL unit tests (including slow)"
          echo "- Parallel workers: 4 (safe parallelism, no shared state)"
          echo "- Target: <10 minutes"
          echo "- PYTHONPATH: ${PYTHONPATH}"
          echo "========================================="
          pytest tests/unit/ \
            -n 4 \
            --dist loadfile \
            -m "" \
            --cov=raglite \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junitxml=pytest-unit-report.xml \
            -v

      - name: Enforce coverage threshold (80%)
        run: |
          source ci-venv/bin/activate
          coverage report --fail-under=80
        continue-on-error: true

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            coverage.xml
            htmlcov/
            pytest-unit-report.xml
          retention-days: 30

  # ============================================================================
  # JOB 5: Integration Tests (~115 tests, requires Qdrant)
  # CI MODE: Uses 160-page full PDF for comprehensive testing
  # ============================================================================
  test-integration:
    name: "🔗 Tests: Integration (~115 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 90  # Sequential execution requires 45-50 min + buffer for slow tests
    needs: [test-unit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Verify Qdrant is available
        run: |
          echo "Checking persistent Qdrant instance..."

          # Wait for Qdrant to be ready (max 30 seconds)
          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf http://localhost:6333/collections > /dev/null 2>&1; then
              echo "✅ Qdrant is available at localhost:6333"

              # Additional health check: verify cluster status
              CLUSTER_STATUS=$(curl -sf http://localhost:6333/cluster | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "unknown")
              echo "Cluster status: $CLUSTER_STATUS"

              # Check telemetry for any recent 500 errors
              ERROR_500_COUNT=$(curl -sf http://localhost:6333/telemetry 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print(sum(endpoint.get('500', {}).get('count', 0) for endpoint in data['result']['requests']['rest']['responses'].values()))" 2>/dev/null || echo "0")
              echo "Recent 500 errors: $ERROR_500_COUNT"

              if [ "$ERROR_500_COUNT" -gt 0 ]; then
                echo "⚠️  Warning: Qdrant has $ERROR_500_COUNT recent 500 errors"
                echo "Restarting Qdrant to clear error state..."
                docker restart raglite-qdrant
                sleep 5
              fi

              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Waiting for Qdrant... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 1
          done

          echo "❌ Qdrant not available after ${MAX_RETRIES}s"
          echo "To start: docker run -d -p 6333:6333 --name raglite-qdrant qdrant/qdrant:v1.15.0"
          exit 1

      - name: Start and verify PostgreSQL
        run: |
          echo "Ensuring fresh PostgreSQL container..."

          # Check if container exists
          if docker ps -a --format '{{.Names}}' | grep -q "^raglite-postgresql$"; then
            echo "PostgreSQL container exists - restarting to ensure fresh state..."

            # CRITICAL: Always restart to prevent zombie/hung state
            # Container may show as "running" but be unresponsive (seen 4-day old logs)
            docker restart raglite-postgresql
            echo "Waiting for restart to complete..."
            sleep 5
          else
            echo "Creating new PostgreSQL container..."
            docker run -d \
              -p 5432:5432 \
              -e POSTGRES_DB=raglite \
              -e POSTGRES_USER=raglite \
              -e POSTGRES_PASSWORD=raglite \
              --name raglite-postgresql \
              postgres:16
            echo "Waiting for initial startup..."
            sleep 8
          fi

          echo "✅ PostgreSQL container refreshed"

          # Wait for PostgreSQL to be ready (max 30 seconds)
          echo "Waiting for PostgreSQL to be ready..."

          # Debug: Check if psql is available
          if ! command -v psql &> /dev/null; then
            echo "⚠️  WARNING: psql command not found! Attempting to use docker exec instead..."
            USE_DOCKER_EXEC=true
          else
            echo "✓ psql command available"
            USE_DOCKER_EXEC=false
          fi

          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Try to connect using docker exec if psql not available
            if [ "$USE_DOCKER_EXEC" = true ]; then
              if docker exec raglite-postgresql psql -U raglite -d postgres -c "SELECT 1" > /dev/null 2>&1; then
                echo "✅ PostgreSQL is available (via docker exec)"

                # Create raglite database if missing
                docker exec raglite-postgresql psql -U raglite -d postgres -c "SELECT 1 FROM pg_database WHERE datname='raglite'" | grep -q 1 || \
                  docker exec raglite-postgresql psql -U raglite -d postgres -c "CREATE DATABASE raglite" > /dev/null 2>&1

                echo "✅ Database 'raglite' ready"
                exit 0
              fi
            else
              # Try to connect using local psql
              if PGPASSWORD=raglite psql -h localhost -p 5432 -U raglite -d postgres -c "SELECT 1" > /dev/null 2>&1; then
                echo "✅ PostgreSQL is available at localhost:5432"

                # Verify raglite database exists, create if missing
                if PGPASSWORD=raglite psql -h localhost -p 5432 -U raglite -d raglite -c "SELECT 1" > /dev/null 2>&1; then
                  echo "✅ Database 'raglite' is accessible"
                  exit 0
                else
                  echo "⚠️  Creating database 'raglite'..."
                  PGPASSWORD=raglite psql -h localhost -p 5432 -U raglite -d postgres -c "CREATE DATABASE raglite" 2>&1 | grep -v "already exists" || true
                  sleep 1
                fi
              fi
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $((RETRY_COUNT % 5)) -eq 0 ]; then
              echo "Waiting for PostgreSQL... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            fi
            sleep 1
          done

          echo "❌ PostgreSQL not available after ${MAX_RETRIES}s"
          echo ""
          echo "Debug information:"
          echo "- Container status: $(docker ps -a --filter name=raglite-postgresql --format '{{.Status}}')"
          echo "- psql available: $(command -v psql &> /dev/null && echo 'yes' || echo 'no')"
          echo ""
          echo "Container logs (last 50 lines):"
          docker logs raglite-postgresql --tail 50
          exit 1

      - name: Initialize Qdrant collection
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing Qdrant collection (financial_docs)..."
          python scripts/init-qdrant.py
          echo "✅ Qdrant collection initialized"

      - name: Initialize PostgreSQL schema
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing PostgreSQL schema (financial_chunks, financial_tables, entity_mappings)..."
          python scripts/init-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Run integration tests (CI fast mode)
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: raglite
          POSTGRES_USER: raglite
          POSTGRES_PASSWORD: raglite
          TEST_USE_FULL_PDF: "false"
        run: |
          source ci-venv/bin/activate

          # FIX: Add project root and scripts to PYTHONPATH
          # Integration tests also import from scripts directory
          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          echo "========================================="
          echo "CI MODE: Fast Testing"
          echo "- Using 10-page sample PDF (~10-15s ingestion)"
          echo "- Running core integration tests (slow tests skipped)"
          echo "- Sequential execution (shared Qdrant collection prevents parallelism)"
          echo "- Module-level service checks to prevent hangs"
          echo "- Target: 45-50 minutes total (sequential due to shared state)"
          echo "- PYTHONPATH: ${PYTHONPATH}"
          echo "========================================="
          if [ -d "tests/integration" ] && [ -n "$(find tests/integration -name 'test_*.py' -type f)" ]; then
            pytest tests/integration/ \
              -n 1 \
              -m "not slow" \
              -v \
              --junitxml=pytest-integration-report.xml
          else
            echo "⚠️  No integration tests found, skipping..."
          fi
        continue-on-error: false

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: pytest-integration-report.xml
          retention-days: 30

  # ============================================================================
  # JOB 6: E2E Tests (~28 tests)
  # ============================================================================
  test-e2e:
    name: "🎯 Tests: E2E (~28 tests)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 15
    needs: [test-unit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Run E2E tests
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "CI MODE: E2E Tests"
          echo "- Running ALL E2E tests (including slow)"
          echo "- Sequential execution (full isolation)"
          echo "- Target: <15 minutes"
          echo "========================================="
          if [ -d "tests/e2e" ] && [ -n "$(find tests/e2e -name 'test_*.py' -type f)" ]; then
            pytest tests/e2e/ \
              -n 0 \
              -m "" \
              -v \
              --junitxml=pytest-e2e-report.xml
          else
            echo "⚠️  No E2E tests found, skipping..."
          fi

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: pytest-e2e-report.xml
          retention-days: 30

  # ============================================================================
  # NFR VALIDATION
  # ============================================================================
  # NOTE: NFR6/NFR7 Accuracy Validation runs in a separate workflow:
  # .github/workflows/accuracy-validation.yml
  #
  # This is a REQUIRED CHECK on PRs to main with independent timeout (60 min).
  # Runs in parallel with main CI (~5-10 min with cache).
  # Blocks PRs that would degrade accuracy below 70% threshold.
  # ============================================================================

  # ============================================================================
  # JOB 7: Performance Validation (NFR13)
  # ============================================================================
  test-performance:
    name: "⚡ NFR: Performance Validation (NFR13)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 20
    needs: [test-integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            pytest-benchmark \
            pytest-mock>=3.15

      - name: Run performance tests
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "NFR13 Performance Validation"
          echo "- Target: <5s p50 query response"
          echo "- Target: <15s p95 query response"
          echo "- Sequential execution (accurate timing measurement)"
          echo "========================================="
          if [ -d "tests/performance" ] && [ -n "$(find tests/performance -name 'test_*.py' -type f)" ]; then
            pytest tests/performance/ \
              -n 0 \
              -v \
              --junitxml=pytest-performance-report.xml || true
          else
            echo "⚠️  No performance tests found, skipping..."
          fi
        continue-on-error: true

      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-validation-results
          path: pytest-performance-report.xml
          retention-days: 30

  # ============================================================================
  # JOB 9: Test Count Validation
  # ============================================================================
  test-count-validation:
    name: "🔢 NFR: Test Discovery Validation"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5
    needs: [test-unit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          # Enable strict error handling
          set -e
          set -o pipefail

          uv venv ci-venv
          source ci-venv/bin/activate

          echo "========================================="
          echo "Installing dependencies..."
          echo "========================================="

          # Install raglite package with all production dependencies
          # This installs all dependencies listed in pyproject.toml [project.dependencies]
          echo "Installing raglite package..."
          uv pip install -e . || {
            echo "❌ Failed to install raglite package"
            exit 1
          }

          # Install ALL test dependencies from dependency-groups
          # CRITICAL: pytest-asyncio, pytest-xdist, pytest-timeout required for test collection
          echo "Installing test dependencies..."
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15 pytest-mock || {
            echo "❌ Failed to install test dependencies"
            exit 1
          }

          # Verify installation
          echo ""
          echo "========================================="
          echo "Verifying installation..."
          echo "========================================="
          pytest --version || {
            echo "❌ pytest not installed correctly"
            exit 1
          }

          python -c "import raglite; print(f'✅ RAGLite package: {raglite.__file__}')" || {
            echo "❌ raglite package import failed"
            exit 1
          }

          python -c "import mistralai; print('✅ mistralai installed')" || {
            echo "❌ mistralai not installed - test collection will fail"
            exit 1
          }

          python -c "import qdrant_client; print('✅ qdrant_client installed')" || {
            echo "❌ qdrant_client not installed"
            exit 1
          }

          echo "✅ All dependencies installed successfully"
          echo ""

      - name: Start Qdrant for test discovery
        run: |
          echo "Ensuring Qdrant is available for test collection..."

          # Check if Qdrant is already running
          if curl -sf http://localhost:6333/collections > /dev/null 2>&1; then
            echo "✅ Qdrant already running at localhost:6333"
          else
            # Check if container exists but is stopped
            if docker ps -a --format '{{.Names}}' | grep -q "^raglite-qdrant$"; then
              echo "Qdrant container exists - starting..."
              docker start raglite-qdrant
            else
              echo "Creating new Qdrant container..."
              docker run -d \
                -p 6333:6333 \
                --name raglite-qdrant \
                qdrant/qdrant:v1.15.0
            fi

            # Wait for Qdrant to be ready
            echo "Waiting for Qdrant to be ready..."
            sleep 5

            MAX_RETRIES=20
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -sf http://localhost:6333/collections > /dev/null 2>&1; then
                echo "✅ Qdrant is ready"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 1
            done

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "⚠️  Qdrant not ready after 20s, continuing anyway..."
            fi
          fi

      - name: Start PostgreSQL for test discovery
        run: |
          echo "Ensuring PostgreSQL is available for test collection..."

          # Check if container exists
          if docker ps -a --format '{{.Names}}' | grep -q "^raglite-postgresql$"; then
            echo "PostgreSQL container exists - ensuring it's running..."

            # Check if it's actually running
            if docker ps --format '{{.Names}}' | grep -q "^raglite-postgresql$"; then
              echo "✅ PostgreSQL already running"
            else
              echo "Starting PostgreSQL container..."
              docker start raglite-postgresql
              sleep 5
            fi
          else
            echo "Creating new PostgreSQL container..."
            docker run -d \
              -p 5432:5432 \
              -e POSTGRES_DB=raglite \
              -e POSTGRES_USER=raglite \
              -e POSTGRES_PASSWORD=raglite \
              --name raglite-postgresql \
              postgres:16
            echo "Waiting for PostgreSQL startup..."
            sleep 8
          fi

          echo "✅ PostgreSQL container ready"

      - name: Validate test count
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating test discovery..."
          echo "========================================="

          # Enable strict error handling
          set -e
          set -o pipefail

          # Count total tests (including slow) - SHOW ERRORS for debugging
          # Updated 2025-11-04: Story 2.15 added 36 period_normalizer tests (355 → 391)
          EXPECTED_MIN_TESTS=390
          echo "Collecting all tests (including slow)..."

          # Capture full output for debugging
          COLLECT_OUTPUT=$(python -m pytest --collect-only -q tests/ -m "" 2>&1 | tee /tmp/pytest-collect-total.log || true)
          TOTAL_TESTS=$(echo "$COLLECT_OUTPUT" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "")

          # If collection failed or returned empty, show error and exit
          if [ -z "$TOTAL_TESTS" ]; then
            echo "❌ PYTEST TEST COLLECTION FAILED!"
            echo ""
            echo "Pytest output:"
            cat /tmp/pytest-collect-total.log
            echo ""
            echo "Debugging info:"
            echo "  Python version: $(python --version)"
            echo "  Pytest version: $(pytest --version)"
            echo "  Working directory: $(pwd)"
            echo "  Test directory exists: $([ -d tests ] && echo 'YES' || echo 'NO')"
            exit 1
          fi

          # Count fast tests (default - excludes slow)
          echo "Collecting fast tests (excluding slow)..."
          COLLECT_FAST=$(python -m pytest --collect-only -q tests/ 2>&1 | tee /tmp/pytest-collect-fast.log || true)
          FAST_TESTS=$(echo "$COLLECT_FAST" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")

          # Count slow tests
          echo "Collecting slow tests..."
          COLLECT_SLOW=$(python -m pytest --collect-only -q tests/ -m "slow" 2>&1 | tee /tmp/pytest-collect-slow.log || true)
          SLOW_TESTS=$(echo "$COLLECT_SLOW" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")

          echo ""
          echo "========================================="
          echo "Test Discovery Results:"
          echo "========================================="
          echo "Total tests (including slow): $TOTAL_TESTS"
          echo "Fast tests (default):         $FAST_TESTS"
          echo "Slow tests:                   $SLOW_TESTS"
          echo "Expected minimum:             $EXPECTED_MIN_TESTS"
          echo ""

          # Validate total test count
          if [ "$TOTAL_TESTS" -ge "$EXPECTED_MIN_TESTS" ]; then
            echo "✅ Test discovery validated ($TOTAL_TESTS tests, $SLOW_TESTS marked slow)"
          else
            echo "❌ Test count too low ($TOTAL_TESTS < $EXPECTED_MIN_TESTS)"
            echo "⚠️  Some tests may not be discovered by pytest"
            echo ""
            echo "Debugging: Showing last 20 lines of collection output:"
            tail -20 /tmp/pytest-collect-total.log
            exit 1
          fi

  # ============================================================================
  # DOCUMENTATION & SUMMARY
  # ============================================================================

  # ============================================================================
  # JOB 10: Documentation Validation
  # ============================================================================
  docs-validation:
    name: "📚 Documentation: Validation"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required architecture docs exist
        run: |
          echo "Checking for required documentation files..."
          REQUIRED_DOCS=(
            "docs/architecture/1-introduction-vision.md"
            "docs/architecture/2-executive-summary.md"
            "docs/architecture/6-complete-reference-implementation.md"
            "docs/prd/index.md"
            "CLAUDE.md"
            "README.md"
          )

          MISSING=0
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing: $doc"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Found: $doc"
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "⚠️  $MISSING required documentation file(s) missing"
            exit 1
          else
            echo "✅ All required documentation files present"
          fi

  # ============================================================================
  # JOB 11: Burn-In Loop (Flaky Test Detection)
  # ============================================================================
  burn-in:
    name: "🔥 Quality Gate: Burn-In Loop (3 iterations)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 60
    # Only run on PRs to main/develop branches
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')
    needs: [test-unit, test-integration, test-e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Verify Qdrant is available
        run: |
          echo "Checking persistent Qdrant instance..."
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf http://localhost:6333/collections > /dev/null 2>&1; then
              echo "✅ Qdrant is available at localhost:6333"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Waiting for Qdrant... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 1
          done
          echo "❌ Qdrant not available after ${MAX_RETRIES}s"
          exit 1

      - name: Start and verify PostgreSQL
        run: |
          echo "Ensuring fresh PostgreSQL container..."
          if docker ps -a --format '{{.Names}}' | grep -q "^raglite-postgresql$"; then
            echo "PostgreSQL container exists - restarting to ensure fresh state..."
            docker restart raglite-postgresql
            echo "Waiting for restart to complete..."
            sleep 5
          else
            echo "Creating new PostgreSQL container..."
            docker run -d \
              -p 5432:5432 \
              -e POSTGRES_DB=raglite \
              -e POSTGRES_USER=raglite \
              -e POSTGRES_PASSWORD=raglite \
              --name raglite-postgresql \
              postgres:16
            echo "Waiting for initial startup..."
            sleep 8
          fi
          echo "✅ PostgreSQL container refreshed"

      - name: Initialize Qdrant collection
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing Qdrant collection (financial_docs)..."
          python scripts/init-qdrant.py
          echo "✅ Qdrant collection initialized"

      - name: Initialize PostgreSQL schema
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing PostgreSQL schema (financial_chunks, financial_tables, entity_mappings)..."
          python scripts/init-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Run burn-in loop (3 iterations)
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: raglite
          POSTGRES_USER: raglite
          POSTGRES_PASSWORD: raglite
          TEST_USE_FULL_PDF: "false"
        run: |
          source ci-venv/bin/activate

          # FIX: Add project root and scripts to PYTHONPATH
          # Burn-in runs full test suite which includes tests importing from scripts
          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          echo "========================================="
          echo "🔥 BURN-IN LOOP: Flaky Test Detection"
          echo "========================================="
          echo "- Iterations: 3 (quick feedback)"
          echo "- Scope: Full test suite"
          echo "- Failure policy: ANY failure = FLAKY"
          echo "- Target: <20 minutes total"
          echo "- PYTHONPATH: ${PYTHONPATH}"
          echo "========================================="
          echo ""

          # Track failures across iterations
          FAILED_ITERATIONS=0

          for i in {1..3}; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Burn-in iteration $i/3"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""

            # Run full suite (fast tests only - skip slow)
            if pytest tests/ \
              -n 1 \
              -m "not slow" \
              -v \
              --junitxml=burn-in-iteration-$i.xml 2>&1 | tee burn-in-iteration-$i.log; then
              echo "✅ Iteration $i PASSED"
            else
              echo "❌ Iteration $i FAILED"
              FAILED_ITERATIONS=$((FAILED_ITERATIONS + 1))

              # Continue to run remaining iterations to collect all failures
              echo "⚠️  Continuing to iteration $((i + 1)) to collect failure patterns..."
            fi
            echo ""
          done

          echo ""
          echo "========================================="
          echo "🔥 BURN-IN RESULTS"
          echo "========================================="
          echo "Total iterations: 3"
          echo "Failed iterations: $FAILED_ITERATIONS"
          echo ""

          if [ $FAILED_ITERATIONS -gt 0 ]; then
            echo "❌ FLAKY TESTS DETECTED!"
            echo ""
            echo "⚠️  $FAILED_ITERATIONS out of 3 iterations failed."
            echo "This indicates non-deterministic test behavior."
            echo ""
            echo "Next steps:"
            echo "1. Review burn-in artifacts (logs + XML reports)"
            echo "2. Identify failing tests across iterations"
            echo "3. Fix flaky tests before merging"
            echo ""
            exit 1
          else
            echo "✅ ALL ITERATIONS PASSED"
            echo "No flaky tests detected - safe to merge!"
          fi

      - name: Upload burn-in artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failure-artifacts
          path: |
            burn-in-iteration-*.xml
            burn-in-iteration-*.log
          retention-days: 30

  # ============================================================================
  # JOB 12: Build Summary
  # ============================================================================
  build-summary:
    name: "📊 CI Pipeline: Summary"
    runs-on: [self-hosted, raglite]
    needs: [lint, type-check, security, test-unit, test-integration, test-e2e, test-performance, test-count-validation, docs-validation, burn-in]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "============================================================"
          echo "📊 CI PIPELINE SUMMARY"
          echo "============================================================"
          echo ""
          echo "📝 CODE QUALITY:"
          echo "  Lint & Format:     ${{ needs.lint.result }}"
          echo "  Type Check:        ${{ needs.type-check.result }}"
          echo "  Security Scan:     ${{ needs.security.result }}"
          echo ""
          echo "🧪 TEST SUITES (394 tests total):"
          echo "  Unit Tests:        ${{ needs.test-unit.result }} (~236 tests)"
          echo "  Integration:       ${{ needs.test-integration.result }} (~115 tests)"
          echo "  E2E Tests:         ${{ needs.test-e2e.result }} (~28 tests)"
          echo ""
          echo "✅ NFR VALIDATION:"
          echo "  Performance (NFR13):   ${{ needs.test-performance.result }}"
          echo "  Test Discovery:        ${{ needs.test-count-validation.result }}"
          echo ""
          echo "  NOTE: NFR6/NFR7 (Accuracy) runs in PARALLEL as required PR check:"
          echo "        .github/workflows/accuracy-validation.yml (~5-10 min with cache)"
          echo ""
          echo "🔥 QUALITY GATES:"
          echo "  Burn-In Loop:      ${{ needs.burn-in.result }} (3 iterations)"
          echo ""
          echo "📚 DOCUMENTATION:"
          echo "  Validation:        ${{ needs.docs-validation.result }}"
          echo ""
          echo "============================================================"
          echo ""

          # Critical: Unit tests must pass
          if [[ "${{ needs.test-unit.result }}" == "failure" ]]; then
            echo "❌ Unit tests failed - blocking merge"
            exit 1
          fi

          # Critical: Linting must pass
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "❌ Linting failed - blocking merge"
            exit 1
          fi

          # Critical: Test discovery must pass
          if [[ "${{ needs.test-count-validation.result }}" == "failure" ]]; then
            echo "❌ Test discovery validation failed - blocking merge"
            echo "   Some tests may not be discovered by pytest!"
            exit 1
          fi

          # Critical: Documentation must exist
          if [[ "${{ needs.docs-validation.result }}" == "failure" ]]; then
            echo "❌ Documentation validation failed - blocking merge"
            exit 1
          fi

          # Warnings for non-critical failures
          if [[ "${{ needs.type-check.result }}" == "failure" ]]; then
            echo "⚠️  Type checking issues detected (non-blocking)"
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "⚠️  Security scan issues detected (non-blocking)"
          fi

          if [[ "${{ needs.test-integration.result }}" == "failure" ]]; then
            echo "⚠️  Integration test issues detected (non-blocking)"
          fi

          if [[ "${{ needs.test-e2e.result }}" == "failure" ]]; then
            echo "⚠️  E2E test issues detected (non-blocking)"
          fi

          if [[ "${{ needs.test-performance.result }}" == "failure" ]]; then
            echo "⚠️  Performance test issues detected (non-blocking)"
            echo "   Review NFR13 compliance"
          fi

          if [[ "${{ needs.burn-in.result }}" == "failure" ]]; then
            echo "⚠️  Burn-in loop detected flaky tests (non-blocking)"
            echo "   Review burn-in artifacts to identify non-deterministic tests"
            echo "   Strongly recommended to fix before merging"
          fi

          echo ""
          echo "✅ All critical checks passed - ready to merge"
