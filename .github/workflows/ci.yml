# RAGLite CI - Consolidated Pipeline (Best Practices Aligned)
# Self-hosted runners with 24GB RAM shared across projects
#
# Architecture: 4 focused jobs in single workflow
# - lint-gate: Every push/PR, <2 min, fast feedback
# - validate: Every push/PR, <10 min, unit tests with mocked deps
# - integration: Main pushes only (or manual trigger), <30 min, full integration suite
# - accuracy-gate: Main pushes only (post-merge), <45 min, AC3 >=70% validation
#
# Execution Matrix:
# | Event              | lint | validate | int-full | accuracy |
# |--------------------|------|----------|----------|----------|
# | PR to any branch   |  ✓   |    ✓     |    ✗     |    ✗     |
# | Push to feature    |  ✓   |    ✓     |    ✗     |    ✗     |
# | Push to main       |  ✓   |    ✓     |    ✓     |    ✓     |
# | workflow_dispatch  |  ✓   |    ✓     | (if flag)| (if flag)|
#
# Note: Integration tests require real infrastructure (Qdrant/PostgreSQL) and are
# all marked @pytest.mark.slow. Unit tests in 'validate' provide fast PR feedback.
# Full integration suite runs on main for comprehensive validation.

name: CI

'on':
  push:
    branches: [main, develop, "story/**", "epic/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run full integration tests (requires containers)'
        type: boolean
        default: false
      run_accuracy_gate:
        description: 'Run accuracy validation (NFR6/NFR7)'
        type: boolean
        default: false
      # === TARGETED EXECUTION OPTIONS ===
      # Use these to run only specific failing parts and save CI time
      skip_lint:
        description: 'Skip lint gate (use when lint is green)'
        type: boolean
        default: false
      skip_validate:
        description: 'Skip unit tests (use when unit tests are green)'
        type: boolean
        default: false
      integration_shard:
        description: 'Which integration shard to run'
        type: choice
        options:
          - all
          - postgresql
          - other
          - none
        default: 'all'

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"  # Prevent .pyc generation (avoids bytecode cache pollution)
  LOKY_MAX_CPU_COUNT: "1"  # Prevent joblib multiprocessing conflicts with pytest

jobs:
  # ============================================================
  # GATE 0: Linting (fastest feedback, must pass before tests)
  # Runs on every push/PR
  # Target: <2 minutes, <1GB RAM
  # ============================================================
  lint-gate:
    name: "🔒 Lint Gate: Ruff + Black"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5
    # Skip if manually triggered with skip_lint=true
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_lint == true) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Proactive UV Cache Cleanup (Pre-Install)
        uses: ./.github/actions/validate-cache

      - name: Setup UV
        uses: ./.github/actions/setup-uv

      - name: Install linting dependencies
        run: |
          echo "Installing dependencies (linting only)..."
          uv pip install ruff black --system --quiet

      - name: Check E402 pytestmark Violations
        run: |
          echo "=== Checking for pytestmark E402 violations ==="
          python scripts/fix-pytestmark-e402.py --check
          echo "No pytestmark E402 violations found"

      - name: Lint Check (ruff)
        run: |
          echo "=== Running ruff linter ==="
          ruff check raglite/ tests/ --output-format=github
          echo "Ruff linting passed"

      - name: Format Check (black)
        run: |
          echo "=== Checking code formatting ==="
          ruff format raglite/ tests/ --check
          echo "Black formatting passed"

      - name: File Size Check
        run: |
          echo "=== Checking file sizes (500 LOC limit) ==="
          python scripts/check_file_sizes.py
          echo "File size check passed - no violations"

      - name: Mock Coverage Validation
        run: |
          echo "=== Validating get_mistral_client mock coverage ==="
          python scripts/validate-mock-coverage.py
          echo "Mock coverage validation passed"

  # ============================================================
  # TIER 1: Fast PR Validation
  # Runs on every push/PR, AFTER lint-gate passes
  # Target: <10 minutes, <4GB RAM, NO containers
  # ============================================================
  validate:
    name: "📝 Code Quality: Lint & Format"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 25
    needs: lint-gate
    # Skip if manually triggered with skip_validate=true
    # Also run if lint-gate was skipped (always() handles skipped dependencies)
    if: |
      always() &&
      !failure() &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_validate == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Proactive Cache Cleanup (Pre-Install)
        uses: ./.github/actions/validate-cache

      - name: Setup UV
        uses: ./.github/actions/setup-uv

      - name: Setup Python + UV
        run: |
          echo "Creating virtual environment..."
          uv venv ci-venv --python 3.11 --quiet 2>/dev/null || uv venv ci-venv --quiet
          source ci-venv/bin/activate
          echo "Installing dependencies (lightweight mode)..."
          uv pip install -e ".[dev]" --quiet

      - name: Type Check (mypy)
        run: |
          source ci-venv/bin/activate
          echo "Running mypy type checker..."
          mypy raglite/ --ignore-missing-imports --no-error-summary

      - name: Security Scan (bandit)
        run: |
          source ci-venv/bin/activate
          echo "Running security scan..."
          bandit -r raglite/ -ll -q -f txt --skip B608,B310

      - name: Validate Mock Patch Targets (P0-1)
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating mock patch targets exist"
          echo "Prevents stale mocks after refactoring"
          echo "Root cause: Mock targets drift during refactoring"
          echo "========================================="
          python scripts/validate-mock-targets.py --verbose
          if [ $? -ne 0 ]; then
            echo "FAIL: Invalid mock patch targets detected!"
            echo "Run: python scripts/validate-mock-targets.py --fix-suggestions"
            exit 1
          fi
          echo "Mock target validation passed"

      - name: Check isinstance Violations (P0-2)
        run: |
          echo "========================================="
          echo "Checking for isinstance usage on custom classes"
          echo "Prevents xdist parallel execution failures"
          echo "Root cause: isinstance fails with pytest-xdist"
          echo "========================================="
          bash scripts/check-isinstance-violations.sh
          if [ $? -ne 0 ]; then
            echo "FAIL: isinstance violations detected!"
            echo "See .claude/rules/testing.md for isinstance Checks with pytest-xdist"
            exit 1
          fi
          echo "isinstance validation passed"

      - name: Validate Pytest Collection (Import Errors)
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating pytest can collect all tests"
          echo "Catches import errors before test execution"
          echo "========================================="
          pytest --collect-only -q tests/ 2>&1 | tee collection.log

          # Check for actual collection errors (not test names containing 'error')
          # Look for pytest error markers at start of line, or Python exception types
          if grep -E "^(ERROR|E   |ERRORS|ModuleNotFoundError|ImportError:)" collection.log; then
            echo "FAIL: Test collection errors detected!"
            exit 1
          fi
          echo "Collection validation passed"

      - name: Validate Pytest Fixtures
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating pytest fixture resolution"
          echo "Prevents 'fixture not found' errors in CI"
          echo "========================================="
          pytest --collect-only -q tests/ 2>&1 | head -50
          # Check for fixture errors in collection
          if pytest --collect-only -q tests/ 2>&1 | grep -i "fixture.*not found"; then
            echo "FAIL: Fixture references without definitions detected!"
            exit 1
          fi
          echo "Fixture validation passed"

      - name: Verify health_check Tests Excluded
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating NO health_check tests in validate job"
          echo "========================================="
          # Collect tests with -m filter and check none are health tests
          HEALTH_COUNT=$(pytest --collect-only -q tests/ \
            --ignore=tests/health/ \
            -m "not slow and not health_check and not integration" \
            2>&1 | grep -c "tests/health/" || echo "0")

          if [ "$HEALTH_COUNT" -gt 0 ]; then
            echo "❌ FAIL: $HEALTH_COUNT health check tests would run in validate job!"
            echo "   This indicates norecursedirs or marker filtering is broken"
            pytest --collect-only -q tests/ -m "not health_check" 2>&1 | grep "tests/health/" || true
            exit 1
          fi

          echo "✅ Zero health check tests in validate job collection"

      - name: Validate xdist_group Markers (P0-3)
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating xdist_group markers on embedding tests"
          echo "Prevents 4x model load overhead in parallel tests"
          echo "Root cause: Session fixtures are per-worker with xdist"
          echo "========================================="
          python scripts/validate-xdist-markers.py --fix-suggestions
          if [ $? -ne 0 ]; then
            echo "FAIL: Missing xdist_group markers detected!"
            echo "All tests using embedding model need: pytest.mark.xdist_group(name='embedding_model')"
            exit 1
          fi
          echo "xdist_group marker validation passed"

      - name: Tests (Fast - excludes slow/health_check)
        env:
          LIGHTWEIGHT_TESTS: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Running Fast Unit Tests (excludes integration)"
          echo "Excludes: slow, health_check, integration markers"
          echo "Mode: Parallel (4 workers, default load distribution)"
          echo "========================================="
          pytest tests/ \
            --ignore=tests/health/ \
            -m "not slow and not health_check and not integration" \
            --tb=short \
            -q \
            --timeout=120 \
            -n 4 \
            --junitxml=test-results/junit.xml \
            2>&1 || exit_code=$?

          # Exit with test result
          exit ${exit_code:-0}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tier1
          path: test-results/
          retention-days: 7

  # ============================================================
  # Docker Setup (Colima) - Parallel profile initialization
  # Starts MULTIPLE Colima profiles for true parallel execution
  # Each integration shard gets its own isolated Docker daemon
  # ============================================================
  docker-setup:
    name: "🐳 Docker Setup (Profiles)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 10
    needs: [lint-gate, validate]  # Wait for both lint and code quality to finish orphan cleanup
    # Run on main push OR manual trigger with integration enabled (and not shard=none)
    if: |
      always() && !failure() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_integration == true && inputs.integration_shard != 'none')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-emptive Runner Cleanup
        run: |
          echo "=== Pre-emptive Runner Cleanup ==="

          # Get memory before cleanup
          FREE_BEFORE=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
          FREE_MB_BEFORE=$((FREE_BEFORE * 4096 / 1024 / 1024))
          echo "Memory before cleanup: ${FREE_MB_BEFORE}MB"

          # Kill zombie processes
          echo "Killing zombie processes..."
          pkill -9 -f "qemu-system" 2>/dev/null && echo "  Killed QEMU" || true
          pkill -9 -f "limactl" 2>/dev/null && echo "  Killed limactl" || true
          pkill -9 -f "lima-guestagent" 2>/dev/null && echo "  Killed lima-guestagent" || true
          pkill -9 -f "resource_tracker" 2>/dev/null && echo "  Killed resource_tracker" || true
          pkill -9 -f "multiprocessing" 2>/dev/null && echo "  Killed multiprocessing" || true

          # Stop any lingering CI Colima profiles
          echo "Stopping lingering CI profiles..."
          for PROFILE in ci-postgresql ci-other; do
            colima stop -p "$PROFILE" -f 2>/dev/null && echo "  Stopped $PROFILE" || true
          done

          # Clean Lima network state
          rm -rf "$HOME/.colima/_lima/_networks" 2>/dev/null || true

          # Wait for memory reclamation
          sleep 3

          # Report memory state
          FREE_AFTER=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
          FREE_MB_AFTER=$((FREE_AFTER * 4096 / 1024 / 1024))
          RECLAIMED=$((FREE_MB_AFTER - FREE_MB_BEFORE))
          echo "Memory after cleanup: ${FREE_MB_AFTER}MB (reclaimed: ${RECLAIMED}MB)"

      - name: Start Colima Profile for postgresql shard
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.integration_shard == 'all' || inputs.integration_shard == 'postgresql' }}
        uses: ./.github/actions/docker-preflight
        with:
          max-wait-seconds: '120'
          colima-profile: 'ci-postgresql'

      - name: Wait for Lima Network Stabilization
        if: |
          (github.event_name != 'workflow_dispatch' || inputs.integration_shard == 'all' || inputs.integration_shard == 'other') &&
          (github.event_name != 'workflow_dispatch' || inputs.integration_shard == 'all' || inputs.integration_shard == 'postgresql')
        run: |
          echo "=== Waiting 15s for Lima network state stabilization ==="
          echo "   This prevents concurrent VM operations from corrupting ~/.colima/_lima/_networks"
          sleep 15
          echo "✅ Stabilization period complete"

      - name: Start Colima Profile for other shard
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.integration_shard == 'all' || inputs.integration_shard == 'other' }}
        uses: ./.github/actions/docker-preflight
        with:
          max-wait-seconds: '120'
          colima-profile: 'ci-other'

      - name: List Running Colima Profiles
        run: |
          echo "=== Colima Profiles Running ==="
          colima list
          echo ""
          echo "=== Docker Sockets Available ==="
          ls -la ~/.colima/*/docker.sock 2>/dev/null || echo "No sockets found"

      - name: Pre-pull Docker Images (With Stabilization + Retry)
        run: |
          echo "=== Pre-pulling Docker images with VM stabilization and retry logic ==="
          echo "FIX: Use credHelpers to bypass macOS keychain (credsStore ignored due to omitempty)"

          # FIX: Use credHelpers per-registry with EXPLICIT empty strings
          # Docker's resolution order: credHelpers[registry] > credsStore > PATH auto-detection
          # Setting credsStore="" is IGNORED by Go's omitempty tag
          # credHelpers with "" explicitly disables helpers BEFORE PATH auto-detection
          DOCKER_CFG=$(mktemp -d)
          echo '{"auths":{},"credHelpers":{"docker.io":"","index.docker.io":"","registry-1.docker.io":"","ghcr.io":"","quay.io":""}}' > "$DOCKER_CFG/config.json"
          echo "Created Docker config at: $DOCKER_CFG"
          cat "$DOCKER_CFG/config.json"

          # Pre-pull images into BOTH Colima profiles
          for PROFILE in ci-postgresql ci-other; do
            echo ""
            echo "=========================================="
            echo "Pre-pulling images for profile: $PROFILE"
            echo "=========================================="

            # Set DOCKER_HOST for this profile's socket
            export DOCKER_HOST="unix://$HOME/.colima/${PROFILE}/docker.sock"
            echo "DOCKER_HOST=$DOCKER_HOST"

            # Verify socket exists
            if [ ! -S "$HOME/.colima/${PROFILE}/docker.sock" ]; then
              echo "❌ FATAL: Socket not found at $HOME/.colima/${PROFILE}/docker.sock"
              ls -la "$HOME/.colima/${PROFILE}/" 2>/dev/null || echo "Directory does not exist"
              exit 1
            fi

            # Wait for Docker daemon to be ready (max 30s)
            echo "Waiting for Docker daemon to be ready..."
            DAEMON_READY=false
            for i in 1 2 3 4 5 6; do
              if timeout 10 docker --config "$DOCKER_CFG" info >/dev/null 2>&1; then
                echo "✅ Docker daemon is ready"
                DAEMON_READY=true
                break
              fi
              echo "Daemon not ready, waiting 5s... ($i/6)"
              sleep 5
            done

            if [ "$DAEMON_READY" = "false" ]; then
              echo "❌ FATAL: Docker daemon not ready after 30s for $PROFILE"
              docker --config "$DOCKER_CFG" info 2>&1 || true
              exit 1
            fi

            # Wait for Lima VM networking to stabilize
            echo "Waiting 5s for Lima VM networking to stabilize..."
            sleep 5

            # Pull images with retry logic (3 attempts, 5s backoff)
            # Use --config flag on EVERY docker command to bypass keychain
            for IMG in "qdrant/qdrant:v1.15.0" "postgres:16"; do
              echo "Pulling $IMG into $PROFILE..."
              PULL_SUCCESS=false
              for attempt in 1 2 3; do
                if docker --config "$DOCKER_CFG" pull "$IMG" 2>&1; then
                  echo "✅ Pulled $IMG successfully"
                  PULL_SUCCESS=true
                  break
                fi
                if [ $attempt -eq 3 ]; then
                  echo "❌ FATAL: Failed to pull $IMG after 3 attempts"
                  rm -rf "$DOCKER_CFG"
                  exit 1
                fi
                echo "⚠️ Pull failed, retry $attempt/3..."
                sleep 5
              done
            done

            echo "Images in $PROFILE:"
            docker --config "$DOCKER_CFG" images | grep -E "(qdrant|postgres)" || echo "WARNING: Images may not be listed"
          done

          # Cleanup temp config
          rm -rf "$DOCKER_CFG"
          echo ""
          echo "✅ Pre-pull complete for all profiles"

      - name: Verify Images Exist in Both Profiles
        run: |
          echo "=== Verifying required images exist in both Colima profiles ==="

          # Use credHelpers to avoid keychain issues (credsStore is ignored)
          DOCKER_CFG=$(mktemp -d)
          echo '{"auths":{},"credHelpers":{"docker.io":"","index.docker.io":"","registry-1.docker.io":"","ghcr.io":"","quay.io":""}}' > "$DOCKER_CFG/config.json"

          ALL_GOOD=true
          for PROFILE in ci-postgresql ci-other; do
            echo ""
            echo "Checking profile: $PROFILE"
            export DOCKER_HOST="unix://$HOME/.colima/${PROFILE}/docker.sock"

            # Check Qdrant image
            if docker --config "$DOCKER_CFG" images qdrant/qdrant:v1.15.0 --format "{{.Repository}}:{{.Tag}}" 2>/dev/null | grep -q "qdrant"; then
              echo "✅ Qdrant image present"
            else
              echo "❌ FATAL: Qdrant image MISSING in $PROFILE"
              ALL_GOOD=false
            fi

            # Check PostgreSQL image
            if docker --config "$DOCKER_CFG" images postgres:16 --format "{{.Repository}}:{{.Tag}}" 2>/dev/null | grep -q "postgres"; then
              echo "✅ PostgreSQL image present"
            else
              echo "❌ FATAL: PostgreSQL image MISSING in $PROFILE"
              ALL_GOOD=false
            fi
          done

          rm -rf "$DOCKER_CFG"

          if [ "$ALL_GOOD" = "false" ]; then
            echo ""
            echo "❌ Image verification FAILED - some images are missing"
            echo "Integration tests will fail without these images"
            exit 1
          fi

          echo ""
          echo "✅ All required images verified in both profiles"

  # ============================================================
  # TIER 2: Full Integration Tests (Sharded for Isolation)
  # Runs on: Main branch pushes (post-merge) OR manual trigger with flag
  # Target: <60 minutes per shard (serialized with max-parallel: 1)
  # Note: Tests split into 2 shards, running sequentially to prevent memory exhaustion
  # ============================================================
  integration:
    name: "🔗 Tests: Integration (${{ matrix.shard }})"
    runs-on: [self-hosted, raglite]
    # Timeout increased from 30 to 60 minutes (2026-01-16):
    # - With max-parallel: 1, shards run serially (not in parallel)
    # - PostgreSQL shard: reached 45% in 29 min → needs ~65 min total
    # - Other shard: varies based on test count
    timeout-minutes: 60
    needs: [validate, docker-setup]
    # Run if integration is triggered AND this shard should run
    if: |
      always() && !failure() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_integration == true && inputs.integration_shard != 'none')
      )

    strategy:
      fail-fast: false
      # CRITICAL: max-parallel=1 prevents memory exhaustion on self-hosted runner
      # When both shards run simultaneously, each 4GB Colima VM competes for RAM,
      # causing VM zombie states when containers start inside them.
      # Serializing ensures only one shard uses resources at a time.
      max-parallel: 1
      matrix:
        shard: [postgresql, other]
        include:
          # Shard 1: PostgreSQL-only tests (forecasting, model_selection, external_data, insights)
          # These directories don't require the embedding model for most operations
          - shard: postgresql
            variant: shard-postgresql
            colima_profile: 'ci-postgresql'  # Dedicated Colima profile for true parallel execution
            pytest_paths: "tests/integration/forecasting/ tests/integration/model_selection/ tests/integration/external_data/ tests/integration/insights/"
            pytest_ignore: ""
            workers: 4
            description: "~230 PostgreSQL-focused tests (includes external API tests)"
          # Shard 2: Remaining integration tests (ingestion, retrieval, MCP, etc.)
          # These tests typically use the embedding model via session fixtures
          - shard: other
            variant: shard-other
            colima_profile: 'ci-other'  # Dedicated Colima profile for true parallel execution
            pytest_paths: "tests/integration/"
            pytest_ignore: "--ignore=tests/integration/forecasting/ --ignore=tests/integration/model_selection/ --ignore=tests/integration/external_data/ --ignore=tests/integration/insights/ --ignore=tests/integration/test_accuracy_validation.py --ignore=tests/integration/test_unified_validation_e2e.py"
            workers: 4
            description: "~660 tests (excludes subprocess-heavy accuracy tests)"

    steps:
      - name: Check if shard should run
        id: shard-check
        run: |
          SHARD="${{ matrix.shard }}"
          TARGET="${{ inputs.integration_shard }}"
          EVENT="${{ github.event_name }}"

          # On push events or 'all' target, always run
          if [[ "$EVENT" != "workflow_dispatch" ]] || [[ "$TARGET" == "all" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Running shard '$SHARD' (target: ${TARGET:-all})"
          elif [[ "$TARGET" == "$SHARD" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Running shard '$SHARD' (matches target)"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping shard '$SHARD' (target: $TARGET)"
          fi

      - name: Checkout code
        if: steps.shard-check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Cleanup Orphaned Processes (P0 Fix)
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Cleanup orphaned resource_tracker processes ==="
          pkill -9 -f "resource_tracker" 2>/dev/null || echo "No orphaned resource_tracker processes"
          pkill -9 -f "multiprocessing" 2>/dev/null || echo "No orphaned multiprocessing processes"
          echo "Process cleanup complete"

      - name: Cleanup Shard Container Resources
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Cleaning up shard variant resources ==="

          # Kill any processes using shard ports
          echo "Checking shard ports..."
          for PORT in 6342 6343 5437 5439; do
            if lsof -ti :${PORT} >/dev/null 2>&1; then
              echo "⚠️  Port $PORT in use, killing process..."
              lsof -ti :${PORT} | xargs kill -9 2>/dev/null || true
              sleep 0.5
            else
              echo "✅ Port $PORT available"
            fi
          done

          # Remove any orphaned shard containers
          echo "Removing orphaned shard containers..."
          docker rm -f raglite-qdrant-shard-postgresql 2>/dev/null || echo "  qdrant-shard-postgresql: not found"
          docker rm -f raglite-postgresql-shard-postgresql 2>/dev/null || echo "  postgresql-shard-postgresql: not found"
          docker rm -f raglite-qdrant-shard-other 2>/dev/null || echo "  qdrant-shard-other: not found"
          docker rm -f raglite-postgresql-shard-other 2>/dev/null || echo "  postgresql-shard-other: not found"

          echo "✅ Shard resource cleanup complete"

      - name: Clear Python bytecode & pytest cache
        if: steps.shard-check.outputs.should_run == 'true'
        uses: ./.github/actions/validate-cache

      - name: Set DOCKER_HOST for Colima Profile
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          # Each shard uses its own dedicated Colima profile for true parallel isolation
          COLIMA_PROFILE="${{ matrix.colima_profile }}"
          DOCKER_SOCKET="$HOME/.colima/${COLIMA_PROFILE}/docker.sock"
          echo "=== Setting up Colima profile: $COLIMA_PROFILE ==="
          echo "DOCKER_HOST=unix://$DOCKER_SOCKET" >> $GITHUB_ENV
          echo "✅ DOCKER_HOST will be: unix://$DOCKER_SOCKET"

      - name: Docker Pre-flight Validation
        if: steps.shard-check.outputs.should_run == 'true'
        uses: ./.github/actions/docker-preflight
        with:
          max-wait-seconds: '120'
          colima-profile: ${{ matrix.colima_profile }}
          # Port validation: ALL CI variants (source: scripts/ci/container-config.sh)
          # test:6335/5433, agentic:6337/5438, discovery:6339/5434, burnin:6340/5435
          # shard-postgresql:6342/5437, shard-other:6343/5439
          check-ports: '6335,6337,6339,6340,6342,6343,5433,5434,5435,5437,5438,5439'
          # CRITICAL FIX: Allow Colima restart to recover from VM zombie states
          # Self-hosted runners can have corrupted VMs after previous job failures
          skip-colima-restart: 'false'

      - name: Stop Other Colima Profile (Memory Optimization)
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          # CRITICAL: Stop the OTHER Colima profile to free 4GB RAM before starting containers
          # With max-parallel: 1, only one shard runs at a time, so we don't need both VMs
          CURRENT_PROFILE="${{ matrix.colima_profile }}"
          if [[ "$CURRENT_PROFILE" == "ci-postgresql" ]]; then
            OTHER_PROFILE="ci-other"
          else
            OTHER_PROFILE="ci-postgresql"
          fi

          echo "=== Memory Optimization: Stopping unused Colima profile '$OTHER_PROFILE' ==="
          if colima status -p "$OTHER_PROFILE" 2>&1 | grep -q "Running"; then
            colima stop -p "$OTHER_PROFILE" -f 2>/dev/null && echo "✅ Stopped $OTHER_PROFILE" || echo "⚠️ Could not stop $OTHER_PROFILE"
            sleep 3  # Allow memory to be reclaimed
          else
            echo "ℹ️ Profile $OTHER_PROFILE is not running"
          fi

          # Report memory state
          FREE_PAGES=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
          FREE_MB=$((FREE_PAGES * 4096 / 1024 / 1024))
          echo "Free memory after optimization: ${FREE_MB}MB"

      - name: Start Test Containers
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          chmod +x scripts/ci/start-test-containers.sh
          ./scripts/ci/start-test-containers.sh ${{ matrix.variant }}
          echo "Containers started for shard '${{ matrix.shard }}', loading environment..."
          cat .ci-env

      - name: Validate CI Credential Consistency
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Validating CI credentials against centralized config ==="
          source scripts/ci/container-config.sh
          validate_ci_credentials .github/workflows/ci.yml
          echo "Credential validation passed"

      - name: Verify Container Volume Mounts (P0 Fix)
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Verifying container volume mounts for shard '${{ matrix.shard }}' ==="
          source .ci-env

          # Get container names from .ci-env (set by container-config.sh)
          QDRANT_CONTAINER_NAME="${QDRANT_CONTAINER:-raglite-qdrant-${{ matrix.variant }}}"
          POSTGRES_CONTAINER_NAME="${POSTGRES_CONTAINER:-raglite-postgresql-${{ matrix.variant }}}"

          # Check Qdrant mount
          QDRANT_MOUNT=$(docker inspect "$QDRANT_CONTAINER_NAME" --format='{{range .Mounts}}{{println .Source}}{{end}}' 2>/dev/null || echo "")
          # Case-insensitive check for /raglite/ or /RAGLite/ in path
          if [[ -n "$QDRANT_MOUNT" ]] && [[ "${QDRANT_MOUNT,,}" != *"/raglite/"* ]]; then
            echo "WARNING: Qdrant volume mount incorrect: $QDRANT_MOUNT"
            echo "Recreating Qdrant container..."
            docker stop "$QDRANT_CONTAINER_NAME" 2>/dev/null || true
            docker rm "$QDRANT_CONTAINER_NAME" 2>/dev/null || true
            ./scripts/ci/start-test-containers.sh ${{ matrix.variant }} --qdrant-only --skip-cleanup
          else
            echo "Qdrant mount OK: $QDRANT_MOUNT"
          fi

          # Check PostgreSQL mount
          PG_MOUNT=$(docker inspect "$POSTGRES_CONTAINER_NAME" --format='{{range .Mounts}}{{println .Source}}{{end}}' 2>/dev/null || echo "")
          # Case-insensitive check for /raglite/ or /RAGLite/ in path
          if [[ -n "$PG_MOUNT" ]] && [[ "${PG_MOUNT,,}" != *"/raglite/"* ]]; then
            echo "WARNING: PostgreSQL volume mount incorrect: $PG_MOUNT"
            echo "Recreating PostgreSQL container..."
            docker stop "$POSTGRES_CONTAINER_NAME" 2>/dev/null || true
            docker rm "$POSTGRES_CONTAINER_NAME" 2>/dev/null || true
            ./scripts/ci/start-test-containers.sh ${{ matrix.variant }} --postgresql-only --skip-cleanup
          else
            echo "PostgreSQL mount OK: $PG_MOUNT"
          fi

          echo "Volume mount verification complete"

      - name: Setup UV
        if: steps.shard-check.outputs.should_run == 'true'
        uses: ./.github/actions/setup-uv

      - name: Setup Python + UV
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          uv venv ci-venv --python 3.11 --quiet 2>/dev/null || uv venv ci-venv --quiet
          source ci-venv/bin/activate
          uv pip install -e ".[dev]" --quiet

      - name: Verify Container Health
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          source ci-venv/bin/activate
          source .ci-env

          echo "=== Waiting for containers to be fully ready ==="
          sleep 5

          echo "=== Checking Qdrant connectivity (with retry) ==="
          QDRANT_OK=false
          for i in 1 2 3 4 5; do
            if python -c "from qdrant_client import QdrantClient; c = QdrantClient(host='localhost', port=${QDRANT_PORT}); c.get_collections(); print('Qdrant is healthy')" 2>&1; then
              QDRANT_OK=true
              break
            fi
            echo "Qdrant not ready, attempt $i/5, waiting 5s..."
            sleep 5
          done

          if [ "$QDRANT_OK" = "false" ]; then
            echo "❌ FATAL: Qdrant not available after 5 retries on port ${QDRANT_PORT}"
            echo "Container status:"
            docker ps -a --filter "name=qdrant" 2>/dev/null || echo "Docker not accessible"
            exit 1
          fi

          echo "=== Checking PostgreSQL connectivity (with retry) ==="
          # Credentials sourced from .ci-env (generated by container-config.sh)
          POSTGRES_OK=false
          for i in 1 2 3 4 5; do
            if python -c "import psycopg2; conn = psycopg2.connect(host='localhost', port=${POSTGRES_PORT}, database='${POSTGRES_DB}', user='${POSTGRES_USER}', password='${POSTGRES_PASSWORD}'); cur = conn.cursor(); cur.execute('SELECT 1'); print('PostgreSQL is healthy'); conn.close()" 2>&1; then
              POSTGRES_OK=true
              break
            fi
            echo "PostgreSQL not ready, attempt $i/5, waiting 5s..."
            sleep 5
          done

          if [ "$POSTGRES_OK" = "false" ]; then
            echo "❌ FATAL: PostgreSQL not available after 5 retries on port ${POSTGRES_PORT}"
            echo "Container status:"
            docker ps -a --filter "name=postgresql" 2>/dev/null || echo "Docker not accessible"
            echo "Container logs:"
            docker logs ${POSTGRES_CONTAINER} 2>&1 | tail -20 || echo "Could not get logs"
            exit 1
          fi

          echo "=== Container health verification complete ==="

      - name: Check Available Memory
        if: steps.shard-check.outputs.should_run == 'true'
        run: |
          echo "=== Memory Check Before Integration Tests ==="
          vm_stat | head -5
          # Warn if <4GB available (macOS)
          FREE_PAGES=$(vm_stat | grep "Pages free" | awk '{print $3}' | tr -d '.')
          FREE_MB=$((FREE_PAGES * 4096 / 1024 / 1024))
          echo "Approx free memory: ${FREE_MB}MB"
          if [ "$FREE_MB" -lt 4000 ]; then
            echo "WARNING: Low memory detected (<4GB free). OOM risk with parallel tests."
          fi

      - name: Run Integration Tests
        if: steps.shard-check.outputs.should_run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source ci-venv/bin/activate
          source .ci-env
          echo "========================================="
          echo "Running Integration Tests - Shard: ${{ matrix.shard }}"
          echo "Description: ${{ matrix.description }}"
          echo "Workers: ${{ matrix.workers }}"
          echo "Qdrant: localhost:${QDRANT_PORT}"
          echo "PostgreSQL: localhost:${POSTGRES_PORT}"
          echo "========================================="

          # Build pytest command with shard-specific arguments (directory-based sharding)
          pytest ${{ matrix.pytest_paths }} \
            ${{ matrix.pytest_ignore }} \
            -m "not health_check" \
            --tb=short \
            -v \
            -n ${{ matrix.workers }} \
            --dist loadgroup \
            --timeout=120 \
            --junitxml=test-results/integration-${{ matrix.shard }}-junit.xml \
            2>&1 || exit_code=$?

          exit ${exit_code:-0}

      - name: Upload Integration Results
        if: always() && steps.shard-check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Cleanup Containers
        if: always() && steps.shard-check.outputs.should_run == 'true'
        run: |
          # Ensure DOCKER_HOST is set for cleanup
          export DOCKER_HOST="unix://$HOME/.colima/${{ matrix.colima_profile }}/docker.sock"
          echo "Cleanup using DOCKER_HOST: $DOCKER_HOST"

          chmod +x scripts/ci/cleanup-test-containers.sh
          ./scripts/ci/cleanup-test-containers.sh ${{ matrix.variant }} --force || true

      - name: Cleanup Colima Profile (optional)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          # Only cleanup Colima profiles on manual runs (preserve for faster re-runs)
          echo "Stopping Colima profile: ${{ matrix.colima_profile }}"
          colima stop -p ${{ matrix.colima_profile }} 2>/dev/null || echo "Profile already stopped"

  # ============================================================
  # Integration Results Aggregation
  # Merges JUnit reports from all shards for unified reporting
  # ============================================================
  integration-aggregate:
    name: "📊 Integration Results"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5
    needs: integration
    if: always() && needs.integration.result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-integration-*
          path: test-results/
          merge-multiple: true

      - name: Setup Python
        run: |
          python3 --version

      - name: Merge JUnit Reports
        run: |
          python3 scripts/ci/merge-junit-reports.py \
            test-results/integration-*-junit.xml \
            -o test-results/integration-merged-junit.xml

      - name: Upload Merged Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-merged
          path: test-results/integration-merged-junit.xml
          retention-days: 7

      - name: Report Summary
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/integration-merged-junit.xml ]; then
            # Extract stats from merged report
            TESTS=$(grep -oP 'tests="\K[0-9]+' test-results/integration-merged-junit.xml | head -1 || echo "0")
            FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results/integration-merged-junit.xml | head -1 || echo "0")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results/integration-merged-junit.xml | head -1 || echo "0")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================
  # TIER 3: Accuracy Gate (AC3 Validation)
  # Runs on: Main branch pushes (post-merge) OR manual trigger with flag
  # Target: <45 minutes, validates >=70% accuracy
  # Note: Resource-intensive, so not run on PRs - integration tests provide pre-merge validation
  # ============================================================
  accuracy-gate:
    name: "✅ NFR: Accuracy Validation (NFR6/NFR7)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 45
    needs: integration-aggregate
    # Run even if dependencies were skipped (allows NFR-only runs)
    if: |
      always() && !failure() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_accuracy_gate == true)
      )

    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: "6335"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_DB: raglite_ci
      POSTGRES_USER: raglite_ci
      POSTGRES_PASSWORD: raglite_ci
      # API keys for LLM contextual metadata (Story 2.4)
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    steps:
      - name: Production Safety Check
        run: |
          echo "Verifying test database ports..."
          if [ "$QDRANT_PORT" = "6333" ] || [ "$POSTGRES_PORT" = "5432" ]; then
            echo "FATAL: Production ports detected!"
            echo "QDRANT_PORT=$QDRANT_PORT (should be 6335)"
            echo "POSTGRES_PORT=$POSTGRES_PORT (should be 5433)"
            exit 1
          fi
          echo "Safety check passed: Using test ports"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup Orphaned Processes (P0 Fix)
        run: |
          echo "=== Cleanup orphaned resource_tracker processes ==="
          pkill -9 -f "resource_tracker" 2>/dev/null || echo "No orphaned resource_tracker processes"
          pkill -9 -f "multiprocessing" 2>/dev/null || echo "No orphaned multiprocessing processes"
          echo "Process cleanup complete"

      - name: Clear Python bytecode & pytest cache
        uses: ./.github/actions/validate-cache

      - name: Docker Pre-flight Validation
        uses: ./.github/actions/docker-preflight
        with:
          max-wait-seconds: '120'
          check-ports: '6335,5433'
          # CRITICAL FIX: NFR may run on a different runner than Docker Setup
          # Each self-hosted runner has its own Colima VM, so we must allow
          # NFR to start its own Colima profile if needed (not skip-restart)
          skip-colima-restart: 'false'
          # Use same profile name as Docker Setup for port consistency
          colima-profile: 'ci-postgresql'
          # NFR job needs 6GB for embedding model + databases (runs alone, not in parallel)
          colima-memory: '6'

      - name: Start Test Containers
        # DOCKER_HOST inherited from docker-preflight (set in GITHUB_ENV)
        # Note: ${{ runner.home }} returns empty on self-hosted runners, so we rely on GITHUB_ENV
        run: |
          echo "Using DOCKER_HOST: $DOCKER_HOST"
          chmod +x scripts/ci/start-test-containers.sh
          ./scripts/ci/start-test-containers.sh test
          source .ci-env

      - name: Setup UV
        uses: ./.github/actions/setup-uv

      - name: Setup Python + UV
        run: |
          uv venv ci-venv --python 3.11 --quiet 2>/dev/null || uv venv ci-venv --quiet
          source ci-venv/bin/activate
          uv pip install -e ".[dev]" --quiet

      - name: Initialize Databases
        run: |
          source ci-venv/bin/activate
          echo "Initializing Qdrant collection..."
          python scripts/init-qdrant.py
          echo "Initializing PostgreSQL schema..."
          python scripts/init-test-postgresql.py

      - name: Ingest PDF for Validation
        run: |
          source ci-venv/bin/activate
          echo "Ingesting validation PDF (~15 minutes)..."
          python scripts/ingest-for-validation.py

      - name: Run AC3 Validation (>=70%)
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Epic 2 AC3 Validation (>=70% threshold)"
          echo "========================================="
          python scripts/validate-epic-2-final.py

          # Extract accuracy and validate threshold
          ACCURACY=$(python -c "import json; print(json.load(open('docs/validation/epic-2-final-validation.json'))['metrics']['overall_accuracy'])")
          echo "Accuracy: ${ACCURACY}%"

          if (( $(echo "$ACCURACY >= 70" | bc -l) )); then
            echo "PASS: AC3 accuracy gate passed (${ACCURACY}% >= 70%)"
          else
            echo "FAIL: AC3 accuracy below threshold (${ACCURACY}% < 70%)"
            exit 1
          fi

      - name: Upload Accuracy Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-validation-results
          path: docs/validation/
          retention-days: 30

      - name: Cleanup Containers
        if: always()
        # DOCKER_HOST inherited from docker-preflight (set in GITHUB_ENV)
        run: |
          echo "Cleanup using DOCKER_HOST: $DOCKER_HOST"
          chmod +x scripts/ci/cleanup-test-containers.sh
          ./scripts/ci/cleanup-test-containers.sh test --force || true
