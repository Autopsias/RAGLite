  # ============================================================================
  # JOB 8: Agentic Workflow Test Suite (Story 3.8)
  # ============================================================================
  test-agentic-workflows:
    name: "🤖 Tests: Agentic Workflow Suite (Story 3.8)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 150  # Increased from 120 to prevent runner communication timeout (30min buffer)
    # OPTIMIZED: Runs in parallel with test-integration (not blocked by it)
    # Has own PostgreSQL container (port 5438) to avoid dependency on integration setup
    needs: [docker-health-check, test-unit]

    # FIX: Share concurrency group with E2E to prevent resource competition
    concurrency:
      group: resource-heavy-tests-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15 \
            pytest-json-report \
            numpy

      - name: Verify Qdrant is available
        run: |
          echo "Checking persistent Qdrant instance..."
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf http://localhost:6333/healthz > /dev/null 2>&1; then
              echo "✅ Qdrant is available at localhost:6333"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Waiting for Qdrant... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 1
          done
          echo "❌ Qdrant not available after ${MAX_RETRIES}s"
          exit 1

      - name: Start and verify PostgreSQL (Agentic)
        run: |
          # PARALLEL OPTIMIZATION: Own container to run independently of test-integration
          # Uses unique port 5438 to avoid conflicts with other jobs
          CONTAINER_NAME="raglite-postgresql-agentic"
          CONTAINER_PORT="5438"

          echo "Ensuring PostgreSQL container '$CONTAINER_NAME' on port $CONTAINER_PORT..."

          # CRITICAL FIX: More aggressive cleanup to prevent port conflicts in CI
          # Remove ANY container using this port, not just named containers
          echo "Aggressively cleaning containers on port $CONTAINER_PORT..."
          docker ps -a --format '{{.Names}} {{.Ports}}' | grep ":${CONTAINER_PORT}->" | awk '{print $1}' | xargs -r docker rm -f || true
          sleep 3  # Increased wait time for Docker networking cleanup

          # Also kill any processes that might be holding the port
          if command -v lsof > /dev/null 2>&1; then
            lsof -ti:$CONTAINER_PORT | xargs -r kill -9 2>/dev/null || true
          fi

          # Check if container exists with correct credentials
          if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            if docker exec $CONTAINER_NAME psql -U raglite_ci -d postgres -c "SELECT 1" > /dev/null 2>&1; then
              echo "✅ Reusing existing container with correct credentials"
              if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
                docker start $CONTAINER_NAME
                sleep 5
              fi
            else
              echo "Recreating container with correct credentials and resource limits..."
              docker rm -f $CONTAINER_NAME || true
              sleep 3
              # FIX: Add resource limits to prevent container resource starvation
              docker run -d \
                -p ${CONTAINER_PORT}:5432 \
                -e POSTGRES_DB=raglite_ci \
                -e POSTGRES_USER=raglite_ci \
                -e POSTGRES_PASSWORD=raglite_ci \
                --memory="2g" \
                --cpus="2.0" \
                --name $CONTAINER_NAME \
                postgres:16
            fi
          else
            echo "Creating new PostgreSQL container with resource limits..."
            # FIX: Add resource limits to prevent container resource starvation
            docker run -d \
              -p ${CONTAINER_PORT}:5432 \
              -e POSTGRES_DB=raglite_ci \
              -e POSTGRES_USER=raglite_ci \
              -e POSTGRES_PASSWORD=raglite_ci \
              --memory="2g" \
              --cpus="2.0" \
              --name $CONTAINER_NAME \
              postgres:16
          fi

          # CRITICAL FIX: Wait for PostgreSQL to FULLY initialize
          # Check docker logs for "database system is ready to accept connections"
          echo "Waiting for PostgreSQL initialization..."
          MAX_INIT_WAIT=60
          INIT_COUNT=0

          while [ $INIT_COUNT -lt $MAX_INIT_WAIT ]; do
            if docker logs $CONTAINER_NAME 2>&1 | grep -q "database system is ready to accept connections"; then
              echo "✅ PostgreSQL initialization complete (${INIT_COUNT}s)"
              sleep 2  # Additional safety buffer
              break
            fi

            INIT_COUNT=$((INIT_COUNT + 1))
            if [ $((INIT_COUNT % 10)) -eq 0 ]; then
              echo "Waiting for initialization... (${INIT_COUNT}s/${MAX_INIT_WAIT}s)"
            fi
            sleep 1
          done

          if [ $INIT_COUNT -eq $MAX_INIT_WAIT ]; then
            echo "❌ PostgreSQL did not initialize after ${MAX_INIT_WAIT}s"
            docker logs $CONTAINER_NAME --tail 50
            exit 1
          fi

          # Wait for PostgreSQL to be ready with enhanced error handling
          MAX_RETRIES=30  # Reduced since we already waited for initialization
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if docker exec $CONTAINER_NAME psql -U raglite_ci -d raglite_ci -c "SELECT 1" > /dev/null 2>&1; then
              echo "✅ PostgreSQL is available at localhost:$CONTAINER_PORT"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $((RETRY_COUNT % 5)) -eq 0 ]; then
              echo "Waiting for PostgreSQL... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            fi
            sleep 1
          done
          echo "❌ PostgreSQL not available after ${MAX_RETRIES}s"
          echo "Container logs for debugging:"
          docker logs $CONTAINER_NAME --tail 20 || true
          exit 1

      - name: Run agentic workflow test suite
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333  # Uses persistent production Qdrant
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5438  # OPTIMIZED: Own container (not shared with integration)
          POSTGRES_DB: raglite_ci
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: "true"
        run: |
          source ci-venv/bin/activate

          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          echo "========================================="
          echo "Agentic Workflow Test Suite (Story 3.8)"
          echo "========================================="
          echo "- Test Queries: 22 (17 analytical + 5 edge cases)"
          echo "- Success Rate Target: 80%+"
          echo "- Performance: p50 <12s, p95 <20s"
          echo "- Test Set: tests/fixtures/agentic_workflow_test_set.json"
          echo "========================================="

          pytest tests/integration/test_agentic_workflow_suite.py \
            -n 0 \
            -m "slow" \
            -v \
            --json-report \
            --json-report-file=test-reports/agentic_workflow_results.json \
            --junitxml=test-reports/agentic_workflow_junit.xml
        continue-on-error: true  # Don't block CI on test failures

      - name: Generate failure analysis report
        if: always()
        run: |
          source ci-venv/bin/activate

          echo "Generating failure analysis report..."
          if [ -f "test-reports/agentic_workflow_results.json" ]; then
            python scripts/generate_failure_report.py \
              test-reports/agentic_workflow_results.json \
              test-reports/agentic_workflow_failures.json || true
          else
            echo "⚠️  No test results found, skipping failure report"
          fi

      - name: Upload agentic workflow test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentic-workflow-test-results
          path: |
            test-reports/agentic_workflow_results.json
            test-reports/agentic_workflow_failures.json
            test-reports/agentic_workflow_junit.xml
          retention-days: 30

      - name: Display test summary
        if: always()
        run: |
          if [ -f "test-reports/agentic_workflow_failures.json" ]; then
            echo "========================================="
            echo "📊 AGENTIC WORKFLOW TEST SUMMARY"
            echo "========================================="
            cat test-reports/agentic_workflow_failures.json | jq -r '
              "Total Queries: \(.total_queries)",
              "Successes: \(.successes)",
              "Failures: \(.failures)",
              "Success Rate: \(.success_rate * 100 | round)%",
              "",
              "Top Recommendation:",
              "  \(.summary.recommendation[:100])..."
            '
            echo "========================================="
          fi

  # ============================================================================
  # JOB 9: Test Coverage Enforcement
  # OPTIMIZED: Uses cached coverage from test-unit (no redundant test execution)
  # ============================================================================
  test-coverage-enforcement:
    name: "📊 Coverage Gates (AC3-AC5)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5  # Reduced from 15 - no test execution needed
    needs: [test-unit, test-integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff

      - name: Download unit test coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: .

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install coverage tools
        run: |
          set -e
          set -o pipefail

          uv venv ci-venv
          source ci-venv/bin/activate

          echo "========================================="
          echo "Installing coverage analysis tools..."
          echo "========================================="

          uv pip install coverage==7.6.1

      - name: Convert coverage.xml to JSON format
        run: |
          source ci-venv/bin/activate

          echo "========================================="
          echo "Using cached coverage from test-unit job"
          echo "========================================="

          # Verify coverage artifact was downloaded
          if [ -f "coverage.xml" ]; then
            echo "✅ Found coverage.xml from test-unit job"
            ls -la coverage.xml
          else
            echo "❌ coverage.xml not found!"
            exit 1
          fi

          # Convert XML to JSON for diff/ratchet scripts
          python3 scripts/convert_coverage_xml_to_json.py coverage.xml .coverage.json

      - name: Download baseline coverage from main
        id: download-baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci.yml
          branch: main
          name: coverage-baseline
          path: .
          if_no_artifact_found: warn

      - name: Check coverage diff (AC3 - new code ≥80%)
        run: |
          source ci-venv/bin/activate

          echo "========================================="
          echo "AC3: Coverage Gate (New Code ≥80%)"
          echo "========================================="

          if [ -f ".coverage-baseline.json" ]; then
            python scripts/check_coverage_diff.py \
              --current=.coverage.json \
              --baseline=.coverage-baseline.json \
              --threshold=80
          else
            echo "⚠️  No baseline coverage found - skipping diff check"
            echo "   This is expected for first PR or main branch builds"
            python scripts/check_coverage_diff.py \
              --current=.coverage.json \
              --threshold=80
          fi

      - name: Check coverage ratchet (AC4 - no regression)
        run: |
          source ci-venv/bin/activate

          echo "========================================="
          echo "AC4: Coverage Ratchet (No Regression)"
          echo "========================================="

          if [ -f ".coverage-baseline.json" ]; then
            python scripts/check_coverage_ratchet.py \
              --current=.coverage.json \
              --baseline=.coverage-baseline.json
          else
            echo "⚠️  No baseline coverage found - skipping ratchet check"
            echo "   This is expected for first PR or main branch builds"
          fi

      - name: Post coverage comment to PR (AC5)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          source ci-venv/bin/activate

          echo "Posting coverage comment to PR..."
          if [ -f ".coverage-baseline.json" ]; then
            python scripts/post_coverage_comment.py .coverage.json --baseline .coverage-baseline.json
          else
            python scripts/post_coverage_comment.py .coverage.json
          fi

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-html
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage baseline (for main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: .coverage.json
          retention-days: 90

      - name: Display coverage summary
        if: always()
        run: |
          source ci-venv/bin/activate

          echo "========================================="
          echo "📊 COVERAGE SUMMARY"
          echo "========================================="

          if [ -f ".coverage.json" ]; then
            python3 scripts/display_coverage_summary.py .coverage.json || echo "Failed to display coverage summary"
          fi

          echo "========================================="

  # ============================================================================
  # JOB 10: Test Count Validation
  # ============================================================================
  test-count-validation:
    name: "🔢 NFR: Test Discovery Validation"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5
    needs: [docker-health-check, test-unit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          # Enable strict error handling
          set -e
          set -o pipefail

          uv venv ci-venv
          source ci-venv/bin/activate

          echo "========================================="
          echo "Installing dependencies..."
          echo "========================================="

          # Install raglite package with all production dependencies
          # This installs all dependencies listed in pyproject.toml [project.dependencies]
          echo "Installing raglite package..."
          uv pip install -e . || {
            echo "❌ Failed to install raglite package"
            exit 1
          }

          # Install ALL test dependencies from dependency-groups
          # CRITICAL: pytest-asyncio, pytest-xdist, pytest-timeout required for test collection
          echo "Installing test dependencies..."
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15 pytest-mock || {
            echo "❌ Failed to install test dependencies"
            exit 1
          }

          # Verify installation
          echo ""
          echo "========================================="
          echo "Verifying installation..."
          echo "========================================="
          pytest --version || {
            echo "❌ pytest not installed correctly"
            exit 1
          }

          python -c "import raglite; print(f'✅ RAGLite package: {raglite.__file__}')" || {
            echo "❌ raglite package import failed"
            exit 1
          }

          python -c "import mistralai; print('✅ mistralai installed')" || {
            echo "❌ mistralai not installed - test collection will fail"
            exit 1
          }

          python -c "import qdrant_client; print('✅ qdrant_client installed')" || {
            echo "❌ qdrant_client not installed"
            exit 1
          }

          echo "✅ All dependencies installed successfully"
          echo ""

      - name: Start Qdrant for test discovery
        run: |
          echo "Ensuring Qdrant is available for test collection..."

          # ENHANCED: More robust startup for self-hosted runners
          QDRANT_PORT=6333
          QDRANT_URL="http://localhost:${QDRANT_PORT}"

          # Check if Qdrant is already running and healthy
          if curl -sf ${QDRANT_URL}/healthz > /dev/null 2>&1; then
            echo "✅ Qdrant already running and healthy at localhost:${QDRANT_PORT}"
          else
            echo "Qdrant not responsive - starting container..."

            # Enhanced cleanup for self-hosted runners
            docker ps -a --filter "name=raglite-qdrant" --format '{{.Names}}' | xargs -r docker rm -f 2>/dev/null || true
            if command -v lsof > /dev/null 2>&1; then
              lsof -ti:${QDRANT_PORT} | xargs -r kill -9 2>/dev/null || true
            fi
            sleep 3

            # Start container
            docker run -d \
              -p ${QDRANT_PORT}:6333 \
              --name raglite-qdrant \
              qdrant/qdrant:v1.15.0

            # Enhanced health check with timeout
            echo "Waiting for Qdrant to be ready (max 30s)..."
            MAX_RETRIES=30
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              # Verify container is running
              if ! docker ps --filter "name=raglite-qdrant" --format '{{.Names}}' | grep -q "raglite-qdrant"; then
                echo "❌ Container stopped unexpectedly!"
                docker logs raglite-qdrant --tail 30 || true
                exit 1
              fi

              # Check health
              if curl -sf ${QDRANT_URL}/healthz > /dev/null 2>&1; then
                echo "✅ Qdrant is ready (${RETRY_COUNT}s)"
                break
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              [ $((RETRY_COUNT % 10)) -eq 0 ] && echo "Still waiting... (${RETRY_COUNT}s/${MAX_RETRIES}s)"
              sleep 1
            done

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Qdrant not ready after ${MAX_RETRIES}s"
              docker logs raglite-qdrant --tail 50 || true
              exit 1
            fi
          fi

      - name: Start PostgreSQL for test discovery
        run: |
          # ROOT CAUSE #3 FIX: Use unique container name per job to avoid parallel job race condition
          # Test Discovery: raglite-postgresql-discovery on port 5434
          CONTAINER_NAME="raglite-postgresql-discovery"
          CONTAINER_PORT="5434"

          echo "Ensuring PostgreSQL container '$CONTAINER_NAME' with correct credentials..."

          # CRITICAL FIX: More aggressive cleanup to prevent port conflicts in CI
          # Remove ANY container using this port, not just named containers
          echo "Aggressively cleaning containers on port $CONTAINER_PORT..."
          docker ps -a --format '{{.Names}} {{.Ports}}' | grep ":${CONTAINER_PORT}->" | awk '{print $1}' | xargs -r docker rm -f || true
          sleep 3  # Increased wait time for Docker networking cleanup

          # Also kill any processes that might be holding the port
          if command -v lsof > /dev/null 2>&1; then
            lsof -ti:$CONTAINER_PORT | xargs -r kill -9 2>/dev/null || true
          fi

          # Check if container exists
          if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            echo "PostgreSQL container exists - verifying credentials..."

            # Check if container has correct user (raglite_ci)
            if docker exec $CONTAINER_NAME psql -U raglite_ci -d postgres -c "SELECT 1" > /dev/null 2>&1; then
              echo "✅ Container has correct credentials (raglite_ci) - reusing existing container"

              # Ensure it's running
              if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
                echo "Container stopped - starting it..."
                docker start $CONTAINER_NAME
                sleep 5
              fi
            else
              echo "⚠️  Container has wrong credentials - recreating with raglite_ci..."
              docker rm -f $CONTAINER_NAME
              docker volume rm ${CONTAINER_NAME}-data 2>/dev/null || true

              # Wait for Docker to release port binding
              echo "Waiting for Docker networking cleanup (port $CONTAINER_PORT)..."
              sleep 5

              docker run -d \
                -p ${CONTAINER_PORT}:5432 \
                -e POSTGRES_DB=raglite_ci \
                -e POSTGRES_USER=raglite_ci \
                -e POSTGRES_PASSWORD=raglite_ci \
                --name $CONTAINER_NAME \
                postgres:16
            fi
          else
            echo "Creating new PostgreSQL container..."
            docker run -d \
              -p ${CONTAINER_PORT}:5432 \
              -e POSTGRES_DB=raglite_ci \
              -e POSTGRES_USER=raglite_ci \
              -e POSTGRES_PASSWORD=raglite_ci \
              --name $CONTAINER_NAME \
              postgres:16
          fi

          # CRITICAL FIX: Wait for PostgreSQL to FULLY initialize
          # Check docker logs for "database system is ready to accept connections"
          echo "Waiting for PostgreSQL initialization..."
          MAX_INIT_WAIT=60
          INIT_COUNT=0

          while [ $INIT_COUNT -lt $MAX_INIT_WAIT ]; do
            if docker logs $CONTAINER_NAME 2>&1 | grep -q "database system is ready to accept connections"; then
              echo "✅ PostgreSQL initialization complete (${INIT_COUNT}s)"
              sleep 2  # Additional safety buffer
              break
            fi

            INIT_COUNT=$((INIT_COUNT + 1))
            if [ $((INIT_COUNT % 10)) -eq 0 ]; then
              echo "Waiting for initialization... (${INIT_COUNT}s/${MAX_INIT_WAIT}s)"
            fi
            sleep 1
          done

          if [ $INIT_COUNT -eq $MAX_INIT_WAIT ]; then
            echo "❌ PostgreSQL did not initialize after ${MAX_INIT_WAIT}s"
            docker logs $CONTAINER_NAME --tail 50
            exit 1
          fi

          echo "✅ PostgreSQL container ready"

      - name: Validate test count
        run: |
          source ci-venv/bin/activate
          echo "========================================="
          echo "Validating test discovery..."
          echo "========================================="

          # Enable strict error handling
          set -e
          set -o pipefail

          # Count total tests (including slow) - SHOW ERRORS for debugging
          # Updated 2025-12-18: Account for benchmark parametric tests (3000+ permutations)
          EXPECTED_MIN_TESTS=300
          EXPECTED_MAX_TESTS=5000
          echo "Collecting all tests (including slow)..."

          # Capture full output for debugging
          COLLECT_OUTPUT=$(python -m pytest --collect-only -q tests/ -m "" 2>&1 | tee /tmp/pytest-collect-total.log || true)
          TOTAL_TESTS=$(echo "$COLLECT_OUTPUT" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "")

          # If collection failed or returned empty, show error and exit
          if [ -z "$TOTAL_TESTS" ]; then
            echo "❌ PYTEST TEST COLLECTION FAILED!"
            echo ""
            echo "Pytest output:"
            cat /tmp/pytest-collect-total.log
            echo ""
            echo "Debugging info:"
            echo "  Python version: $(python --version)"
            echo "  Pytest version: $(pytest --version)"
            echo "  Working directory: $(pwd)"
            echo "  Test directory exists: $([ -d tests ] && echo 'YES' || echo 'NO')"
            exit 1
          fi

          # Count fast tests (default - excludes slow)
          echo "Collecting fast tests (excluding slow)..."
          COLLECT_FAST=$(python -m pytest --collect-only -q tests/ 2>&1 | tee /tmp/pytest-collect-fast.log || true)
          FAST_TESTS=$(echo "$COLLECT_FAST" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")

          # Count slow tests
          echo "Collecting slow tests..."
          COLLECT_SLOW=$(python -m pytest --collect-only -q tests/ -m "slow" 2>&1 | tee /tmp/pytest-collect-slow.log || true)
          SLOW_TESTS=$(echo "$COLLECT_SLOW" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")

          echo ""
          echo "========================================="
          echo "Test Discovery Results:"
          echo "========================================="
          echo "Total tests (including slow): $TOTAL_TESTS"
          echo "Fast tests (default):         $FAST_TESTS"
          echo "Slow tests:                   $SLOW_TESTS"
          echo "Expected range:               $EXPECTED_MIN_TESTS - $EXPECTED_MAX_TESTS"
          echo ""

          # Validate total test count is within expected range
          if [ "$TOTAL_TESTS" -ge "$EXPECTED_MIN_TESTS" ] && [ "$TOTAL_TESTS" -le "$EXPECTED_MAX_TESTS" ]; then
            echo "✅ Test discovery validated ($TOTAL_TESTS tests, $SLOW_TESTS marked slow)"
          elif [ "$TOTAL_TESTS" -lt "$EXPECTED_MIN_TESTS" ]; then
            echo "❌ Test count too low ($TOTAL_TESTS < $EXPECTED_MIN_TESTS)"
            echo "⚠️  Some tests may not be discovered by pytest"
            echo ""
            echo "Debugging: Showing last 20 lines of collection output:"
            tail -20 /tmp/pytest-collect-total.log
            exit 1
          else
            echo "⚠️  Test count higher than expected ($TOTAL_TESTS > $EXPECTED_MAX_TESTS)"
            echo "This might indicate benchmark test parametric explosions"
            echo "Validation continues but consider reviewing benchmark test design"
          fi

  # ============================================================================
  # DOCUMENTATION & SUMMARY
  # ============================================================================

  # ============================================================================
  # JOB 11: Documentation Validation
  # ============================================================================
  docs-validation:
    name: "📚 Documentation: Validation"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run comprehensive documentation validation
        run: |
          echo "Running comprehensive documentation validation..."
          # Use system python3 (consistent with other self-hosted jobs)
          # Avoids permission errors with actions/setup-python on self-hosted runners
          python3 scripts/validate-docs.py

  # ============================================================================
  # JOB 12: Burn-In Loop (Flaky Test Detection)
  # ============================================================================
  burn-in:
    name: "🔥 Quality Gate: Burn-In Loop (3 iterations)"
    runs-on: [self-hosted, raglite]
    timeout-minutes: 60
    # Only run on main branch post-merge (direct pushes to main)
    # Skip on: PRs to main, feature branches, develop branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-health-check, test-unit, test-integration, test-e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (network-resilient)
        run: |
          # Network-resilient uv installation with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=2

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Installing uv (attempt $attempt/$MAX_RETRIES)..."

            if curl --retry 3 --retry-delay 2 --retry-all-errors -LsSf https://astral.sh/uv/install.sh | sh; then
              echo "✅ uv installed successfully"

              # Verify installation
              if command -v uv &> /dev/null; then
                uv --version
                exit 0
              else
                echo "⚠️  uv command not found after installation"
              fi
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️  Installation attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Failed to install uv after $MAX_RETRIES attempts"
          exit 1

      - name: Install dependencies with uv
        run: |
          uv venv ci-venv
          source ci-venv/bin/activate
          uv pip install -e .
          uv pip install \
            pytest==8.4.2 \
            pytest-asyncio==1.2.0 \
            "pytest-xdist>=3.5,<4.0" \
            "pytest-timeout>=2.0,<3.0" \
            pytest-mock>=3.15

      - name: Verify Qdrant is available
        run: |
          echo "Checking persistent Qdrant instance..."
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf http://localhost:6333/healthz > /dev/null 2>&1; then
              echo "✅ Qdrant is available at localhost:6333"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Waiting for Qdrant... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 1
          done
          echo "❌ Qdrant not available after ${MAX_RETRIES}s"
          exit 1

      - name: Start and verify PostgreSQL (Burn-in)
        run: |
          # ROOT CAUSE #3 FIX: Use unique container name per job to avoid parallel job race condition
          # Burn-in Tests: raglite-postgresql-burnin on port 5435
          CONTAINER_NAME="raglite-postgresql-burnin"
          CONTAINER_PORT="5435"

          echo "Ensuring PostgreSQL container '$CONTAINER_NAME' with correct credentials..."

          # CRITICAL FIX: More aggressive cleanup to prevent port conflicts in CI
          # Remove ANY container using this port, not just named containers
          echo "Aggressively cleaning containers on port $CONTAINER_PORT..."
          docker ps -a --format '{{.Names}} {{.Ports}}' | grep ":${CONTAINER_PORT}->" | awk '{print $1}' | xargs -r docker rm -f || true
          sleep 3  # Increased wait time for Docker networking cleanup

          # Also kill any processes that might be holding the port
          if command -v lsof > /dev/null 2>&1; then
            lsof -ti:$CONTAINER_PORT | xargs -r kill -9 2>/dev/null || true
          fi

          # Check if container exists
          if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            echo "PostgreSQL container exists - verifying credentials..."

            # Check if container has correct user (raglite_ci)
            if docker exec $CONTAINER_NAME psql -U raglite_ci -d postgres -c "SELECT 1" > /dev/null 2>&1; then
              echo "✅ Container has correct credentials (raglite_ci) - reusing existing container"

              # Ensure it's running
              if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
                echo "Container stopped - starting it..."
                docker start $CONTAINER_NAME
                sleep 5
              fi
            else
              echo "⚠️  Container has wrong credentials - recreating with raglite_ci..."
              docker rm -f $CONTAINER_NAME
              docker volume rm ${CONTAINER_NAME}-data 2>/dev/null || true

              # Wait for Docker to release port binding
              echo "Waiting for Docker networking cleanup (port $CONTAINER_PORT)..."
              sleep 5

              docker run -d \
                -p ${CONTAINER_PORT}:5432 \
                -e POSTGRES_DB=raglite_ci \
                -e POSTGRES_USER=raglite_ci \
                -e POSTGRES_PASSWORD=raglite_ci \
                --name $CONTAINER_NAME \
                postgres:16
            fi
          else
            echo "Creating new PostgreSQL container..."
            docker run -d \
              -p ${CONTAINER_PORT}:5432 \
              -e POSTGRES_DB=raglite_ci \
              -e POSTGRES_USER=raglite_ci \
              -e POSTGRES_PASSWORD=raglite_ci \
              --name $CONTAINER_NAME \
              postgres:16
          fi

          # CRITICAL FIX: Wait for PostgreSQL to FULLY initialize
          # Check docker logs for "database system is ready to accept connections"
          echo "Waiting for PostgreSQL initialization..."
          MAX_INIT_WAIT=60
          INIT_COUNT=0

          while [ $INIT_COUNT -lt $MAX_INIT_WAIT ]; do
            if docker logs $CONTAINER_NAME 2>&1 | grep -q "database system is ready to accept connections"; then
              echo "✅ PostgreSQL initialization complete (${INIT_COUNT}s)"
              sleep 2  # Additional safety buffer
              break
            fi

            INIT_COUNT=$((INIT_COUNT + 1))
            if [ $((INIT_COUNT % 10)) -eq 0 ]; then
              echo "Waiting for initialization... (${INIT_COUNT}s/${MAX_INIT_WAIT}s)"
            fi
            sleep 1
          done

          if [ $INIT_COUNT -eq $MAX_INIT_WAIT ]; then
            echo "❌ PostgreSQL did not initialize after ${MAX_INIT_WAIT}s"
            docker logs $CONTAINER_NAME --tail 50
            exit 1
          fi

          echo "✅ PostgreSQL container ready"

      - name: Initialize Qdrant collection
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing Qdrant collection (financial_docs)..."
          python scripts/init-qdrant.py
          echo "✅ Qdrant collection initialized"

      - name: Initialize PostgreSQL schema
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5435
          POSTGRES_DB: raglite_ci
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
        run: |
          source ci-venv/bin/activate
          echo "🔧 Initializing PostgreSQL schema (financial_chunks, financial_tables, entity_mappings)..."
          python scripts/init-test-postgresql.py
          echo "✅ Schema initialized successfully"

      - name: Run burn-in loop (3 iterations)
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6335
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5435  # Burn-in uses unique port to avoid race condition
          POSTGRES_DB: raglite_ci
          POSTGRES_USER: raglite_ci
          POSTGRES_PASSWORD: raglite_ci
          TEST_USE_FULL_PDF: "false"
          CI: "true"
        run: |
          source ci-venv/bin/activate

          # FIX: Add project root and scripts to PYTHONPATH
          # Burn-in runs full test suite which includes tests importing from scripts
          export PYTHONPATH="${PWD}:${PWD}/scripts:${PYTHONPATH}"

          echo "========================================="
          echo "🔥 BURN-IN LOOP: Flaky Test Detection"
          echo "========================================="
          echo "- Iterations: 3 (quick feedback)"
          echo "- Scope: Full test suite"
          echo "- Failure policy: ANY failure = FLAKY"
          echo "- Target: <20 minutes total"
          echo "- PYTHONPATH: ${PYTHONPATH}"
          echo "========================================="
          echo ""

          # Track failures across iterations
          FAILED_ITERATIONS=0

          for i in {1..3}; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Burn-in iteration $i/3"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""

            # Run full suite (fast tests only - skip slow)
            # CRITICAL FIX: Use sequential execution to avoid pytest-xdist worker controller issues
            if pytest tests/ \
              -n 0 \
              -m "not slow" \
              -v \
              --junitxml=burn-in-iteration-$i.xml 2>&1 | tee burn-in-iteration-$i.log; then
              echo "✅ Iteration $i PASSED"
            else
              echo "❌ Iteration $i FAILED"
              FAILED_ITERATIONS=$((FAILED_ITERATIONS + 1))

              # Continue to run remaining iterations to collect all failures
              echo "⚠️  Continuing to iteration $((i + 1)) to collect failure patterns..."
            fi
            echo ""
          done

          echo ""
          echo "========================================="
          echo "🔥 BURN-IN RESULTS"
          echo "========================================="
          echo "Total iterations: 3"
          echo "Failed iterations: $FAILED_ITERATIONS"
          echo ""

          if [ $FAILED_ITERATIONS -gt 0 ]; then
            echo "❌ FLAKY TESTS DETECTED!"
            echo ""
            echo "⚠️  $FAILED_ITERATIONS out of 3 iterations failed."
            echo "This indicates non-deterministic test behavior."
            echo ""
            echo "Next steps:"
            echo "1. Review burn-in artifacts (logs + XML reports)"
            echo "2. Identify failing tests across iterations"
            echo "3. Fix flaky tests before merging"
            echo ""
            exit 1
          else
            echo "✅ ALL ITERATIONS PASSED"
            echo "No flaky tests detected - safe to merge!"
          fi

      - name: Upload burn-in artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failure-artifacts
          path: |
            burn-in-iteration-*.xml
            burn-in-iteration-*.log
          retention-days: 30

  # ============================================================================
  # JOB 13: Build Summary
  # ============================================================================
  build-summary:
    name: "📊 CI Pipeline: Summary"
    runs-on: [self-hosted, raglite]
    needs: [lint, file-size-check, type-check, security, test-unit, test-integration, test-e2e, test-performance, test-epic6-accuracy, test-agentic-workflows, test-coverage-enforcement, test-count-validation, docs-validation, burn-in]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "============================================================"
          echo "📊 CI PIPELINE SUMMARY"
          echo "============================================================"
          echo ""
          echo "📝 CODE QUALITY:"
          echo "  Lint & Format:     ${{ needs.lint.result }}"
          echo "  File Size Limits:  ${{ needs.file-size-check.result }}"
          echo "  Type Check:        ${{ needs.type-check.result }}"
          echo "  Security Scan:     ${{ needs.security.result }}"
          echo ""
          echo "🧪 TEST SUITES (394 tests total):"
          echo "  Unit Tests:        ${{ needs.test-unit.result }} (~236 tests)"
          echo "  Integration:       ${{ needs.test-integration.result }} (~115 tests)"
          echo "  E2E Tests:         ${{ needs.test-e2e.result }} (~28 tests)"
          echo ""
          echo "🤖 AGENTIC WORKFLOW TESTS (Epic 3):"
          echo "  Workflow Suite:    ${{ needs.test-agentic-workflows.result }} (22 analytical queries)"
          echo ""
          echo "✅ NFR VALIDATION:"
          echo "  Performance (NFR13):   ${{ needs.test-performance.result }}"
          echo "  Epic 6 Accuracy:       ${{ needs.test-epic6-accuracy.result }} (MAPE <= 12%)"
          echo "  Test Discovery:        ${{ needs.test-count-validation.result }}"
          echo ""
          echo "  NOTE: NFR6/NFR7 (Accuracy) runs in PARALLEL as required PR check:"
          echo "        .github/workflows/accuracy-validation.yml (~5-10 min with cache)"
          echo ""
          echo "🔥 QUALITY GATES:"
          echo "  Burn-In Loop:      ${{ needs.burn-in.result }} (3 iterations)"
          echo ""
          echo "📚 DOCUMENTATION:"
          echo "  Validation:        ${{ needs.docs-validation.result }}"
          echo ""
          echo "============================================================"
          echo ""

          # Critical: Unit tests must pass
          if [[ "${{ needs.test-unit.result }}" == "failure" ]]; then
            echo "❌ Unit tests failed - blocking merge"
            exit 1
          fi

          # Critical: Linting must pass
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "❌ Linting failed - blocking merge"
            exit 1
          fi

          # Critical: Test discovery must pass
          if [[ "${{ needs.test-count-validation.result }}" == "failure" ]]; then
            echo "❌ Test discovery validation failed - blocking merge"
            echo "   Some tests may not be discovered by pytest!"
            exit 1
          fi

          # Critical: Documentation must exist
          if [[ "${{ needs.docs-validation.result }}" == "failure" ]]; then
            echo "❌ Documentation validation failed - blocking merge"
            exit 1
          fi

          # Critical: Epic 6 accuracy gate (Story 6.7)
          if [[ "${{ needs.test-epic6-accuracy.result }}" == "failure" ]]; then
            echo "❌ Epic 6 accuracy gate failed (MAPE > 12%) - blocking merge"
            echo "   Review test-epic6-accuracy job and consider triggering Story 6.8"
            exit 1
          fi

          # Warnings for non-critical failures
          if [[ "${{ needs.type-check.result }}" == "failure" ]]; then
            echo "⚠️  Type checking issues detected (non-blocking)"
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "⚠️  Security scan issues detected (non-blocking)"
          fi

          if [[ "${{ needs.test-integration.result }}" == "failure" ]]; then
            echo "⚠️  Integration test issues detected (non-blocking)"
          fi

          if [[ "${{ needs.test-e2e.result }}" == "failure" ]]; then
            echo "⚠️  E2E test issues detected (non-blocking)"
          fi

          if [[ "${{ needs.test-performance.result }}" == "failure" ]]; then
            echo "⚠️  Performance test issues detected (non-blocking)"
            echo "   Review NFR13 compliance"
          fi

          if [[ "${{ needs.burn-in.result }}" == "failure" ]]; then
            echo "⚠️  Burn-in loop detected flaky tests (non-blocking)"
            echo "   Review burn-in artifacts to identify non-deterministic tests"
            echo "   Strongly recommended to fix before merging"
          fi

          echo ""
          echo "✅ All critical checks passed - ready to merge"
