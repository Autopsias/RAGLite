name: External Data Health Check

# Health checks for external API integrations
# Runs on PR creation/update affecting external data code
#
# Story: 6.9 - External Data Source Client Fixes
# Created: 2025-12-08

on:
  pull_request:
    branches: [main, epic-*]
    paths:
      # Only run when external data code changes
      - 'raglite/external_data/**'
      - 'tests/health/**'
      - '.github/workflows/external-data-health.yml'

  workflow_dispatch:
    # Allow manual trigger for debugging

# Cancel in-progress runs if new one is triggered
concurrency:
  group: external-data-health
  cancel-in-progress: true

jobs:
  health-check:
    name: External Data APIs Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-groups
          uv pip install pytest-html

      - name: Run health checks
        id: health_checks
        run: |
          # Run health checks and capture results
          # Don't fail the workflow on test failures - we want to report them
          uv run pytest tests/health/test_external_data_health.py \
            -v --tb=short \
            --junit-xml=health-results.xml \
            --html=health-report.html \
            --self-contained-html \
            2>&1 | tee health-output.txt || true

          # Count failures - use robust pattern to handle zero matches
          FAILED=$(grep -c "FAILED" health-output.txt 2>/dev/null || true)
          PASSED=$(grep -c "PASSED" health-output.txt 2>/dev/null || true)
          # Ensure variables are numeric (default to 0 if empty)
          FAILED=${FAILED:-0}
          PASSED=${PASSED:-0}
          TOTAL=$((FAILED + PASSED))

          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Set outcome based on failures
          if [ "$FAILED" -gt "0" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-check-junit
          path: health-results.xml
          retention-days: 30

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-check-html-report
          path: health-report.html
          retention-days: 30

      - name: Upload raw output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-check-output
          path: health-output.txt
          retention-days: 7

      - name: Create summary
        if: always()
        run: |
          echo "## External Data Health Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | ${{ steps.health_checks.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | ${{ steps.health_checks.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${{ steps.health_checks.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.health_checks.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.health_checks.outputs.failed }}" -gt "0" ]; then
            echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep "FAILED" health-output.txt >> $GITHUB_STEP_SUMMARY || echo "No failures found"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Action Required:** Some external APIs may have changed. Review the failures and update the affected clients." >> $GITHUB_STEP_SUMMARY
          else
            echo "All external data sources are healthy." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail workflow on health check failures
        if: steps.health_checks.outputs.status == 'failure'
        run: |
          echo "::error::External data health checks failed (${{ steps.health_checks.outputs.failed }}/${{ steps.health_checks.outputs.total }} tests)"
          echo "Review the workflow summary above for details on which APIs have changed."
          exit 1
