[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglite"
version = "1.1.0"
description = "AI-powered financial document analysis using Retrieval-Augmented Generation (RAG)"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = [
    "rag",
    "financial-analysis",
    "mcp",
    "ai",
    "llm",
    "vector-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
]

# Production dependencies
dependencies = [
    "docling==2.55.1",
    "sentence-transformers==5.1.1",
    "qdrant-client==1.15.1",
    "fastmcp==2.12.4",
    "anthropic>=0.18.0,<1.0.0",
    "openai>=1.0.0,<2.0.0", # Story 2.4: GPT-5 nano for metadata extraction
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.0,<3.0",
    "python-dateutil>=2.8,<3.0",  # Story 4.1: Fiscal date parsing for time-series extraction
    "rank-bm25==0.2.2", # Epic 2: BM25 hybrid search (Story 2.1)
    "tiktoken>=0.5.1,<1.0.0", # Story 2.2: Token counting for element-aware chunking
    "python-dotenv==1.1.1",
    "asyncio>=3.4.3,<4.0.0",
    "httpx>=0.28.1,<1.0.0",
    "mistralai>=1.9.11",
    "prophet>=1.1.5,<2.0.0",  # Story 4.2: Time-series forecasting with Prophet
    "psycopg2-binary>=2.9,<3.0", # Story 2.6: PostgreSQL for structured metadata storage
    "scikit-learn>=1.5,<2.0",  # Story 6.4: Model ensemble (Linear Regression, TimeSeriesSplit)
    "xgboost>=2.1,<3.0",       # Story 6.4: Gradient boosting ensemble
    "lightgbm>=4.5,<5.0",      # Story 6.8: LightGBM ensemble (AC4)
    "catboost>=1.2,<2.0",      # Story 6.12: CatBoost ensemble with adaptive weights
    "chronos-forecasting>=2.0,<3.0",  # Story 6.13: Chronos-2 cold-start & ensemble member
    "pytorch-forecasting>=1.0,<2.0",  # Story 6.14: TFT with training workflow
    "pytorch-lightning>=2.0,<3.0",    # Story 6.14: TFT training dependency
    "sqlalchemy>=2.0,<3.0",    # Story 6.2: ORM for external data storage
    "apscheduler>=3.10,<4.0",  # Story 6.5: Automated data refresh scheduler
    "pmdarima>=2.0,<3.0",      # Story 7.1: Auto-ARIMA model selection
    # TODO Epic 3: AWS Strands agentic framework - uncomment when implementing Story 3.1
    # "strands>=1.15.0,<2.0.0",  # Agentic orchestration (Story 3.1+)
]

[project.urls]
homepage = "https://github.com/YOUR_USERNAME/RAGLite"
repository = "https://github.com/YOUR_USERNAME/RAGLite"

[project.scripts]
raglite-server = "raglite.main:main"  # Story 6.5: Now includes scheduler integration
raglite-ingest = "scripts.init_qdrant:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==5.0.0", # Locked to 5.0.0 - works with xdist parallel execution
    "pytest-mock>=3.12,<4.0",
    "pytest-xdist>=3.5,<4.0",
    "pytest-timeout>=2.0,<3.0",
    "pytest-rerunfailures>=16.0,<17.0", # Automatic retry for flaky tests
    # Performance monitoring and reporting
    "pytest-instafail>=0.5,<1.0", # Show failures instantly
    "pytest-sugar>=1.0,<2.0", # Better progress output
    "pytest-benchmark>=4.0,<5.0", # Performance benchmarking
    # Code quality
    "black>=23.3,<24.0",
    "ruff>=0.0.270,<1.0.0",
    "isort>=5.12,<6.0",
    "mypy>=1.4,<2.0",
    "types-requests>=2.0,<3.0",
    "types-setuptools>=65.0,<70.0",
    "pre-commit>=3.0,<4.0",
    "pypdf>=4.0,<5.0",
    "pytest-ordering>=0.6",
    "types-python-dateutil>=2.9.0.20251115",
]
test = [
    "faker>=18.0,<19.0",
    "freezegun>=1.2,<2.0",
]

# ============================================================================
# BLACK CONFIGURATION (Code Formatter)
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# ============================================================================
# RUFF CONFIGURATION (Linter)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

# Exclude directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (black handles this)
    "B008",  # Do not perform function calls in argument defaults
    "C901",  # Too complex (will address in Phase 4 refactoring)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py are OK
"tests/integration/test_epic2_regression.py" = ["E402"]  # pytestmark before imports
"tests/integration/test_fixed_chunking.py" = ["E402"]  # pytestmark before imports
"tests/integration/test_metadata_injection.py" = ["E402"]  # pytestmark before imports
"tests/integration/test_table_retrieval.py" = ["E402"]  # pytestmark before imports
"raglite/forecasting/hybrid.py" = ["E402"]  # Lazy-loading pattern for Prophet
"tests/integration/test_anomaly_detection_integration.py" = ["E402"]  # pytestmark before imports
"scripts/validate-cement-forecasting-12vars.py" = ["I001"]  # Local imports with isort compatibility
"raglite/shared/models.py" = ["I001"]  # isort prefers separate datetime imports with aliases

# ============================================================================
# ISORT CONFIGURATION (Import Sorting)
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# ============================================================================
# PYTEST CONFIGURATION
# ============================================================================
# NOTE: Pytest configuration is in pytest.ini for better compatibility
# with pytest plugins and VSCode Test Explorer.
# See pytest.ini for full test configuration including:
# - Parallel execution settings (pytest-xdist)
# - Performance monitoring (--durations)
# - Test markers (unit, integration, slow, e2e)
# - Load balancing (--dist loadfile)

[tool.pytest.ini_options]
# Minimal config here - full config in pytest.ini
asyncio_mode = "auto"

# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================
[tool.coverage.run]
source = ["raglite"]
# Disable parallel mode to fix VS Code Test Explorer compatibility
# When running with pytest-xdist (-n auto), coverage handles parallel automatically
parallel = false
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "scripts/*",  # Exclude all utility/operational scripts from coverage
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true

# ============================================================================
# MYPY CONFIGURATION (Type Checking - Phase 4)
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "docling.*",
    "sentence_transformers.*",
    "qdrant_client.*",
    "openpyxl.*",
    "pandas.*",
    "rank_bm25.*",
    "torch.*",
    "transformers.*",
    "anthropic.*",
    "mistralai.*",
    "psycopg2.*",
    "PIL.*",
    "jinja2.*",
    "strands.*",
    "dateutil.*",
    "tiktoken.*",
    "fastmcp.*",
    "prophet.*",
    "scipy.*",
    "xgboost.*",
    "lightgbm.*",
    "catboost.*",
    "chronos.*",
    "pytorch_forecasting.*",
    "pytorch_lightning.*",
    "sklearn.*",
    "apscheduler.*",
    "statsmodels.*",
    "pmdarima.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# SQLAlchemy legacy ORM models - disable strict type checking for Column assignments
[[tool.mypy.overrides]]
module = ["raglite.external_data.*"]
warn_unused_ignores = false

# ============================================================================
# BANDIT CONFIGURATION (Security Linting)
# ============================================================================
[tool.bandit]
exclude_dirs = [
    "tests/",
    ".venv/",
    "venv/",
    "build/",
    "dist/",
]
# Skip common low-severity issues that are intentional in this codebase:
# B101: assert_used (defensive programming asserts after validation)
# B110: try_except_pass (intentional fallback behavior)
# B112: try_except_continue (intentional skip on failure)
# B310: urllib_urlopen (audited URL open with validation)
# B608: hardcoded_sql_expressions (parameterized internal queries)
skips = ["B101", "B110", "B112", "B310", "B608"]
